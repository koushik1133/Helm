<style>
  :root{--bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;--safe:#18a558;--warn:#e8912d;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px 60px}
  header{display:flex;align-items:center;gap:11px;padding:18px 0}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  header h1{font-size:16px;margin:0;font-weight:700} header small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:14px;margin-left:18px;font-size:13px;font-weight:600;color:var(--ink-2)} .nav a:hover{color:var(--accent)} .nav a.on{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .account button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}

  .toolbar{display:flex;align-items:center;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
  .toolbar h2{font-size:15px;margin:0;font-weight:700}
  .search{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 12px;font-family:inherit;font-size:13px;color:var(--ink);min-width:180px;flex:1;max-width:260px}
  .sel{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 10px;font-family:inherit;font-size:13px;color:var(--ink)}
  .chkbox{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff} .btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{height:32px;padding:0 11px;font-size:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .person{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
  .person.off{opacity:.6}
  .person .top{display:flex;align-items:center;gap:11px}
  .av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .person .nm{font-weight:700;font-size:15px} .person .rl{font-size:12px;color:var(--ink-3)}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
  .tag.dept{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .tag.emp{background:#e7f6ee;color:#0f7a43;border-color:transparent}
  .tag.linked{background:#e0ecff;color:#1d4ed8;border-color:transparent}
  html[data-theme="dark"] .tag.linked{background:#172a4d;color:#93c5fd}
  .av{position:relative;overflow:hidden}
  .linknote{background:var(--accent-soft);color:var(--ink-2);border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.5;margin:0 0 14px}
  .linknote a{color:var(--accent);font-weight:600;text-decoration:underline}
  .fld input[readonly]{background:var(--line-2);color:var(--ink-3);cursor:not-allowed}
  .meta{font-size:12px;color:var(--ink-3);line-height:1.5}
  .person .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
  .ic{border:1px solid var(--line);background:var(--panel);border-radius:7px;height:30px;padding:0 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)} .ic:hover{border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px;grid-column:1/-1}
  .empty .btn{margin-top:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
  @media(max-width:480px){.wrap{padding:0 16px 48px} header{flex-wrap:wrap} .nav{margin-left:0;flex-wrap:wrap} .search{max-width:none}}
  .count{font-size:12px;color:var(--ink-3)}
  footer{padding:24px 0 40px;color:var(--ink-3);font-size:12px;text-align:center}

  .lmodal{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .lmodal[hidden]{display:none!important}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(560px,96vw);max-height:90vh;overflow:auto;padding:24px}
  .sheet h3{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px}
  .sheet .close{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--ink-2)}
  .sheet p.sub{margin:0 0 16px;font-size:12px;color:var(--ink-3)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:520px){.fgrid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:4px} .fld.full{grid-column:1/-1}
  .fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .fld input,.fld select{height:38px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:0 12px;font-family:inherit;font-size:13px;color:var(--ink)}
  .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
  .err{background:#fdecec;color:#b42318;border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px}
  .lsheet{width:min(400px,96vw);text-align:center} .lsheet input{width:100%}
</style>

  <main id="main">

  <div class="toolbar">
    <h2>In-house team</h2>
    <input id="search" class="search" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" name="helmSearch" placeholder="Search name, role, skill…" aria-label="Search staff">
    <select id="deptFilter" class="sel" aria-label="Filter by department"><option value="">All departments</option></select>
    <select id="skillFilter" class="sel" aria-label="Filter by skill"><option value="">All skills</option></select>
    <label class="chkbox" title="Also show team members you've deactivated (hidden by default). Nothing changes if you haven't deactivated any."><input type="checkbox" id="showInactive"> Show inactive</label>

<!-- add / edit staff -->
<div id="staffModal" class="lmodal" hidden role="dialog" aria-modal="true" aria-labelledby="sm_title">
  <div class="sheet">
    <h3><span id="sm_title">＋ Add staff</span><button type="button" class="close" id="sm_close" aria-label="Close" data-close>×</button></h3>
    <p class="sub">Someone on your in-house team. Skills help you match people to event needs.</p>
    <div id="sm_link" class="linknote" role="note" hidden></div>
    <div class="fgrid">
      <div class="fld"><label for="s_name">Name *</label><input id="s_name" placeholder="e.g. Ravi Kumar"></div>
      <div class="fld"><label for="s_role">Role / title</label><input id="s_role" placeholder="e.g. Lead planner, AV technician"></div>
      <div class="fld"><label for="s_dept">Department</label><input id="s_dept" placeholder="e.g. Production, Catering" list="deptList"></div>
      <div class="fld"><label for="s_emp">Employment</label><select id="s_emp"><option value="">—</option><option value="full_time">Full-time</option><option value="part_time">Part-time</option><option value="on_call">On-call</option></select></div>
      <div class="fld"><label for="s_phone">Phone *</label><input id="s_phone" type="tel" inputmode="tel" autocomplete="off" maxlength="16" placeholder="+91…"></div>
      <div class="fld"><label for="s_email">Email</label><input id="s_email" type="email" autocomplete="off" placeholder="name@email.com"></div>
      <div class="fld"><label for="s_rate">Day rate (₹)</label><input id="s_rate" type="number" min="0" placeholder="optional"></div>
      <div class="fld"><label for="s_skills">Skills (comma separated)</label><input id="s_skills" placeholder="e.g. lighting, sound, forklift"></div>
      <div class="fld full"><label for="s_notes">Notes</label><input id="s_notes" placeholder="optional"></div>
    </div>
    <datalist id="deptList"></datalist>
    <div id="sm_err" class="err" role="alert" aria-live="assertive" hidden></div>
    <div class="foot">
      <button type="button" class="btn" id="sm_cancel">Cancel</button>
      <button class="btn primary" id="sm_save">Save</button>
    </div>
  </div>
</div>

<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const EMP={full_time:"Full-time",part_time:"Part-time",on_call:"On-call"};
  const initials=(n)=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"?";
  let team=[], canEdit=false, canDelete=false, editingId=null, filter="", deptF="", skillF="", showInactive=false;
  const quoteId=new URLSearchParams(location.search).get("quote")||new URLSearchParams(location.search).get("id");
  let eventCrew=new Set(), eventOnly=!!quoteId, eventCode="";

  async function renderAccount(){ const el=$("#account"); if(!BPStore.auth.enabled()){el.hidden=true;return;} el.hidden=false;
    const u=BPStore.auth.user(); if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{await BPStore.auth.signOut();location.href="dashboard.html";});
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next="+encodeURIComponent(location.pathname.split('/').pop()+location.search))); } }

  // 0041: a staff row with profile_id is linked to a Helm account (photo from the member's profile)
  let memberDir={}, isAdminUser=false;
  function personCard(s){
    const skills=Array.isArray(s.skills)?s.skills:[];
    const linked=BPStore.staff.isLinked(s), m=linked?memberDir[s.profile_id]:null, photo=m&&m.avatar_path;
    return `<div class="person ${s.active===false?'off':''}" data-id="${esc(s.id)}">
      <div class="top"><div class="av"${photo?` data-avatar-path="${esc(photo)}"`:""}>${esc(initials(s.name))}</div>
        <div><div class="nm">${esc(s.name)}</div><div class="rl">${esc(s.role||"—")}</div></div></div>
      <div class="tags">
        ${linked?`<span class="tag linked" title="Name, phone, e-mail, department and title follow this person's Helm profile">🔗 Linked account</span>`:""}
        ${s.department?`<span class="tag dept">${esc(s.department)}</span>`:""}
        ${s.emp_type?`<span class="tag emp">${esc(EMP[s.emp_type]||s.emp_type)}</span>`:""}
        ${s.active===false?`<span class="tag">Inactive</span>`:""}
      </div>
      ${skills.length?`<div class="tags">${skills.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div>`:""}
      <div class="meta">${[s.phone,s.email].filter(Boolean).map(esc).join(" · ")}${s.day_rate?`<br>₹${Number(s.day_rate).toLocaleString("en-IN")}/day`:""}</div>
      ${canEdit?`<div class="acts">
        <button class="ic" data-act="edit">Edit</button>
        <button class="ic" data-act="toggle">${s.active===false?"Reactivate":"Deactivate"}</button>
      </div>`:""}
    </div>`;
  }

  // Perf (Oct 2026): the directory is server-paged by name (filters + search on the server,
  // Load more / infinite scroll); facets + headcount come from two short columns.
  // team = people loaded so far for the current filters; teamTotal / shownTotal = counts.
  let pager=null, facets={total:0,depts:[],skills:[]}, shownTotal=0;
  function applyFacets(){
    const depts=facets.depts, skills=facets.skills;
    $("#deptFilter").innerHTML='<option value="">All departments</option>'+depts.map(d=>`<option ${d===deptF?"selected":""}>${esc(d)}</option>`).join("");
    $("#skillFilter").innerHTML='<option value="">All skills</option>'+skills.map(k=>`<option ${k===skillF?"selected":""}>${esc(k)}</option>`).join("");
    $("#deptList").innerHTML=depts.map(d=>`<option value="${esc(d)}">`).join("");
  }
  // first page for the current filters / search / event scope
  function reloadList(){
    if(!pager) pager=BPUI.pager({ after: $("#grid"), what:"staff",
      fetch:(offset)=>BPStore.staff.page({ offset, count:offset===0, includeInactive:showInactive, dept:deptF, skill:skillF,
        ids:(quoteId&&eventOnly)?[...eventCrew]:null, search:filter.trim() }).then(r=>{ if(r.total!=null) shownTotal=r.total; return r; }),
      render:(rows,info)=>{ team=info.all; render(); } });
    return pager.reset();
  }
  const reloadQuiet=()=>reloadList().catch(e=>{ $("#count").textContent=""; BPUI.loadError($("#grid"),e,reloadQuiet,{what:"staff"}); const c=$("#grid .bpui-loaderr"); if(c) c.style.gridColumn="1/-1"; });
  function render(){
    const shown=team;   // filtered on the server
    $("#count").textContent=shownTotal+" of "+facets.total;
    if(shown.length){ $("#grid").innerHTML=shown.map(personCard).join(""); try{ BPStore.chat.paintAvatars($("#grid")); }catch(e){} }
    else if(!facets.total){
      $("#grid").innerHTML=`<div class="empty">${showInactive?"No staff records yet.":"No team members yet."}${canEdit?` Add your first team member to start matching people to event needs.<br><button type="button" class="btn primary" id="emptyAdd">＋ Add your first team member</button>`:""}</div>`;
      const b=$("#emptyAdd"); if(b) b.addEventListener("click",()=>openForm(null));
    } else $("#grid").innerHTML='<div class="empty">No staff match these filters. Try clearing the search or filters.</div>';
    $("#grid").querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
      const id=b.closest(".person").dataset.id, s=team.find(x=>x.id===id);
      if(b.dataset.act==="edit") openForm(s);
      else toggleActive(s,b);
    }));
  }

  // linked rows: who they are comes from the member's profile — those fields are read-only here
  const LOCKED=[["#s_name","name"],["#s_role","role"],["#s_dept","department"],["#s_phone","phone"],["#s_email","email"]];
  function setLinkedLock(s){
    const linked=BPStore.staff.isLinked(s), note=$("#sm_link");
    LOCKED.forEach(([sel])=>{ const el=$(sel); el.readOnly=linked; if(linked) el.setAttribute("aria-readonly","true"); else el.removeAttribute("aria-readonly");
      const cc=el.parentNode&&el.parentNode.querySelector&&el.parentNode.querySelector(".bpui-tel-cc"); if(cc) cc.disabled=linked; });
    if(!linked){ note.hidden=true; note.innerHTML=""; return; }
    note.innerHTML=`🔗 <b>Linked to a Helm account.</b> Name, phone, e-mail, department and title follow ${esc(s.name||"this person")}'s profile`+
      (isAdminUser?` — <a href="control.html#users">Edit in User control</a>.`:` — an admin can change them in Control Center → User control.`)+
      ` Day rate, employment type, skills and notes stay editable here.`;
    note.hidden=false;
  }
  function openForm(s){
    editingId=s?s.id:null; $("#sm_title").textContent=s?"Edit staff":"＋ Add staff";
    $("#s_name").value=s?s.name||"":""; $("#s_role").value=s?s.role||"":""; $("#s_dept").value=s?s.department||"":"";
    $("#s_emp").value=s?s.emp_type||"":""; $("#s_phone").value=s?s.phone||"":""; $("#s_email").value=s?s.email||"":"";
    $("#s_rate").value=s&&s.day_rate!=null?s.day_rate:""; $("#s_skills").value=s&&Array.isArray(s.skills)?s.skills.join(", "):""; $("#s_notes").value=s?s.notes||"":"";
    editingRow=s||null; setLinkedLock(s);
    $("#sm_err").hidden=true; $("#staffModal").hidden=false; formDirty.clean(); setTimeout(()=>(BPStore.staff.isLinked(s)?$("#s_emp"):$("#s_name")).focus(),50);
  }
  let editingRow=null;
  const formDirty=BPUI.trackDirty($("#staffModal"));
  function closeForm(){ $("#staffModal").hidden=true; editingId=null; editingRow=null; formDirty.clean(); }
  async function requestCloseForm(){ if($("#staffModal").hidden) return; if(!(await BPUI.confirmDiscard(formDirty))) return; closeForm(); }
  async function saveStaff(){
    const fail=(m)=>{ $("#sm_err").textContent=m; $("#sm_err").hidden=false; };
    const V=BPStore.validate;
    const linked=!!(editingId&&BPStore.staff.isLinked(editingRow));
    const name=$("#s_name").value.trim();
    let phoneV={ok:true,value:editingRow&&editingRow.phone}, email=null;
    if(!linked){
      if(!name){ fail("Name is required."); return; }
      // QA M-08: a crew member needs an operational identity so they can be assigned to work
      if(!$("#s_role").value.trim() && !$("#s_dept").value.trim()){ fail("Add a role or a department so this person can be assigned to the right work."); $("#s_dept").focus(); return; }
      phoneV=V.phone($("#s_phone").value);
      if(!phoneV.ok){ fail(phoneV.error); return; }
      if($("#s_email").value.trim()){ const ev=V.email($("#s_email").value); if(!ev.ok){ fail(ev.error); return; } email=ev.value; }
    }
    let day_rate=null;
    if($("#s_rate").value!==""){ const rv=V.money($("#s_rate").value,{field:"Day rate"}); if(!rv.ok){ fail(rv.error); return; } day_rate=rv.value; }
    const skills=$("#s_skills").value.split(",").map(x=>x.trim()).filter(Boolean);
    const rec={ name, phone:phoneV.value, role:$("#s_role").value.trim()||null, department:$("#s_dept").value.trim()||null,
      emp_type:$("#s_emp").value||null, email,
      day_rate, skills, notes:$("#s_notes").value.trim()||null };
    if(linked) BPStore.staff.LINKED_FIELDS.forEach(k=>{ delete rec[k]; });   // follow the profile; the DB refuses changes here
    await BPUI.guard($("#sm_save"),async()=>{
      // one account = one staff record: a new / renumbered row can't take a linked member's number
      if(!linked && (!editingId || BPStore.staff.normPhone(rec.phone)!==BPStore.staff.normPhone(editingRow&&editingRow.phone))){
        const owner=await BPStore.staff.linkedOwnerOfPhone(rec.phone, editingId);
        if(owner){ fail(`This number belongs to ${owner.name}, who already has a staff record linked to their Helm account. Find them in the directory instead of adding a second record.`); $("#s_phone").focus(); return; }
      }
      try{ if(editingId) await BPStore.staff.update(editingId,rec); else await BPStore.staff.add(rec); closeForm(); BPUI.toast("Staff saved.",{type:"ok"}); await load(); }
      catch(e){ fail(BPStore.staff.linkErrorText(e)||BPUI.friendlyError(e,{action:"save the staff member",setupHint:"phase6-staff.sql"})); }
    },{busyLabel:"Saving…"});
  }
  async function toggleActive(s,btn){
    const reactivate=s.active===false;
    if(!reactivate && !(await BPUI.confirm(`Deactivate ${s.name}? They'll be hidden from the directory and crew pickers until reactivated.`,{title:"Deactivate staff member?",okLabel:"Deactivate"}))) return;
    await BPUI.guard(btn,async()=>{
      try{ await BPStore.staff.setActive(s.id, reactivate); BPUI.toast(reactivate?"Reactivated.":"Deactivated.",{type:"ok"}); await load(); }
      catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:reactivate?"reactivate the staff member":"deactivate the staff member"}),{type:"err"}); }
    });
  }

  function openLogin(){ $("#loginModal").hidden=false; setTimeout(()=>$("#li_email").focus(),50); }
  function closeLogin(){ $("#loginModal").hidden=true; $("#li_err").hidden=true; }
  $("#li_close").addEventListener("click",closeLogin);
  $("#loginModal").addEventListener("click",e=>{ if(e.target.id==="loginModal") closeLogin(); });
  $("#li_go").addEventListener("click",()=>{
    const em=$("#li_email").value.trim(), pw=$("#li_pass").value;
    if(!em||!pw){ $("#li_err").textContent="Enter your email and password."; $("#li_err").hidden=false; return; }
    $("#li_err").hidden=true;
    BPUI.guard($("#li_go"),async()=>{ try{ await BPStore.auth.signIn(em,pw); location.reload(); }
      catch(e){ $("#li_err").textContent=(e&&e.message)||"Sign in failed"; $("#li_err").hidden=false; } },{busyLabel:"Signing in…"});
  });

  $("#newBtn").addEventListener("click",()=>openForm(null));
  $("#sm_close").addEventListener("click",requestCloseForm);
  $("#sm_cancel").addEventListener("click",requestCloseForm);
  $("#sm_save").addEventListener("click",saveStaff);
  $("#staffModal").addEventListener("click",e=>{ if(e.target.id==="staffModal") requestCloseForm(); });
  $("#search").addEventListener("input",BPUI.debounce(e=>{ filter=$("#search").value; reloadQuiet(); },300));   // server search after a pause in typing
  $("#deptFilter").addEventListener("change",e=>{ deptF=e.target.value; reloadQuiet(); });
  $("#skillFilter").addEventListener("change",e=>{ skillF=e.target.value; reloadQuiet(); });
  $("#showInactive").addEventListener("change",e=>{ showInactive=e.target.checked; load(); });

  async function load(){
    if(quoteId){
      const [fe,q]=await Promise.allSettled([BPStore.staff.forEvent(quoteId), BPStore.quotes.get(quoteId)]);
      if(fe.status==="fulfilled") eventCrew=new Set(fe.value.map(x=>x.crew_id));
      if(q.status==="fulfilled") eventCode=q.value.code||"";
      renderEventBar();
    }
    const [lr,fr]=await Promise.allSettled([reloadList(), BPStore.staff.facets(showInactive)]);
    if(fr.status==="fulfilled") facets=fr.value;
    if(lr.status==="rejected"){ const e=lr.reason; $("#count").textContent=""; BPUI.loadError($("#grid"),e,load,{what:"staff"}); const c=$("#grid .bpui-loaderr"); if(c) c.style.gridColumn="1/-1"; return; }
    applyFacets(); render();
  }
  function renderEventBar(){
    let bar=$("#eventBar");
    if(!bar){ bar=document.createElement("div"); bar.id="eventBar";
      bar.style.cssText="margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px";
      const grid=$("#grid"); grid.parentNode.insertBefore(bar, grid.previousElementSibling||grid); }
    bar.innerHTML=`<a href="event.html?id=${encodeURIComponent(quoteId)}" style="color:var(--accent);font-weight:600">← Back to workspace</a>
      <span style="color:var(--ink-3)">Staff on <b>${esc(eventCode||"this event")}</b> — ${eventCrew.size} assigned</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn sm" id="evOnlyBtn">${eventOnly?"Showing this event":"This event only"}</button>
      <button class="btn sm" id="allStaffBtn">${eventOnly?"Show all staff":"Showing all staff"}</button>`;
    $("#evOnlyBtn").onclick=()=>{ eventOnly=true; renderEventBar(); reloadQuiet(); };
    $("#allStaffBtn").onclick=()=>{ eventOnly=false; renderEventBar(); reloadQuiet(); };
    $("#evOnlyBtn").classList.toggle("primary",eventOnly); $("#allStaffBtn").classList.toggle("primary",!eventOnly);
  }
  BPUI.boot(async ()=>{
    await BPStore.init(); await renderAccount();
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next="+encodeURIComponent(location.pathname.split('/').pop()+location.search)); return; }
    if(!(await BPStore.auth.requireView("ops"))) return;
    canEdit=await BPStore.auth.canEditArea("staff"); canDelete=await BPStore.auth.can("delete");
    isAdminUser=(await BPStore.auth.role())==="admin";
    $("#newBtn").hidden=!canEdit;
    // photos for linked members (one chat_directory read; the directory never waits for it)
    BPStore.chat.directory().then(d=>{ memberDir=d||{}; if(team.some(x=>BPStore.staff.isLinked(x))) render(); }).catch(()=>{});
    await load();
  });
</script>
</body>
</html>
