<style>
  :root{--bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#047857;--accent-2:#036b4d;--accent-soft:#e3f4ed;--safe:#18a558;--warn:#e8912d;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
  header{display:flex;align-items:center;gap:11px;padding:18px 0}
  .mark{width:30px;height:30px;border-radius:0;background:url(/brand/helm-symbol-emerald.svg?v=1) center/contain no-repeat;position:relative;flex:0 0 auto}
  .mark::after{content:none}
  header h1{font-size:16px;margin:0;font-weight:700} header small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:14px;margin-left:18px;font-size:13px;font-weight:600;color:var(--ink-2)} .nav a:hover{color:var(--accent)} .nav a.on{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .account button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}

  .toolbar{display:flex;align-items:center;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
  .toolbar h2{font-size:15px;margin:0;font-weight:700}
  .search{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 12px;font-family:inherit;font-size:13px;color:var(--ink);min-width:170px;flex:1;max-width:240px}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
  .tabs button{border:0;background:transparent;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 11px;border-radius:7px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}
  .btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff} .btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.4;cursor:default}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .v{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
  .v.off{opacity:.6}
  .v .nm{font-weight:700;font-size:15px;overflow-wrap:anywhere;min-width:0}   /* B29: a long unbroken name wraps inside the card */
  .kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px}
  .kind.vendor{background:var(--accent-soft);color:var(--accent)} .kind.freelancer{background:#f1f1f1;color:#404040}
  .kind.rental{background:#e7f6ee;color:#0f7a43} .kind.supplier{background:#fff7e6;color:#946200}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--ink-2)}
  .meta{font-size:12px;color:var(--ink-3);line-height:1.5}
  .v .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
  .ic{border:1px solid var(--line);background:var(--panel);border-radius:7px;height:30px;padding:0 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)} .ic:hover{border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:14px;grid-column:1/-1}
  .empty .btn{margin-top:12px}
  #grid > .hs-empty{grid-column:1/-1}
  .btn.sm{height:32px;padding:0 11px;font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
  @media(max-width:480px){.wrap{padding:0 16px 48px} header{flex-wrap:wrap} .nav{margin-left:0;flex-wrap:wrap} .tabs{flex-wrap:wrap} .search{max-width:none}}
  footer{padding:24px 0 40px;color:var(--ink-3);font-size:12px;text-align:center}

  .lmodal{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .lmodal[hidden]{display:none!important}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(540px,96vw);max-height:90vh;overflow:auto;padding:24px}
  .sheet h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
  .sheet .close{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--ink-2)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:480px){.fgrid{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:4px} .fld.full{grid-column:1/-1}
  .fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .fld input,.fld select{height:38px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:0 12px;font-family:inherit;font-size:13px;color:var(--ink)}
  .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
  .err{background:#fdecec;color:#b42318;border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px}
  .lsheet{width:min(400px,96vw)}
  html[data-theme="dark"] .tabs button.on{background:#047857;color:#fff}
</style>

<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const KIND={vendor:"Vendor",freelancer:"Freelancer",rental:"Rental",supplier:"Supplier"};
  let list=[], canEdit=false, canDelete=false, editingId=null, filter="", kindF="", showInactive=false;
  const quoteId=new URLSearchParams(location.search).get("quote")||new URLSearchParams(location.search).get("id");
  let eventVendors=new Set(), eventOnly=!!quoteId, eventCode="", eventBookings=0;

  async function renderAccount(){ const el=$("#account"); if(!BPStore.auth.enabled()){el.hidden=true;return;} el.hidden=false;
    const u=BPStore.auth.user(); if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{await BPStore.auth.signOut();location.href="dashboard.html";});
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next="+encodeURIComponent(HelmUrl.here()))); } }

  // Vendor → event history (which events/dates/clients this partner served).
  let ALLBOOK=[], QMAP={};
  function vendorHistory(vid){
    const seen=new Set(), out=[];
    (ALLBOOK||[]).forEach(b=>{
      if(b.vendor_id!==vid || b.status==="cancelled") return;
      if(seen.has(b.quote_id)) return; seen.add(b.quote_id);
      const q=QMAP[b.quote_id]; if(!q) return;
      out.push({ code:q.code||"", client:(q.client&&q.client.name)||"", date:q.eventDate||"", status:b.status||"" });
    });
    out.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    return out;
  }
  function card(v){
    const services=Array.isArray(v.services)?v.services:[];
    const hist=vendorHistory(v.id);
    const histHtml = hist.length
      ? `<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:4px">History · ${hist.length} event${hist.length===1?"":"s"}</div>
          ${hist.slice(0,5).map(h=>`<div style="font-size:12px;color:var(--ink-2);display:flex;gap:8px;justify-content:space-between">
             <span>${esc(h.code)}${h.client?" · "+esc(h.client):""}</span>
             <span style="color:var(--ink-3);white-space:nowrap">${esc(String(h.date||"").slice(0,10))}</span></div>`).join("")}
          ${hist.length>5?`<div style="font-size:12px;color:var(--ink-3);margin-top:3px">+${hist.length-5} more</div>`:""}
        </div>`
      : `<div class="meta" style="margin-top:8px;color:var(--ink-3);font-size:12px">No event history yet.</div>`;
    return `<div class="v ${v.active===false?'off':''}" data-id="${esc(v.id)}">
      <div style="display:flex;align-items:center;gap:8px"><span class="nm">${esc(v.name)}</span><span class="kind ${esc(v.kind||'vendor')}" style="margin-left:auto">${esc(KIND[v.kind]||v.kind||'Vendor')}</span></div>
      ${v.category?`<div class="meta">${esc(v.category)}</div>`:""}
      ${services.length?`<div class="tags">${services.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`:""}
      <div class="meta">${[v.phone?phoneTxt(v.phone):"",v.email].filter(Boolean).map(esc).join(" · ")}</div>
      ${histHtml}
      ${canEdit?`<div class="acts"><button type="button" class="ic" data-edit="${esc(v.id)}">Edit</button></div>`:""}
    </div>`;
  }
  // Perf (Oct 2026): the directory is server-paged by name (type tab, search and "this event
  // only" run on the server) with Load more / infinite scroll; each page brings the event
  // history of just its partners. list = partners loaded so far for the current filters.
  let pager=null, anyPartners=true;
  async function fetchPage(offset){
    const r=await BPStore.vendors.page({ offset, includeInactive:showInactive, kind:kindF, ids:(quoteId&&eventOnly)?[...eventVendors]:null, search:filter.trim() });
    // vendor→event history for this page: its bookings + a light lookup of those events
    try{ const bk=await BPStore.bookings.forVendors(r.rows.map(v=>v.id)); ALLBOOK=ALLBOOK.concat(bk);
      const need=[...new Set(bk.map(b=>b.quote_id).filter(id=>id&&!QMAP[id]))];
      if(need.length){ const qs=await BPStore.quotes.byIds(need); qs.forEach(q=>{ QMAP[q.id]=q; }); } }catch(_){}
    return r;
  }
  function reloadList(){
    if(!pager) pager=BPUI.pager({ after: $("#grid"), what:"partners", fetch:fetchPage, render:(rows,info)=>{ list=info.all; render(); } });
    ALLBOOK=[];
    return pager.reset();
  }
  const reloadQuiet=()=>reloadList().catch(e=>{ BPUI.loadError($("#grid"),e,reloadQuiet,{what:"partners"}); const c=$("#grid .bpui-loaderr"); if(c) c.style.gridColumn="1/-1"; });
  function render(){
    const shown=list;   // filtered on the server
    if(shown.length) $("#grid").innerHTML=shown.map(card).join("");
    else if(!anyPartners && window.HelmUI && HelmUI.emptyState){
      $("#grid").textContent="";
      $("#grid").appendChild(HelmUI.emptyState(canEdit?{icon:"🤝",title:"No partners yet",text:"Add the vendors, freelancers and rental partners you book for events.",actionLabel:"Add your first partner",onAction:()=>openForm(null)}:{icon:"🤝",title:"No partners yet",text:"Partners your studio adds will show here."}));
    }
    else if(!anyPartners){
      $("#grid").innerHTML=`<div class="empty">No partners yet.${canEdit?` Add your first vendor, freelancer or rental partner.<br><button type="button" class="btn primary" id="emptyAdd">＋ Add your first partner</button>`:""}</div>`;
      const b=$("#emptyAdd"); if(b){ b.addEventListener("click",()=>openForm(null)); gateCap(); }
    } else if(quoteId && eventOnly && !eventVendors.size){
      // r20 (live QA): "This event only" with no bookings yet is not a filter miss - say so and point at the
      // resource plan's External bookings card, where "Book a partner" lives
      $("#grid").innerHTML=`<div class="empty">No vendors booked for this event yet. <a href="resources.html?quote=${encodeURIComponent(quoteId)}#bookings" style="color:var(--accent);font-weight:600">Book a partner in the resource plan →</a></div>`;
    } else $("#grid").innerHTML='<div class="empty">No partners match this filter. Try another type or clear the search.</div>';
    $("#grid").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openForm(list.find(x=>x.id===b.dataset.edit))));
  }

  // B29: every saved number is shown the same way ("+91 98765 43210"), whether it was typed with spaces or not
  function phoneTxt(p){ const c=String(p==null?"":p).replace(/[\s\-().]/g,""); try{ if(window.HelmPhone&&HelmPhone.display&&/^\+\d{7,15}$/.test(c)) return HelmPhone.display(c); }catch(e){} return String(p==null?"":p); }
  function openForm(v){
    editingId=v?v.id:null; $("#vm_title").textContent=v?"Edit partner":"＋ Add partner";
    $("#v_name").value=v?v.name||"":""; $("#v_kind").value=v?v.kind||"vendor":"vendor"; $("#v_cat").value=v?v.category||"":"";
    $("#v_phone").value=v?v.phone||"":""; $("#v_email").value=v?v.email||"":"";
    $("#v_services").value=v&&Array.isArray(v.services)?v.services.join(", "):""; $("#v_notes").value=v?v.notes||"":"";
    $("#vm_deact").hidden=!(v&&canEdit&&v.active!==false); $("#vm_react").hidden=!(v&&canEdit&&v.active===false); $("#vm_err").hidden=true; $("#vModal").hidden=false; formDirty.clean(); if(!v) capHint(); else if(window.BPUI&&BPUI.capDialogReset) BPUI.capDialogReset($("#vm_save"),$("#vm_err"));
    if(!vFv) vFv=vFvBind(); vFv.forEach(b=>{ if(b) b.reset(); }); setTimeout(()=>$("#v_name").focus(),50);
  }
  const formDirty=BPUI.trackDirty($("#vModal"));
  // la-1018: name / phone / e-mail are checked when you leave the field (message under it), not only on Save.
  // Bound on the first open, so the phone field is already the HelmPhone component (flag + country code from the studio).
  let vFv=null;
  const vFvBind=()=>{ const HV=window.HelmValidate; if(!HV||!HV.bind) return [];
    return [ HV.bind($("#v_name"),{rule:"text",label:"Name",max:120}), HV.bind($("#v_phone"),{rule:"phone",label:"Phone"}), HV.bind($("#v_email"),{rule:"email"}) ]; };
  function closeForm(){ $("#vModal").hidden=true; editingId=null; formDirty.clean(); }
  async function requestCloseForm(){ if($("#vModal").hidden) return; if(!(await BPUI.confirmDiscard(formDirty))) return; closeForm(); }
  // B14: the trial's sample rows are named "Demo \u00b7 <name>" - the prefix is not part of the name, so
  // "AV Solutions" next to "Demo \u00b7 AV Solutions" is a possible duplicate (asked, never blocked: the sample is a stand-in)
  const isDemoRow=r=>!!(r&&(r.is_demo===true||/^\s*Demo \u00b7 /.test(String(r.name||""))));
  const dupNorm=t=>String(t==null?"":t).replace(/^\s*Demo \u00b7\s*/,"").normalize('NFKC').toLowerCase().replace(/&/g,' and ').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
  const dupDigits=p=>String(p==null?"":p).replace(/\D+/g,"").slice(-10);
  // returns {block:msg}|{ask:msg}|null — compares against ALL records incl. inactive
  function dupCheck(rows,selfId,name,phone,noun){
    const n=dupNorm(name); if(!n) return null; const pd=dupDigits(phone); let ask=null, sampleAsk=null;
    // a sample match is asked about only when the name is new or changed (editing your own record never re-asks)
    const self=selfId?(rows||[]).find(r=>r.id===selfId):null, renamed=!self||dupNorm(self.name)!==n;
    for(const r of rows||[]){
      if(r.id===selfId || dupNorm(r.name)!==n) continue;
      if(isDemoRow(r)){ if(renamed) sampleAsk=sampleAsk||`"${r.name}" is a sample ${noun} from the free-trial data. Save yours as a separate ${noun} anyway? (Clear sample data removes the sample later.)`; continue; }
      const rd=dupDigits(r.phone), tag=r.active===false?" (inactive)":"";
      if(!pd||!rd||pd===rd) return {block:`A ${noun} named "${r.name}"${tag} already exists${pd&&rd?" with this phone number":""}. Open the existing record instead of adding a duplicate${r.active===false?" (tick \"Show inactive\" and reactivate it)":""}.`};
      ask=ask||`A ${noun} named "${r.name}"${tag} already exists with a different phone number. Save this one as a separate person/partner anyway?`;
    }
    ask=ask||sampleAsk;
    return ask?{ask}:null;
  }
  async function save(){
    const fail=(m)=>{ $("#vm_err").textContent=m; $("#vm_err").hidden=false; };
    const V=BPStore.validate;
    const name=$("#v_name").value.trim(); if(!name){ fail("Name is required."); return; }
    let phone=null;
    // B15: one phone rule for every contact (BPStore.staff.phoneE164: per-country length, India = 10 digits) -
    // "+91 12345" used to pass the loose 7-15 digit check and was saved as +9112345
    if($("#v_phone").value.trim()){ const pv=BPStore.staff.phoneE164($("#v_phone").value,false); if(!pv.ok){ fail(pv.error); try{ const fv=$("#v_phone")._fv; if(fv) fv.setError(pv.error); }catch(e){} try{ $("#v_phone").focus(); }catch(e){} return; } phone=pv.value; }
    let email=null;
    if($("#v_email").value.trim()){ const ev=V.email($("#v_email").value); if(!ev.ok){ fail(ev.error); return; } email=ev.value; }
    const services=$("#v_services").value.split(",").map(x=>x.trim()).filter(Boolean);
    const rec={ name, kind:$("#v_kind").value, category:$("#v_cat").value.trim()||null, phone,
      email, services, notes:$("#v_notes").value.trim()||null };
    await BPUI.guard($("#vm_save"),async()=>{
      try{
        const all=await BPStore.vendors.listAll(true);
        const dc=dupCheck(all,editingId,name,phone,"partner");
        if(dc&&dc.block){ fail(dc.block); return; }
        if(dc&&dc.ask&&!(await BPUI.confirm(dc.ask,{title:"Possible duplicate",okLabel:"Save anyway"}))) return;
      }catch(e){ /* lookup failed: don't block the save */ }
      try{ if(editingId) await BPStore.vendors.update(editingId,rec); else await BPStore.vendors.addFull(rec); closeForm(); BPUI.toast("Partner saved.",{type:"ok"}); await load(); }
      catch(e){ if(!editingId&&BPUI.isCapError&&BPUI.isCapError(e)){ BPUI.capLimit($("#vm_err"),null,"partners"); return; } fail(BPUI.friendlyError(e,{action:"save the partner",setupHint:"phase9-vendors.sql"})); }
    },{busyLabel:"Saving…"});
  }

  function openLogin(){ $("#loginModal").hidden=false; setTimeout(()=>$("#li_email").focus(),50); }
  $("#li_go").addEventListener("click",()=>{
    const em=$("#li_email").value.trim(), pw=$("#li_pass").value;
    if(!em||!pw){ $("#li_err").textContent="Enter your email and password."; $("#li_err").hidden=false; return; }
    $("#li_err").hidden=true;
    BPUI.guard($("#li_go"),async()=>{ try{ await BPStore.auth.signIn(em,pw); location.reload(); }
      catch(e){ $("#li_err").textContent=(e&&e.message)||"Sign in failed"; $("#li_err").hidden=false; } },{busyLabel:"Signing in…"});
  });
  $("#newBtn").addEventListener("click",()=>openForm(null));
  $("#vm_close").addEventListener("click",requestCloseForm);
  $("#vm_cancel").addEventListener("click",requestCloseForm);
  $("#vm_save").addEventListener("click",save);
  if(BPUI.clearErrOnEdit) BPUI.clearErrOnEdit($("#vModal"),$("#vm_err"));   // L13: a fixed field clears the old form error
  $("#vm_deact").addEventListener("click",async()=>{ const id=editingId; if(!id) return;
    let openBk=0; try{ const bl=await BPStore.bookings.forVendors([id]); openBk=bl.filter(b=>b.status&&b.status!=="cancelled"&&b.status!=="delivered").length; }catch(e){}
    if(!(await BPUI.confirm((openBk?`This partner has ${openBk} open booking${openBk===1?"":"s"} (not yet delivered or cancelled) — existing bookings stay in place. `:"")+"Deactivate this partner? They'll be hidden from vendor pickers until reactivated.",{title:"Deactivate partner?",okLabel:"Deactivate"}))) return;
    await BPUI.guard($("#vm_deact"),async()=>{
      try{ await BPStore.vendors.update(id,{active:false}); closeForm(); BPUI.toast("Partner deactivated.",{type:"ok"}); await load(); }
      catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"deactivate the partner"}),{type:"err"}); } }); });
  $("#vm_react").addEventListener("click",async()=>{ const id=editingId; if(!id) return;
    await BPUI.guard($("#vm_react"),async()=>{
      try{ await BPStore.vendors.update(id,{active:true}); closeForm(); BPUI.toast("Partner reactivated.",{type:"ok"}); await load(); }
      catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"reactivate the partner"}),{type:"err"}); } }); });
  $("#showInactive").addEventListener("change",e=>{ showInactive=e.target.checked; load(); });
  $("#vModal").addEventListener("click",e=>{ if(e.target.id==="vModal") requestCloseForm(); });
  $("#search").addEventListener("input",BPUI.debounce(e=>{ filter=$("#search").value; reloadQuiet(); },300));   // server search after a pause in typing
  $("#kindTabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-k]"); if(!b) return;
    kindF=b.dataset.k; $("#kindTabs").querySelectorAll("button").forEach(x=>{ x.classList.toggle("on",x===b); x.setAttribute("aria-pressed",String(x===b)); }); reloadQuiet(); });

  // B29: free trial - "2 of 2 partners used" is shown by the add button (switched off at the cap), not after the form
  function gateCap(){ if(canEdit&&window.BPUI&&BPUI.capGate) BPUI.capGate([$("#newBtn"),$("#emptyAdd")],"vendors","partners").catch(()=>{}); }
  // ...and a new-record dialog opened at the cap says so at once (the server would refuse the save)
  // L13: ...with Save switched off and a "Choose a plan to add more" link (an edit switches Save back on)
  function capHint(){ if(!window.BPUI) return; if(BPUI.capDialog){ BPUI.capDialog($("#vm_save"),$("#vm_err"),"vendors","partners",()=>!editingId&&!$("#vModal").hidden); return; }
    if(!BPUI.trialCap) return; BPUI.trialCap("vendors").then(c=>{ if(c&&c.full&&!editingId&&!$("#vModal").hidden){ $("#vm_err").textContent=BPUI.capText(c,"partners"); $("#vm_err").hidden=false; } }).catch(()=>{}); }
  async function load(){
    gateCap();
    if(quoteId){
      const [b,q]=await Promise.allSettled([BPStore.bookings.list(quoteId), BPStore.quotes.get(quoteId)]);
      if(b.status==="fulfilled"){ eventBookings=b.value.length; eventVendors=new Set(b.value.map(x=>x.vendor_id).filter(Boolean)); }
      if(q.status==="fulfilled") eventCode=q.value.code||"";
      renderEventBar();
    }
    QMAP={};
    const [lr,cr]=await Promise.allSettled([reloadList(), BPStore.vendors.count(showInactive)]);
    if(lr.status==="rejected"){ const e=lr.reason; BPUI.loadError($("#grid"),e,load,{what:"partners"}); const c=$("#grid .bpui-loaderr"); if(c) c.style.gridColumn="1/-1"; return; }
    anyPartners = cr.status==="fulfilled" ? cr.value>0 : true;
    render();
  }
  function renderEventBar(){
    let bar=$("#eventBar");
    if(!bar){ bar=document.createElement("div"); bar.id="eventBar";
      bar.style.cssText="margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px";
      const grid=$("#grid"); grid.parentNode.insertBefore(bar, grid); }
    bar.innerHTML=`<a href="event.html?id=${encodeURIComponent(quoteId)}" style="color:var(--accent);font-weight:600">← Back to workspace</a>
      <span style="color:var(--ink-3)">Vendors on <b>${esc(eventCode||"this event")}</b> — ${eventBookings} booking${eventBookings===1?"":"s"}</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn sm ${eventOnly?"primary":""}" id="evOnlyBtn">This event only</button>
      <button class="btn sm ${eventOnly?"":"primary"}" id="allBtn">Show all vendors</button>`;
    $("#evOnlyBtn").onclick=()=>{ eventOnly=true; renderEventBar(); reloadQuiet(); };
    $("#allBtn").onclick=()=>{ eventOnly=false; renderEventBar(); reloadQuiet(); };
  }
  BPUI.boot(async ()=>{
    await BPStore.init(); await renderAccount();
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next="+encodeURIComponent(HelmUrl.here())); return; }
    if(!(await BPStore.auth.requireView("vendors"))) return;
    canEdit=await BPStore.auth.canEditArea("vendors"); canDelete=await BPStore.auth.can("delete");
    $("#newBtn").hidden=!canEdit;
    await load();
  });
</script>
