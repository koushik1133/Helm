<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send an enquiry · Helm</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<link rel="stylesheet" href="/enquiry.css?v=2">
</head>
<body>
<main id="main" class="eq-wrap">
  <section class="eq-card" aria-live="polite">
    <h1 id="eq-title">Send an enquiry</h1>
    <p id="eq-msg">Loading&hellip;</p>

    <form id="eq-form" class="eq-form" hidden novalidate>
      <div class="eq-grid">
        <div class="eq-full"><label for="eq-name">Your name *</label><input id="eq-name" maxlength="80" autocomplete="name" required></div>
        <div><label for="eq-phone">Phone</label><input id="eq-phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="e.g. 98765 43210"></div>
        <div><label for="eq-email">E-mail</label><input id="eq-email" type="email" maxlength="200" autocomplete="email" placeholder="name@example.com"></div>
        <p class="eq-hint eq-full">A phone number or an e-mail, so the studio can reply.</p>
        <div><label for="eq-type">Type of event</label><input id="eq-type" maxlength="60" list="eq-types" placeholder="e.g. Wedding"></div>
        <div><label for="eq-date">Event date</label><input id="eq-date" type="date"></div>
        <div><label for="eq-guests">Guests (about)</label><input id="eq-guests" type="number" inputmode="numeric" min="1" max="100000" step="1"></div>
        <div class="eq-full"><label for="eq-message">Tell us a little more (optional)</label><textarea id="eq-message" rows="4" maxlength="1000"></textarea></div>
        <div class="eq-trap" aria-hidden="true"><label for="eq-website">Website</label><input id="eq-website" tabindex="-1" autocomplete="off"></div>
        <label class="eq-consent eq-full" for="eq-consent"><input type="checkbox" id="eq-consent"> <span id="eq-consent-t">I agree that this studio may contact me about my enquiry.</span></label>
      </div>
      <datalist id="eq-types"><option value="Wedding"><option value="Reception"><option value="Engagement"><option value="Birthday"><option value="Corporate event"><option value="Religious function"><option value="Political rally"><option value="Other"></datalist>
      <div class="eq-captcha" id="eq-captcha" hidden></div>
      <p id="eq-err" class="eq-err" role="alert" hidden></p>
      <button type="submit" class="eq-btn" id="eq-send">Send enquiry</button>
    </form>

    <p class="eq-foot">Your details go only to this studio. <a href="/privacy">Privacy</a> &middot; Powered by Helm</p>
  </section>
</main>
<script src="/trusted-types.js?v=5"></script>
<script src="/config.js?v=113"></script>
<script src="/country-profile.js?v=7"></script>
<script src="/captcha.js?v=2"></script>
<script src="/enquiry.js?v=3"></script>
</body>
</html>
