<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist templates — Blueprint Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#8b8698;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;--safe:#18a558;--warn:#e8912d;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px 60px}
  header{display:flex;align-items:center;gap:11px;padding:18px 0}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  header h1{font-size:16px;margin:0;font-weight:700} header small{display:block;font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:14px;margin-left:18px;font-size:13px;font-weight:600;color:var(--ink-2)} .nav a:hover{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .account button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 4px} .card .sub{font-size:12px;color:var(--ink-3);margin:0 0 12px}
  .fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px} .fld label{font-size:11px;font-weight:600;color:var(--ink-2)}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--ink)}
  .fld input,.fld select{height:38px;padding:0 12px} .fld textarea{min-height:96px;resize:vertical;font-family:var(--mono);font-size:12px}
  .row2{display:grid;grid-template-columns:2fr 1fr;gap:10px} @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .btn{height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer} .btn:hover{border-color:var(--accent)}
  .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
  .tpl{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .tpl .h{display:flex;align-items:center;gap:8px} .tpl .h b{font-size:14px}
  .badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .tpl ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
  .rm{border:1px solid var(--line);background:var(--panel);border-radius:7px;height:28px;padding:0 9px;font-size:11px;cursor:pointer;color:var(--ink-3)} .rm:hover{color:#e5484d;border-color:#f5c6c6}
  .lnk{border:1px solid var(--line);background:var(--panel);border-radius:7px;height:28px;padding:0 9px;font-size:11px;cursor:pointer;color:var(--ink-2)} .lnk:hover{border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--ink-3);padding:22px;font-size:13px}
  footer{padding:24px 0 40px;color:var(--ink-3);font-size:12px;text-align:center}
  .err{background:#fdecec;color:#b42318;border-radius:8px;padding:8px 12px;font-size:12px}
  .lmodal{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .lmodal[hidden]{display:none!important}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(380px,96vw);padding:24px}
  .sheet h3{margin:0 0 12px}.foot{display:flex;gap:10px;justify-content:flex-end}
</style>
<link rel="stylesheet" href="theme.css?v=67">
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="mark" title="Home"></a>
    <div><h1>Checklist templates</h1><small>Blueprint Stage</small></div>
    <nav class="nav"><a href="index.html">Home</a><a href="quotes.html">Quotes</a></nav>
    <span class="spacer"></span>
    <span id="account" class="account" hidden></span>
  </header>

  <div id="gate" class="card" hidden><p style="color:var(--ink-3)">Sign in to manage templates.</p></div>

  <div id="app" hidden>
    <div class="card" id="editCard" hidden>
      <h2 id="formTitle">New template</h2>
      <p class="sub">Turn a lesson learned into a reusable checklist. Apply it to any event from Logistics.</p>
      <div class="row2">
        <div class="fld"><label>Template name</label><input id="t_name" placeholder="e.g. Outdoor wedding — logistics"></div>
        <div class="fld"><label>Section</label><select id="t_section"><option value="logistics">Logistics</option><option value="compliance">Permits</option><option value="comms">Comms</option><option value="guests">Guests</option></select></div>
      </div>
      <div class="fld"><label>Checklist items — one per line</label><textarea id="t_items" placeholder="Confirm vendor load-in times&#10;Book generator backup&#10;Share run-sheet with crew"></textarea></div>
      <div class="foot"><span id="t_msg" style="margin-right:auto;font-size:12px;color:var(--safe)"></span><button class="btn" id="t_cancel" hidden>Cancel</button><button class="btn primary" id="t_save">Save template</button></div>
      <div id="t_err" class="err" hidden style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Templates</h2>
      <div id="tplList"><div class="empty">Loading…</div></div>
    </div>
  </div>
  <footer>Blueprint Stage — reusable checklists so every event starts from your best practice.</footer>
</div>

<div id="loginModal" class="lmodal" hidden>
  <div class="sheet">
    <h3>Sign in</h3>
    <div class="fld"><label>Email</label><input id="li_email" type="email"></div>
    <div class="fld"><label>Password</label><input id="li_pass" type="password"></div>
    <div id="li_err" class="err" hidden></div>
    <div class="foot"><button class="btn primary" id="li_go">Sign in</button></div>
  </div>
</div>

<script src="config.js?v=67"></script>
<script src="store-api.js?v=67"></script>
<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const SEC={logistics:"Logistics",compliance:"Permits",comms:"Comms",guests:"Guests"};
  let canEdit=false, editingId=null;

  async function renderAccount(){ const el=$("#account"); if(!BPStore.auth.enabled()){el.hidden=true;return;} el.hidden=false;
    const u=BPStore.auth.user(); if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{await BPStore.auth.signOut();location.href="index.html";});
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",openLogin); } }

  async function render(){
    let list=[];
    try{ list=await BPStore.templates.list(); }
    catch(e){ $("#tplList").innerHTML=`<div class="empty">Couldn't load — ${esc(e&&e.message||"error")}. Run <b>phase26-templates.sql</b>.</div>`; return; }
    $("#tplList").innerHTML = list.length ? list.map(t=>{ const items=Array.isArray(t.items)?t.items:[];
      return `<div class="tpl"><div class="h"><b>${esc(t.name)}</b> <span class="badge">${SEC[t.section]||t.section}</span> <span style="color:var(--ink-3);font-size:12px">${items.length} item${items.length===1?"":"s"}</span>
        ${canEdit?`<span class="spacer"></span><button class="lnk" data-edit="${t.id}">Edit</button><button class="rm" data-del="${t.id}">✕</button>`:""}</div>
        ${items.length?`<ul>${items.slice(0,6).map(i=>`<li>${esc(typeof i==="string"?i:(i&&i.title)||"")}</li>`).join("")}${items.length>6?`<li>…and ${items.length-6} more</li>`:""}</ul>`:""}</div>`;
    }).join("") : '<div class="empty">No templates yet. Create one above.</div>';
    $("#tplList").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{ if(!confirm("Delete this template?"))return; try{ await BPStore.templates.remove(b.dataset.del); render(); }catch(e){ alert("Couldn't delete — "+((e&&e.message)||"error")); } }));
    $("#tplList").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>loadForEdit(list.find(x=>x.id===b.dataset.edit))));
  }

  function loadForEdit(t){ editingId=t.id; $("#formTitle").textContent="Edit template"; $("#t_name").value=t.name||""; $("#t_section").value=t.section||"logistics";
    $("#t_items").value=(Array.isArray(t.items)?t.items:[]).map(i=>typeof i==="string"?i:(i&&i.title)||"").join("\n"); $("#t_cancel").hidden=false; window.scrollTo({top:0,behavior:"smooth"}); }
  function resetForm(){ editingId=null; $("#formTitle").textContent="New template"; $("#t_name").value=""; $("#t_items").value=""; $("#t_cancel").hidden=true; $("#t_err").hidden=true; }

  async function save(){
    const name=$("#t_name").value.trim(); if(!name){ $("#t_err").textContent="Name is required."; $("#t_err").hidden=false; return; }
    const items=$("#t_items").value.split("\n").map(x=>x.trim()).filter(Boolean);
    const rec={ name, section:$("#t_section").value, items };
    $("#t_save").disabled=true;
    try{ if(editingId) await BPStore.templates.update(editingId,rec); else await BPStore.templates.add(rec);
      $("#t_msg").textContent="Saved ✓"; setTimeout(()=>$("#t_msg").textContent="",1500); resetForm(); await render(); }
    catch(e){ $("#t_err").textContent="Couldn't save — "+((e&&e.message)||"error"); $("#t_err").hidden=false; }
    finally{ $("#t_save").disabled=false; }
  }

  function openLogin(){ $("#loginModal").hidden=false; setTimeout(()=>$("#li_email").focus(),50); }
  $("#li_go").addEventListener("click",async()=>{ try{ await BPStore.auth.signIn($("#li_email").value.trim(),$("#li_pass").value); location.reload(); }
    catch(e){ $("#li_err").textContent=(e&&e.message)||"Sign in failed"; $("#li_err").hidden=false; } });
  $("#t_save").addEventListener("click",save);
  $("#t_cancel").addEventListener("click",resetForm);

  (async ()=>{
    await BPStore.init(); await renderAccount();
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ $("#gate").hidden=false; openLogin(); return; }
    if(!(await BPStore.auth.requireView("ops"))) return;
    canEdit=await BPStore.auth.canEditArea("templates");
    $("#app").hidden=false; $("#editCard").hidden=!canEdit;
    await render();
  })();
</script>
</body>
</html>
