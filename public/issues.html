<!doctype html>
<html lang="en" data-theme="light" class="auth-pending">
<head>
<style id="bp-auth-gate">html.auth-pending body,html.auth-pending body *{visibility:hidden!important}</style>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live issues — Helm Events</title>
<link rel="preconnect" href="https://nqltzgiwznphugcfhmbm.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://nqltzgiwznphugcfhmbm.supabase.co">
<link rel="preload" href="/vendor/supabase-js-2.117.2.min.js" as="script" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;--safe:#18a558;--warn:#e8912d;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:940px;margin:0 auto;padding:0 24px 60px}
  header{display:flex;align-items:center;gap:11px;padding:18px 0}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  header h1{font-size:16px;margin:0;font-weight:700} header small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:14px;margin-left:18px;font-size:13px;font-weight:600;color:var(--ink-2)} .nav a:hover{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .account button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .crumb{font-size:12px;color:var(--ink-3);margin:2px 0 14px} .crumb a{color:var(--accent)}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tabs button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:8px 14px;border-radius:8px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}
  .open-badge{font-family:var(--mono);font-weight:700;font-size:13px} .open-badge b{color:#b42318}
  .qlink{font-size:12px;font-weight:600;color:var(--accent)} .spacer2{margin-left:auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .add{display:grid;grid-template-columns:1.8fr .8fr 1fr auto;gap:8px;align-items:end} @media(max-width:640px){.add{grid-template-columns:1fr 1fr}}
  .fld{display:flex;flex-direction:column;gap:4px} .fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .fld input,.fld select{height:36px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:0 10px;font-family:inherit;font-size:13px;color:var(--ink)}
  .btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer} .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}

  .issue{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);background:var(--panel);margin-bottom:10px}
  .issue.resolved{opacity:.6}
  .sev{width:8px;align-self:stretch;border-radius:6px;flex:0 0 auto;margin-top:2px}
  .sev.low{background:#8a95ad} .sev.medium{background:var(--warn)} .sev.high{background:#e5484d}
  .issue .t{font-weight:700;font-size:14px} .issue .d{font-size:12px;color:var(--ink-3);margin-top:2px}
  .issue .meta{font-size:12px;color:var(--ink-3);margin-top:4px}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:20px;margin-left:6px}
  .tag.low{background:#f1f3f7;color:var(--ink-3)} .tag.medium{background:#fff7e6;color:#946200} .tag.high{background:#fdecec;color:#b42318}
  .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:20px}
  .st.open{background:#fdecec;color:#b42318} .st.in_progress{background:#fff7e6;color:#946200} .st.resolved{background:#e7f6ee;color:#0f7a43}
  .issue .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .mini{border:1px solid var(--line);background:var(--panel);border-radius:7px;min-height:32px;min-width:32px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)} .mini:hover{border-color:var(--accent);color:var(--accent)}
  .mini.go{color:#0f7a43;border-color:#b6e3ca} .mini.del{color:var(--ink-3)}
  .empty{text-align:center;color:var(--ink-3);padding:30px;font-size:13px}
  @media(max-width:480px){.wrap{padding:0 16px 48px} header{flex-wrap:wrap} .nav{margin-left:0;flex-wrap:wrap} .add{grid-template-columns:1fr} .issue{flex-wrap:wrap} .issue .acts{margin-left:20px}}
  footer{padding:24px 0 40px;color:var(--ink-3);font-size:12px;text-align:center}
  .err{background:#fdecec;color:#b42318;border-radius:8px;padding:8px 12px;font-size:12px}
  .lmodal{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .lmodal[hidden]{display:none!important}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(380px,96vw);padding:24px}
  .sheet h3{margin:0 0 12px}.foot{display:flex;gap:10px;justify-content:flex-end}
  .crumb a,.sub a,a#floorLink{text-decoration:underline}
  html[data-theme="dark"] .tabs button.on{background:#7c3aed;color:#fff}
</style>
<link rel="stylesheet" href="theme.css?v=76">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="wrap">
  <header>
    <a href="dashboard.html" class="mark" title="Home"></a>
    <div><h1>Live issues</h1><small>Helm Events</small></div>
    <nav class="nav"><a href="dashboard.html">Home</a><a href="calendar.html">Calendar</a><a href="quotes.html">Quotes</a></nav>
    <span class="spacer"></span>
    <span id="account" class="account" hidden></span>
  </header>
  <main id="main">
  <div id="boot" aria-busy="true"></div>

  <div id="gate" class="card" hidden><p class="s-1a1aca0">Sign in to open the issue log.</p></div>
  <div id="notfound" class="card" hidden><p class="s-1a1aca0">Event not found. Go to <a class="s-dea29d3" href="quotes.html">Quotes</a>.</p></div>

  <div id="app" hidden>
    <div class="crumb"><a id="backLink" href="#">← Back to command center</a> · <span id="evName"></span></div>
    <div class="toolbar">
      <div class="tabs" id="tabs" role="group" aria-label="Log type">
        <button type="button" data-t="issue" class="on" aria-pressed="true">🎫 Issues</button>
        <button type="button" data-t="incident" aria-pressed="false">🛟 Incidents</button>
      </div>
      <span class="open-badge" id="openBadge"></span>
      <span class="spacer2"></span>
      <a class="qlink" id="changeLink" href="#">＋ Raise a billable change →</a>
    </div>

    <div class="card" id="addCard" hidden>
      <div class="add">
        <div class="fld"><label id="titleLbl" for="i_title">Issue</label><input id="i_title" placeholder="what's happening"></div>
        <div class="fld"><label for="i_sev">Severity</label><select id="i_sev"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
        <div class="fld"><label for="i_owner">Owner</label><input id="i_owner" placeholder="who's on it"></div>
        <div class="fld"><span class="s-6cb285c" aria-hidden="true">&nbsp;</span><button type="button" class="btn primary" id="i_add">＋ Log</button></div>
      </div>
    </div>

    <div id="list"><div class="empty"><span class="bpui-loading"><i class="bpui-spin2" aria-hidden="true"></i>Loading…</span></div></div>
  </div>
  </main>
  <footer>Helm Events — log it, own it, resolve it — with a clear record afterwards.</footer>
</div>

<div id="loginModal" class="lmodal" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="sheet">
    <h3 id="loginTitle">Sign in</h3>
    <div class="fld s-761d3ad"><label for="li_email">Email</label><input id="li_email" type="email"></div>
    <div class="fld s-761d3ad"><label for="li_pass">Password</label><input id="li_pass" type="password"></div>
    <div id="li_err" class="err" hidden role="alert" aria-live="assertive"></div>
    <div class="foot"><button class="btn primary" id="li_go">Sign in</button></div>
  </div>
</div>

<script src="/trusted-types.js?v=2"></script>
<script src="telemetry.js?v=3"></script>
<script src="config.js?v=98"></script>
<script src="event-name.js?v=1"></script>
<script src="store-api.js?v=143"></script>
<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const id=new URLSearchParams(location.search).get("quote")||new URLSearchParams(location.search).get("id");
  const SEV={low:"Low",medium:"Medium",high:"High"}, ST={open:"Open",in_progress:"In progress",resolved:"Resolved"};
  let canEdit=false, canDelete=false, tab="issue", ev=null;

  async function renderAccount(){ const el=$("#account"); if(!BPStore.auth.enabled()){el.hidden=true;return;} el.hidden=false;
    const u=BPStore.auth.user(); if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{await BPStore.auth.signOut();location.href="dashboard.html";});
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next="+encodeURIComponent(HelmUrl.here()))); } }

  const when=(t)=>{ if(!t) return ""; return new Date(t).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };

  async function render(){
    $("#titleLbl").textContent = tab==="incident"?"Incident":"Issue";
    $("#i_title").placeholder = tab==="incident"?"what happened (safety/incident)":"what's happening";
    const items=await BPStore.issues.list(id, tab);
    const open=items.filter(i=>i.status!=="resolved").length;
    $("#openBadge").innerHTML = items.length?`<b>${open}</b> open · ${items.length} total`:"";
    $("#list").innerHTML = items.length ? items.map(i=>`<div class="issue ${i.status==='resolved'?'resolved':''}">
      <div class="sev ${esc(i.severity)}"></div>
      <div style="flex:1"><div class="t">${esc(i.title)}<span class="tag ${esc(i.severity)}">${esc(SEV[i.severity]||i.severity)}</span></div>
        ${i.detail?`<div class="d">${esc(i.detail)}</div>`:""}
        <div class="meta">${esc(when(i.created_at))}${i.owner?` · 👤 ${esc(i.owner)}`:""} · <span class="st ${esc(i.status)}">${esc(ST[i.status]||i.status)}</span>${i.resolved_at?` · resolved ${esc(when(i.resolved_at))}`:""}</div></div>
      ${canEdit?`<div class="acts">
        ${i.status==="open"?`<button type="button" class="mini" data-st="${esc(i.id)}" data-s="in_progress" aria-label="Start ${esc(i.title)}">Start</button>`:""}
        ${i.status!=="resolved"?`<button type="button" class="mini go" data-st="${esc(i.id)}" data-s="resolved" aria-label="Resolve ${esc(i.title)}">Resolve</button>`:`<button type="button" class="mini" data-st="${esc(i.id)}" data-s="open" aria-label="Reopen ${esc(i.title)}">Reopen</button>`}
        ${canDelete?`<button type="button" class="mini del" data-del="${esc(i.id)}" data-name="${esc(i.title)}" aria-label="Delete ${esc(i.title)}">✕</button>`:""}
      </div>`:""}
    </div>`).join("") : `<div class="empty">No ${tab==="incident"?"incidents":"issues"} logged. ${tab==="incident"?"Good — keep it that way.":""}</div>`;
    $("#list").querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>BPUI.guard(b,async()=>{ try{ await BPStore.issues.setStatus(b.dataset.st,b.dataset.s); await safeRender(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"update the "+tab}),{type:"err"}); } })));
    $("#list").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",async()=>{
      if(!(await BPUI.confirm(`Delete “${b.dataset.name||""}”? It will be removed from the ${tab} log.`,{title:"Delete "+tab+"?",danger:true}))) return;
      await BPUI.guard(b,async()=>{ try{ await BPStore.issues.remove(b.dataset.del); await safeRender(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"delete the "+tab}),{type:"err"}); } }); }));
  }
  async function safeRender(){ try{ await render(); }catch(e){ $("#openBadge").textContent=""; BPUI.loadError($("#list"),e,safeRender,{what:tab==="incident"?"incidents":"issues"}); } }
  function add(){ const t=$("#i_title").value.trim(); if(!t){ $("#i_title").focus(); return; }
    return BPUI.guard($("#i_add"),async()=>{
      try{ await BPStore.issues.add(id,{ kind:tab, title:t, severity:$("#i_sev").value, owner:$("#i_owner").value.trim()||null });
        $("#i_title").value=""; $("#i_owner").value=""; await safeRender(); $("#i_title").focus(); }
      catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"log the "+tab,setupHint:"phase17-issues.sql"}),{type:"err"}); }
    });
  }

  function openLogin(){ $("#loginModal").hidden=false; setTimeout(()=>$("#li_email").focus(),50); }
  $("#li_go").addEventListener("click",()=>{
    const em=$("#li_email").value.trim(), pw=$("#li_pass").value;
    if(!em||!pw){ $("#li_err").textContent="Enter your email and password."; $("#li_err").hidden=false; return; }
    $("#li_err").hidden=true;
    BPUI.guard($("#li_go"),async()=>{ try{ await BPStore.auth.signIn(em,pw); location.reload(); }
      catch(e){ $("#li_err").textContent=(e&&e.message)||"Sign in failed"; $("#li_err").hidden=false; } },{busyLabel:"Signing in…"});
  });
  $("#i_add").addEventListener("click",add);
  $("#i_title").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
  $("#tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-t]"); if(!b) return;
    tab=b.dataset.t; $("#tabs").querySelectorAll("button").forEach(x=>{ x.classList.toggle("on",x===b); x.setAttribute("aria-pressed",String(x===b)); }); safeRender(); });

  BPUI.boot(async ()=>{
    await BPStore.init(); await renderAccount();
    $("#backLink").href = id?("command.html?quote="+encodeURIComponent(id)):"quotes.html";
    $("#changeLink").href = id?("budget.html?quote="+encodeURIComponent(id)):"#";
    if(!id){ $("#notfound").hidden=false; return; }
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next="+encodeURIComponent(HelmUrl.here())); return; }
    if(!(await BPStore.auth.requireView("ops"))) return;
    canEdit=await BPStore.auth.canEditArea("issues"); canDelete=await BPStore.auth.can("delete");
    try{ ev=await BPStore.quotes.get(id); }catch(e){ if(BPUI.isNotFound(e)){ $("#notfound").hidden=false; return; } throw e; }
    if(!ev){ $("#notfound").hidden=false; return; }
    $("#evName").textContent=(ev.code||"")+(ev.title&&ev.title!==ev.code?(" · "+ev.title):"");
    $("#app").hidden=false; $("#addCard").hidden=!canEdit;
    await safeRender();
  });
</script>
</body>
</html>
