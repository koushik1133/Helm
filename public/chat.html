<!doctype html>
<html lang="en" data-theme="light" class="auth-pending">
<head>
<style id="bp-auth-gate">html.auth-pending body,html.auth-pending body *{visibility:hidden!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Chat has a bottom composer; the floating toggle would sit on the mic/send
     button, so we opt out of it and put a theme toggle in the header instead. -->
<meta name="bp-theme-toggle" content="off">
<title>Team Chat — Helm Events</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d28d9'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://nqltzgiwznphugcfhmbm.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://nqltzgiwznphugcfhmbm.supabase.co">
<link rel="preload" href="/vendor/supabase-js-2.117.2.min.js" as="script" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;
    --safe:#18a558;--warn:#e8912d;--danger:#c0362c;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}

  /* ---------- site header (same chrome as the rest of Helm) ---------- */
  header.apphead{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line-2);z-index:30}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  .brand h1{font-size:16px;margin:0;font-weight:700}
  .brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:16px;margin-left:18px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .nav a:hover{color:var(--accent)} .nav a.on{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-weight:700;text-transform:capitalize}
  .account button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .themebtn:hover{background:var(--panel-2)}

  /* ---------- two-pane chat ---------- */
  .app{flex:1;display:grid;grid-template-columns:min(380px,34%) 1fr;min-height:0}
  @media(max-width:760px){.app{grid-template-columns:1fr}.app.show-thread .side{display:none}.app:not(.show-thread) .thread{display:none}.nav{display:none}}
  .side{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .sidehead{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:12px 10px 10px 16px}
  .sidehead h2{font-size:18px;font-weight:700;margin:0;flex:1}
  .circbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .circbtn:hover{background:var(--panel-2)}
  .plus{background:var(--accent);color:#fff;width:38px;height:38px;border-radius:50%;font-size:21px}
  .plus:hover{filter:brightness(1.06)}
  .searchwrap{padding:0 14px 8px}
  .searchbar{display:flex;align-items:center;gap:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 13px;height:40px}
  .searchbar svg{width:15px;height:15px;fill:var(--ink-3);flex:0 0 auto}
  .searchbar input{flex:1;border:0;background:transparent;color:var(--ink);font-size:14px;outline:none;font-family:inherit}
  .searchbar input::placeholder{color:var(--ink-3)}
  .chips{display:flex;gap:7px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .chip .ct{margin-left:3px}
  .convlist{flex:1;overflow-y:auto;min-height:0;padding-bottom:8px}
  .conv{display:flex;align-items:center;gap:12px;padding:0 14px;height:70px;cursor:pointer;border-bottom:1px solid var(--line-2)}
  .conv:hover{background:var(--panel-2)}
  .conv.on{background:var(--accent-soft)}
  .av{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;background:var(--accent)}
  .conv .meta{flex:1;min-width:0}
  .conv .meta .r1{display:flex;align-items:baseline;gap:8px}
  .conv .meta .nm{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .conv .meta .tm{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
  .conv .meta .tm.hilite{color:var(--accent);font-weight:600}
  .conv .meta .r2{display:flex;align-items:center;gap:6px;margin-top:3px}
  .conv .meta .pv{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .unread{min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:0 0 auto}
  .emptylist{padding:28px 20px;color:var(--ink-3);font-size:14px;text-align:center}

  /* ---------- thread ---------- */
  .thread{display:flex;flex-direction:column;min-height:0;background:var(--bg);position:relative}
  .tsearch{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line-2)}
  .tsearch input{flex:1;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:8px 12px;font-size:14px;outline:none;font-family:inherit}
  .tsearch input:focus{border-color:var(--accent)}
  .tsearch-ct{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .tsearch .x{border:0;background:none;color:var(--ink-3);font-size:22px;cursor:pointer;line-height:1}
  .bub mark{background:#ffe08a;color:#1b1930;border-radius:3px;padding:0 1px}
  html[data-theme="dark"] .bub mark{background:#9a7b1f;color:#fff}
  .m.dim{opacity:.32}
  .dropzone{position:absolute;inset:0;z-index:25;background:rgba(109,40,217,.10);border:3px dashed var(--accent);border-radius:10px;margin:10px;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .dropzone .dz-inner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 24px;font-size:16px;font-weight:600;color:var(--accent);box-shadow:var(--shadow)}
  .thead{flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--line-2)}
  .thead .bk{display:none;border:0;background:none;font-size:23px;cursor:pointer;color:var(--ink-2)}
  @media(max-width:760px){.thead .bk{display:block}}
  .thead .ti{flex:1;min-width:0}
  .thead .ti b{font-size:15.5px;font-weight:600;display:block}
  .thead .ti span{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .msgs{flex:1;overflow-y:auto;padding:16px 8% 10px;display:flex;flex-direction:column;gap:2px}
  .welcome{margin:auto;text-align:center;color:var(--ink-3);max-width:420px}
  .welcome .big{font-size:50px;opacity:.5;margin-bottom:10px}
  .welcome b{color:var(--ink-2);font-size:18px;font-weight:600;display:block;margin-bottom:4px}
  .daysep{align-self:center;background:var(--panel);border:1px solid var(--line);color:var(--ink-3);font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 13px;margin:10px 0}
  .m{max-width:min(560px,72%);display:flex;flex-direction:column;position:relative;margin-bottom:2px}
  .m.me{align-self:flex-end;align-items:flex-end}.m.them{align-self:flex-start}
  .m.grpstart{margin-top:8px}
  .bub{position:relative;border-radius:13px;padding:7px 11px 7px;font-size:14px;line-height:1.38;box-shadow:0 1px 1px rgba(20,27,46,.05);word-wrap:break-word;overflow-wrap:anywhere;min-width:80px;border:1px solid var(--line)}
  .m.them .bub{background:var(--panel);border-top-left-radius:4px}
  .m.me .bub{background:var(--accent-soft);border-color:transparent;border-top-right-radius:4px}
  .bub .who{font-size:12.5px;font-weight:700;margin-bottom:2px}
  .bub .reply{border-left:3px solid var(--accent);background:rgba(109,40,217,.08);border-radius:6px;padding:4px 8px;margin-bottom:5px;cursor:pointer}
  .bub .reply b{color:var(--accent);display:block;font-size:12px;font-weight:700}
  .bub .reply .rt{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;display:block}
  .bub .txt{white-space:pre-wrap}
  .bub img.photo{max-width:320px;max-height:340px;border-radius:9px;display:block;cursor:pointer;background:var(--panel-2);margin-bottom:3px}
  .bub .cap{margin-top:3px}
  .bub audio{height:40px;max-width:260px;margin:2px 0}
  .meta-in{float:right;margin:5px 0 -3px 10px;font-size:10.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:3px;line-height:1}
  /* WhatsApp-style receipts: single ✓ = sent, grey ✓✓ = delivered, blue ✓✓ = read */
  .tick{font-size:13px;color:var(--ink-3);display:inline-block}
  .tick.dbl{letter-spacing:-3px;margin-right:2px}
  .tick.read{color:#34b7f1}
  .reacts{display:flex;gap:3px;margin:-7px 6px 3px;position:relative;z-index:3}
  .m.me .reacts{justify-content:flex-end}
  .reacts .rx{background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:1px 7px;cursor:pointer;display:inline-flex;gap:3px;align-items:center;box-shadow:var(--shadow)}
  .reacts .rx.on{background:var(--accent-soft);border-color:var(--accent)}
  /* menu button lives in the top-right CORNER of the bubble (no detached gap to
     chase), and stays visible while its menu is open or the bubble is hovered */
  .mtools{position:absolute;top:4px;right:4px;display:flex;opacity:0;pointer-events:none;transition:opacity .12s;z-index:4}
  .m:hover .mtools,.m:focus-within .mtools,.m.menu-open .mtools{opacity:1;pointer-events:auto}
  .mtools .caret{border:0;background:var(--panel);color:var(--ink-2);font-size:13px;cursor:pointer;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(20,27,46,.22);padding:0}
  .mtools .caret:hover{background:var(--panel-2)}
  .rxpop{position:absolute;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow);z-index:40}
  .rxpop button{border:0;background:none;font-size:19px;cursor:pointer;padding:2px 4px;border-radius:50%}
  .rxpop button:hover{background:var(--panel-2);transform:scale(1.12)}

  /* ---------- composer ---------- */
  .composer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line-2);padding:9px 16px}
  .replybar{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-left:3px solid var(--accent);border-radius:7px;padding:6px 10px;margin-bottom:8px}
  .replybar .rc{flex:1;min-width:0}
  .replybar b{color:var(--accent);font-size:12.5px;display:block}
  .replybar span{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .replybar .x{cursor:pointer;color:var(--ink-3);font-size:19px;border:0;background:none}
  /* staged attachment (quote / layout) above the composer */
  .attachbar{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-left:3px solid var(--accent);border-radius:7px;padding:8px 10px;margin-bottom:8px}
  .attachbar .ac{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .attachbar .ac .ic{font-size:20px;flex:0 0 auto}
  .attachbar .ac b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attachbar .ac span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attachbar .x{cursor:pointer;color:var(--ink-3);font-size:19px;border:0;background:none;flex:0 0 auto}
  /* attachment card inside a message bubble */
  .bub .card{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:4px;min-width:min(260px,70vw);max-width:300px;text-decoration:none;color:inherit}
  .bub .card:hover{border-color:var(--accent)}
  .bub .card .cic{font-size:22px;flex:0 0 auto;line-height:1.2}
  .bub .card .cmeta{min-width:0;flex:1}
  .bub .card .cmeta b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bub .card .cmeta .csub{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bub .card .copen{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--accent)}
  /* event group: the system "event card" (0035) — centred, full width, no money */
  .m.sys{align-self:center;max-width:min(560px,94%);width:100%;margin:8px 0}
  .evcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:11px 14px 8px;box-shadow:0 1px 2px rgba(20,27,46,.05);font-size:13.5px}
  .evcard .ev-h{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
  .evcard .ev-h span{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .evcard .ev-h b{font-size:15px;font-weight:700}
  .evcard .ev-h .ev-emo{font-style:normal;font-size:15px;letter-spacing:0;margin-right:2px}
  .evcard .ev-r{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:3px 0;border-top:1px dashed var(--line-2)}
  .evcard .ev-k{color:var(--ink-3);font-size:12.5px}
  .evcard .ev-v{white-space:pre-wrap;overflow-wrap:anywhere}
  .evcard .ev-v a{color:var(--accent)}
  .evcard .ev-dish{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px}
  .evcard .card{margin:8px 0 4px;max-width:none;display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-decoration:none;color:inherit}
  .evcard .card:hover{border-color:var(--accent)}
  .evcard .card .cic{font-size:22px}
  .evcard .card b{display:block;font-size:13.5px}
  .evcard .card .csub{display:block;font-size:12px;color:var(--ink-2)}
  .evcard .card .copen,.evcard .ev-open{display:inline-block;margin-top:3px;font-size:12.5px;font-weight:700;color:var(--accent)}
  .evcard .meta-in{float:none;display:block;text-align:right;margin:4px 0 0}
  .pinbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer;color:var(--ink-2)}
  .pinbar:hover{background:var(--panel-2)}
  .pinbar b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* @mentions */
  .bub .mention{color:var(--accent);font-weight:600}
  .bub .mention.me{background:var(--accent-soft);border-radius:4px;padding:0 2px}
  .mentionpop{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:8px;max-height:240px;overflow-y:auto;padding:4px 0}
  .mentionpop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
  .mentionpop button.on,.mentionpop button:hover{background:var(--accent-soft)}
  .mentionpop .av{width:28px;height:28px;font-size:11px}
  .emojibar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px}
  .emojibar button{border:0;background:transparent;font-size:21px;padding:3px 5px;cursor:pointer;border-radius:7px}
  .emojibar button:hover{background:var(--panel)}
  .cbar{display:flex;align-items:center;gap:9px}
  .cbar .ic{width:38px;height:38px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:19px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cbar .ic:hover{background:var(--panel-2)}
  .inputwrap{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 6px}
  .cbar textarea{flex:1;border:0;background:transparent;color:var(--ink);font-size:15px;resize:none;max-height:120px;padding:9px 6px;line-height:1.4;outline:none;font-family:inherit}
  .cbar textarea::placeholder{color:var(--ink-3)}
  .send{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;font-size:17px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .recording{display:flex;align-items:center;gap:13px;width:100%}
  .recording .dot{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .recording .t{font-variant-numeric:tabular-nums}
  .recording .lbl{color:var(--ink-3);font-size:13.5px}
  .recording .rbtn{border:0;background:transparent;cursor:pointer;font-size:21px;padding:4px}
  .recording .trash{color:var(--danger)} .recording .go{color:var(--accent)}

  /* ---------- menus / modals ---------- */
  .menu{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 0;min-width:200px;z-index:50}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-size:14px;padding:10px 20px;cursor:pointer}
  .menu button:hover{background:var(--panel-2)}
  .menu .sep{height:1px;background:var(--line);margin:4px 0}
  .menu select{width:calc(100% - 24px);margin:6px 12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px;font-family:inherit}
  .ov{position:fixed;inset:0;background:rgba(20,15,35,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
  .modal h3{margin:0;padding:18px 20px 14px;font-size:17px;font-weight:700;border-bottom:1px solid var(--line-2)}
  .modal .body{padding:10px 12px;overflow-y:auto}
  .modal .foot{padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line-2)}
  .modal input.gname{width:calc(100% - 20px);margin:10px;background:var(--panel-2);border:1px solid var(--line);border-bottom:2px solid var(--accent);color:var(--ink);padding:9px 10px;font-size:15px;outline:none;font-family:inherit;border-radius:8px}

  /* ---------- image editor (preview → crop / draw / caption → send) ---------- */
  .imgedit{position:fixed;inset:0;z-index:90;background:#0b0b0e;display:flex;flex-direction:column}
  .ie-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .ie-tools{display:flex;gap:8px}
  .ie-ic{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ie-ic:hover:not(:disabled){background:rgba(255,255,255,.22)}

<script>
(function(){
  const $=(s,r)=>(r||document).querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const RX_EMOJI=["👍","❤️","😂","😮","😢","🙏"];
  const INS_EMOJI=["😀","😁","😂","🤣","😊","😍","😎","😉","🤔","😅","🙌","👏","👍","🙏","🎉","🔥","✅","❤️","💯","😢","😮","🚀","⭐","🌸","☕","🍾","👌","💪"];
  const NAME_COLORS=["#6d28d9","#4f46e5","#0ea5e9","#16a34a","#d97706","#dc2626","#db2777","#0891b2","#7c3aed","#0d9488"];
  let ME={id:null,name:"",email:""}, roster={}, convs=[], activeId=null, replyTo=null, staged=null, sub=null, thread={messages:[],reactions:[],members:[]}, convSearch="", filter="all", backendReady=true;
  let rec=null, recChunks=[], recStart=0, recTimer=null;
  let favs=new Set(); try{ favs=new Set(JSON.parse(localStorage.getItem("wa_fav")||"[]")); }catch(e){}
  const saveFavs=()=>{ try{ localStorage.setItem("wa_fav",JSON.stringify([...favs])); }catch(e){} };
  let pins=new Set(); try{ pins=new Set(JSON.parse(localStorage.getItem("wa_pin")||"[]")); }catch(e){}
  const savePins=()=>{ try{ localStorage.setItem("wa_pin",JSON.stringify([...pins])); }catch(e){} };
  let mutes=new Set(); try{ mutes=new Set(JSON.parse(localStorage.getItem("wa_mute")||"[]")); }catch(e){}
  const saveMutes=()=>{ try{ localStorage.setItem("wa_mute",JSON.stringify([...mutes])); }catch(e){} };
  let pending=[];  /* optimistic, in-flight messages (single ✓ "sending") */
  let msgQuery="";  /* in-conversation search */

  /* header theme toggle (floating one is disabled via meta on this page) */
  (function(){ const b=$("#themeBtn"); if(!b) return;
    const sync=()=>{ b.textContent=(document.documentElement.getAttribute("data-theme")==="dark")?"☀":"☾"; };
    sync();
    b.addEventListener("click",()=>{ const d=(document.documentElement.getAttribute("data-theme")==="dark")?"light":"dark";
      document.documentElement.setAttribute("data-theme",d); try{ localStorage.setItem("bp_theme",d); }catch(e){} sync(); });
  })();

  function colorFor(id){ let h=0; const s=String(id||""); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return NAME_COLORS[h%NAME_COLORS.length]; }
  function initials(name){ const p=String(name||"?").trim().split(/\s+/); return ((p[0]||"")[0]||"?").toUpperCase()+((p[1]||"")[0]||"").toUpperCase(); }
  /* names: display name → e-mail before "@" → role (BPStore.chat.displayName); always esc() before HTML */
  function pname(p){ return BPStore.chat.displayName?BPStore.chat.displayName(p):((p&&(p.full_name||p.email))||"Member"); }
  function roleLbl(r){ try{ return r?BPStore.auth.admin.roleLabel(r):""; }catch(e){ return r||""; } }
  function personName(id){ const p=roster[id]; return p?pname(p):(id===ME.id?ME.name:"Member"); }
  function fmtTime(ts){ try{ return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
  function fmtListTime(ts){ try{ const d=new Date(ts),t=new Date(),y=new Date(t); y.setDate(t.getDate()-1);
    if(d.toDateString()===t.toDateString()) return fmtTime(ts); if(d.toDateString()===y.toDateString()) return "Yesterday";
    const diff=(t-d)/864e5; if(diff<7) return d.toLocaleDateString([], {weekday:"long"}); return d.toLocaleDateString([], {day:"numeric",month:"numeric",year:"2-digit"}); }catch(e){ return ""; } }
  function fmtDay(ts){ try{ const d=new Date(ts),t=new Date(),y=new Date(t); y.setDate(t.getDate()-1);
    if(d.toDateString()===t.toDateString()) return "Today"; if(d.toDateString()===y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"}); }catch(e){ return ""; } }

  function convOther(c){ if(c.kind!=="dm") return null;
    if(c.dm_key){ const ids=c.dm_key.split(":"); return ids[0]===ME.id?ids[1]:ids[0]; }
    const m=(c._members||[]).map(x=>x.user_id).find(x=>x!==ME.id); return m||null; }
  function convTitle(c){ if(c.kind==="broadcast") return c.title||"Everyone"; if(c.kind==="group") return c.title||"Group"; return personName(convOther(c)); }
  /* event groups: an emoji for the event type (wedding 💍, birthday 🎂 … default 📅) — BPStore.chat.eventEmoji */
  function evEmoji(type,title){ try{ return (typeof BPStore!=="undefined"&&BPStore.chat&&BPStore.chat.eventEmoji)?BPStore.chat.eventEmoji(type,title):"📅"; }catch(e){ return "📅"; } }
  const evTypeCache={};  /* quote id → {event_type,title}: one quotes read per refresh, only for groups not seen yet */
  function convAvatar(c){ if(c.kind==="broadcast") return {bg:"var(--accent)",txt:"📢"}; if(c.kind==="group") return {bg:colorFor(c.id),txt:c.quote_id?evEmoji(c._evType,c._evTitle||c.title):"👥"}; const o=convOther(c); return {bg:colorFor(o),txt:initials(personName(o))}; }
  function avHtml(a,id){ return `<div class="av"${id?' id="'+id+'"':''} style="background:${a.bg}">${esc(a.txt)}</div>`; }
  /* member photos (0041): chat_directory's avatar_path → a lazily signed photo over the initials
     (initials stay underneath as the fallback). The path is escaped here and checked again
     (own bucket keys only) before anything is signed — see BPStore.chat.paintAvatars. */
  function photoOf(id){ const p=roster[id]; return (p&&p.avatar_path)||""; }
  function photoAttr(id){ const p=photoOf(id); return p?` data-avatar-path="${esc(p)}"`:""; }
  function personAv(id,style){ return `<div class="av" style="background:${colorFor(id)};${style||""}"${photoAttr(id)}>${esc(initials(personName(id)))}</div>`; }
  function paintAv(root){ try{ if(BPStore.chat.paintAvatars) BPStore.chat.paintAvatars(root); }catch(e){} }

  function closeMenus(){ document.querySelectorAll(".menu,.rxpop").forEach(m=>m.remove()); document.querySelectorAll(".m.menu-open").forEach(m=>m.classList.remove("menu-open")); }
  document.addEventListener("click",(e)=>{ if(!e.target.closest(".menu")&&!e.target.closest(".rxpop")&&!e.target.closest("[data-menu-anchor]")&&!e.target.closest(".caret")) closeMenus(); });
  function openMenu(anchor, items){ closeMenus(); const r=anchor.getBoundingClientRect(); const m=document.createElement("div"); m.className="menu";
    m.innerHTML=items.map(it=>it.sep?'<div class="sep"></div>':`<button data-k="${esc(it.k)}">${esc(it.label)}</button>`).join("");
    document.body.appendChild(m); let top=r.bottom+4, left=Math.min(r.left, window.innerWidth-m.offsetWidth-8); if(left<8)left=8;
    if(top+m.offsetHeight>window.innerHeight-8) top=r.top-m.offsetHeight-4; m.style.top=top+"px"; m.style.left=left+"px";
    m.querySelectorAll("button[data-k]").forEach(b=>b.addEventListener("click",()=>{ const it=items.find(x=>x.k===b.dataset.k); closeMenus(); it&&it.on&&it.on(); }));
    return m; }

  /* ---------- account chip (same as other pages) ---------- */
  async function renderAccount(){
    const el=$("#account"); if(!BPStore.auth.enabled()){ el.hidden=true; return; } el.hidden=false;
    const u=BPStore.auth.user();
    if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{ await BPStore.auth.signOut(); location.href="dashboard.html"; });
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next=chat.html")); }
  }

  /* ---------- read receipts (single ✓ sent · grey ✓✓ delivered · blue ✓✓ read) ---------- */
  function readByOthers(m,members){ if(!m||m.sender_id!==ME.id) return null;
    const others=(members||[]).filter(x=>x.user_id!==ME.id);
    if(!others.length) return false;
    const readers=others.filter(x=>x.last_read_at && String(x.last_read_at)>=String(m.created_at));
    return readers.length===others.length; }
  function ticksHtml(m,members,pendingFlag){ if(pendingFlag) return '<span class="tick">✓</span>';
    const r=readByOthers(m,members); if(r===null) return "";
    return r?'<span class="tick dbl read">✓✓</span>':'<span class="tick dbl">✓✓</span>'; }

  /* ---------- attachment cards (quote / layout) ---------- */
  const inr=(n)=>{ const v=Number(n||0); try{ return "₹"+v.toLocaleString("en-IN"); }catch(e){ return "₹"+v; } };
  function cardLabel(m){ const mt=(m&&m.meta)||{}; if(mt.kind==="event") return "📋 Event details"+(mt.code?": "+mt.code:""); if(mt.kind==="layout") return "📐 Layout"+(mt.name?": "+mt.name:""); return "📄 Quote"+(mt.code?": "+mt.code:(mt.title?": "+mt.title:"")); }
  /* event group card (0035): built by the server from a whitelist (no money); every value escaped here */
  function isEventCard(m){ return !!(m&&m.kind==="card"&&m.sender_id==null&&m.meta&&m.meta.kind==="event"); }
  function fmtEvDate(d){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d||""))) return ""; try{ return new Date(d+"T00:00:00").toLocaleDateString([], {weekday:"short",day:"numeric",month:"short",year:"numeric"}); }catch(e){ return String(d); } }
  function eventCardHtml(mt){ mt=mt||{}; const cl=(mt.client&&typeof mt.client==="object")?mt.client:{}; const menu=(mt.menu&&typeof mt.menu==="object")?mt.menu:{};
    const qid=String(mt.quote_id||""); const rows=[];
    const row=(k,vHtml)=>{ if(vHtml) rows.push(`<div class="ev-r"><span class="ev-k">${esc(k)}</span><span class="ev-v">${vHtml}</span></div>`); };
    row("Client", esc([cl.name,cl.company].filter(Boolean).join(" · ")));
    if(cl.phone) row("Phone", `<a href="tel:${esc(String(cl.phone).replace(/[^0-9+]/g,""))}">${esc(cl.phone)}</a>`);
    if(cl.email) row("Email", `<a href="mailto:${esc(encodeURIComponent(String(cl.email)).replace(/%40/g,"@"))}">${esc(cl.email)}</a>`);
    row("Event", esc(mt.event_type||""));
    row("Date", esc([fmtEvDate(mt.event_date),mt.event_time].filter(Boolean).join(" · ")));
    row("Venue", esc([mt.venue,mt.venue_address].filter(Boolean).join(", ")));
    if(mt.guests!=null&&mt.guests!=="") row("Guests", esc(String(mt.guests)));
    row("Menu", esc(menu.package||""));
    const dishes=Array.isArray(menu.dishes)?menu.dishes:[];
    if(dishes.length) row("Dishes", dishes.map(d=>`<span class="ev-dish">${esc((d&&d.name)||"")}</span>`).join(""));
    row("Menu notes", esc(menu.notes||""));
    row("Notes", esc(mt.notes||""));
    row("Access", esc(mt.access_notes||""));
    const lay=(mt.layout&&typeof mt.layout==="object")?mt.layout:{}; const n=Number(lay.object_count);
    const layHtml=qid?`<a class="card" href="builder.html?quote=${encodeURIComponent(qid)}"><span class="cic">📐</span><div class="cmeta"><b>Floor layout${lay.version?" · v"+esc(String(lay.version)):""}</b><span class="csub">${Number.isFinite(n)?esc(n+" item"+(n===1?"":"s")):"Floor layout"}</span><span class="copen">Open in builder →</span></div></a>`:"";
    return `<div class="ev-h"><span><i class="ev-emo" aria-hidden="true">${esc(evEmoji(mt.event_type,mt.title))}</i> ${mt.refreshed?"Event details · updated":"Event details"}</span><b>${esc([mt.code,mt.title].filter(Boolean).join(" · ")||"Event")}</b></div>`
      + rows.join("") + layHtml
      + (qid?`<a class="ev-open" href="event.html?id=${encodeURIComponent(qid)}">Open event workspace →</a>`:""); }
  /* @mentions: highlight "@Name" for the people the server kept in meta.mentions (escaped) */
  function mentionHtml(body,ids){ const txt=String(body||""); ids=Array.isArray(ids)?ids:[]; if(!ids.length) return esc(txt);
    const names=ids.map(id=>({id,n:"@"+personName(id)})).filter(x=>x.n.length>1).sort((a,b)=>b.n.length-a.n.length);
    let out="",i=0,plain="";
    outer: while(i<txt.length){ for(const x of names){ if(txt.startsWith(x.n,i)){ out+=esc(plain)+`<span class="mention${x.id===ME.id?" me":""}">${esc(x.n)}</span>`; plain=""; i+=x.n.length; continue outer; } } plain+=txt[i]; i++; }
    return out+esc(plain); }
  function cardHtml(meta){ meta=meta||{};
    if(meta.kind==="quote"){ const sub=[meta.total?inr(meta.total):null, meta.status, meta.client, meta.event_date].filter(Boolean).join(" · ");
      return `<a class="card" href="quotes.html?focus=${encodeURIComponent(meta.code||meta.title||"")}"><span class="cic">📄</span><div class="cmeta"><b>${esc((meta.code?meta.code+" · ":"")+(meta.title||"Quote"))}</b><span class="csub">${esc(sub||"Quote")}</span><span class="copen">Open quote →</span></div></a>`; }

      return `<a class="card" href="builder.html${meta.quote_id?"?quote="+encodeURIComponent(meta.quote_id):""}"><span class="cic">📐</span><div class="cmeta"><b>${esc(meta.name||"Layout")}</b><span class="csub">${esc(sub)}</span><span class="copen">Open in builder →</span></div></a>`; }
    return `<div class="card"><span class="cic">📎</span><div class="cmeta"><b>Attachment</b></div></div>`; }

  /* ---------- conversation list ---------- */
  function lastPreview(c){ const m=c._last; if(!m) return c.kind==="broadcast"?"Broadcast to your whole team":"No messages yet";
    const youTick=(m.sender_id===ME.id)?(ticksHtml(m,c._members,false)+" "):"";
    const who=(m.sender_id&&m.sender_id!==ME.id&&c.kind!=="dm")?(esc(personName(m.sender_id).split(" ")[0])+": "):"";
    const body=m.kind==="image"?"📷 Photo":m.kind==="voice"?"🎤 Voice message":m.kind==="card"?esc(cardLabel(m)):esc(m.body||"");
    return youTick+who+body; }
  function unreadCount(c){ if(!c._last) return 0; return (c._msgs||[]).filter(x=>x.sender_id!==ME.id && (!c._lastRead || x.created_at> c._lastRead)).length; }

  function renderConvs(){
    const q=convSearch.trim().toLowerCase();
    let list=convs.filter(c=>!q||convTitle(c).toLowerCase().includes(q));
    if(filter==="unread") list=list.filter(c=>c._unread>0);
    else if(filter==="groups") list=list.filter(c=>c.kind==="group"||c.kind==="broadcast");
    else if(filter==="favorites") list=list.filter(c=>favs.has(c.id));
    list.sort((a,b)=>{ const pa=pins.has(a.id)?1:0,pb=pins.has(b.id)?1:0; if(pa!==pb) return pb-pa;
      return String(b.last_message_at||"").localeCompare(String(a.last_message_at||"")); });
    const totalUnread=convs.reduce((s,c)=>s+(mutes.has(c.id)?0:(c._unread||0)),0);
    const uc=$("#unreadCt"); if(totalUnread>0){ uc.hidden=false; uc.textContent=totalUnread; } else uc.hidden=true;
    const host=$("#convList");
    if(!list.length){ host.innerHTML=`<div class="emptylist">${!backendReady?"Chat isn’t set up on this workspace yet. An admin needs to finish chat setup — once that’s done, your team chats appear here.":q?"No chats found.":filter!=="all"?"Nothing here yet.":"No chats yet. Tap ＋ to start one."}</div>`; return; }
    host.innerHTML=list.map(c=>{ const a=convAvatar(c); const t=c._last?c._last.created_at:c.last_message_at;
      return `<div class="conv ${c.id===activeId?'on':''}" data-id="${esc(c.id)}" role="button" tabindex="0">
        ${c.kind==="dm"?personAv(convOther(c)):avHtml(a)}
        <div class="meta"><div class="r1"><span class="nm">${esc(convTitle(c))}</span><span class="tm ${c._unread?'hilite':''}">${esc(fmtListTime(t))}</span></div>
          <div class="r2"><span class="pv">${lastPreview(c)}</span><span class="marks" style="display:inline-flex;gap:3px;align-items:center;color:var(--ink-3);font-size:12px">${mutes.has(c.id)?'🔕':''}${pins.has(c.id)?'📌':''}${favs.has(c.id)&&!c._unread?'★':''}${c._unread?`<span class="unread">${c._unread>99?'99+':c._unread}</span>`:''}</span></div></div>
      </div>`; }).join("");
    paintAv(host);
    host.querySelectorAll(".conv").forEach(el=>{ const go=()=>openConv(el.dataset.id);
      el.addEventListener("click",go); el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); });
  }

  /* event-group avatars: the event type comes from the group's latest event card (already loaded
     with the thread) or, for groups whose card scrolled out, ONE RLS-scoped quotes read for all of them */
  async function resolveEventTypes(){
    const need=[];
    convs.forEach(c=>{ if(c.kind!=="group"||!c.quote_id) return;
      const card=(c._msgs||[]).filter(isEventCard).pop();
      if(card&&card.meta.event_type){ evTypeCache[c.quote_id]={event_type:card.meta.event_type,title:card.meta.title||null}; }
      else if(!evTypeCache[c.quote_id]) need.push(c.quote_id); });
    if(need.length){ let got={}; try{ got=await BPStore.chat.eventGroups.types(need); }catch(e){}
      need.forEach(id=>{ evTypeCache[id]=got[id]||{event_type:null,title:null}; }); }
    convs.forEach(c=>{ const t=c.quote_id&&evTypeCache[c.quote_id]; if(t){ c._evType=t.event_type; c._evTitle=t.title; } });
  }
  async function refresh(){
    try{ convs=await BPStore.chat.conversations(); backendReady=true; }catch(e){ convs=[]; backendReady=false; }
    const mem=await BPStore.chat.myMemberships().catch(()=>({}));
    convs.forEach(c=>{ const m=mem[c.id]; c._lastRead=m&&m.last_read_at; });
    await Promise.all(convs.map(async c=>{ try{ const t=await BPStore.chat.thread(c.id,80,{light:true}); c._members=t.members; c._msgs=t.messages; c._last=t.messages[t.messages.length-1]||null; c._unread=unreadCount(c); }
      catch(e){ c._members=[]; c._last=null; c._unread=0; } }));
    await resolveEventTypes();
    renderConvs();
  }

  /* ---------- thread ---------- */
  async function openConv(id){
    activeId=id; $("#app").classList.add("show-thread");
    msgQuery=""; $("#tSearch").hidden=true; $("#tSearchInput").value=""; mentionSel.clear(); mpClose();
    const c=convs.find(x=>x.id===id); if(!c) return;
    $("#thead").hidden=false; $("#composer").hidden=false; const w=$("#welcome"); if(w) w.hidden=true;
    const a=convAvatar(c); const av=$("#tAv"); av.style.background=a.bg; av.textContent=a.txt;
    { const ph=c.kind==="dm"?photoOf(convOther(c)):""; av.removeAttribute("data-av-done"); if(ph) av.setAttribute("data-avatar-path",ph); else av.removeAttribute("data-avatar-path"); paintAv($("#thead")); }
    $("#tName").textContent=convTitle(c);
    renderConvs(); await loadThread(); try{ await BPStore.chat.markRead(id); }catch(e){} bumpBell();
    setTimeout(()=>{ const c2=convs.find(x=>x.id===id); if(c2){ c2._unread=0; renderConvs(); } },300);
  }
  // Perf (Oct 2026): a thread opens with its latest THREAD_PAGE messages; older ones load
  // on scroll-up (loadOlder) with the scroll position kept. A re-sync of the open thread
  // (new message, edit, reaction, realtime) re-reads only what's already on screen.
  const THREAD_PAGE=50;
  let loadingOlder=false;
  async function loadThread(){ if(!activeId) return;
    const conv=activeId, prev=thread, sameConv=prev.conv===conv;
    const oldest=sameConv?(prev.messages||[]).find(m=>!m._pending):null;
    try{
      // older history already on screen → re-read from its oldest message so it stays (and stays fresh)
      if(sameConv&&oldest&&prev.messages.length>THREAD_PAGE){
        const t=await BPStore.chat.thread(conv,THREAD_PAGE,{since:oldest.created_at}); t.hasMore=prev.hasMore; thread=t;
      } else thread=await BPStore.chat.thread(conv,THREAD_PAGE);
    }catch(e){ thread={messages:[],reactions:[],members:[],hasMore:false}; }
    if(conv!==activeId) return;   // switched chats while this was loading
    thread.conv=conv;
    const c=convs.find(x=>x.id===activeId);
    renderPinBar(c);
    if(c){ if(c.kind==="group") $("#tSub").textContent=(c.quote_id?"Event group · ":"")+((thread.members||[]).map(m=>m.user_id===ME.id?"You":personName(m.user_id).split(" ")[0]).join(", ")||"group");
      else if(c.kind==="broadcast") $("#tSub").textContent="Everyone in your team";
      else { const o=convOther(c), p=roster[o]; $("#tSub").textContent=(p&&p.job_title)||(p&&roleLbl(p.role))||""; } }
    renderMessages();
  }
  /* event group: keep the latest event card pinned above the thread */
  function renderPinBar(c){ const bar=$("#pinBar"); const ev=(thread.messages||[]).filter(isEventCard).pop();
    if(!c||!ev){ bar.hidden=true; bar.dataset.mid=""; return; } const mt=ev.meta||{};
    $("#pinTxt").textContent=["Event details",mt.code,fmtEvDate(mt.event_date),mt.venue].filter(Boolean).join(" · ");
    bar.dataset.mid=ev.id; bar.hidden=false; }
  function gotoPinned(){ const id=$("#pinBar").dataset.mid; if(!id) return; const t=$("#msgs").querySelector('.m[data-mid="'+id+'"]'); if(t) t.scrollIntoView({block:"start",behavior:"smooth"}); }
  $("#pinBar").addEventListener("click",gotoPinned);
  $("#pinBar").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); gotoPinned(); } });
  function reactsFor(mid){ const by={}; (thread.reactions||[]).filter(r=>r.message_id===mid).forEach(r=>{ (by[r.emoji]=by[r.emoji]||[]).push(r.user_id); }); return by; }

  function highlight(text,q){ let out="",rest=String(text||""),k; const ql=String(q||"").toLowerCase(); if(!ql) return esc(rest);
    while(true){ k=rest.toLowerCase().indexOf(ql); if(k<0){ out+=esc(rest); break; } out+=esc(rest.slice(0,k))+"<mark>"+esc(rest.slice(k,k+q.length))+"</mark>"; rest=rest.slice(k+q.length); } return out; }
  // Highlight/dim in place on the existing DOM — never re-renders the thread (so it
  // doesn't re-fetch every image's signed URL or flicker media on each keystroke).
  function applyMsgSearch(q){ const host=$("#msgs"); const ql=String(q||"").toLowerCase().trim(); let matches=0;
    host.querySelectorAll(".m").forEach(el=>{
      el.classList.remove("dim");
      el.querySelectorAll(".txt,.cap").forEach(n=>{ if(n.querySelector("mark")) n.textContent=n.textContent; });  // strip old marks
      const hay=(el.textContent||"").toLowerCase(); const hit=!!ql&&hay.includes(ql);
      el.classList.toggle("dim", !!ql&&!hit);
      if(hit){ el.querySelectorAll(".txt,.cap").forEach(n=>{ n.innerHTML=highlight(n.textContent,q); }); matches++; } });
    const ct=$("#tSearchCt"); if(ct) ct.textContent=ql?(matches+" result"+(matches===1?"":"s")):"";
    if(ql){ const first=host.querySelector(".m:not(.dim)"); if(first) first.scrollIntoView({block:"center"}); } }

  // scroll-up history: fetch the page just older than the oldest message on screen and
  // prepend it, keeping what the reader is looking at in place
  async function loadOlder(){
    if(loadingOlder||!activeId||!thread.hasMore||thread.conv!==activeId) return;
    const first=(thread.messages||[])[0]; if(!first) return;
    const conv=activeId; loadingOlder=true; paintOlderRow();
    let t=null; try{ t=await BPStore.chat.thread(conv,THREAD_PAGE,{before:first}); }catch(e){ t=null; }
    loadingOlder=false;
    if(conv!==activeId||thread.conv!==conv){ return; }
    if(!t){ paintOlderRow(true); return; }
    const have=new Set(thread.messages.map(m=>m.id));
    const older=(t.messages||[]).filter(m=>!have.has(m.id));
    thread.messages=older.concat(thread.messages);
    thread.reactions=(t.reactions||[]).concat(thread.reactions||[]);
    thread.hasMore=!!t.hasMore;
    const host=$("#msgs"), fromBottom=host.scrollHeight-host.scrollTop;
    renderMessages({keepFromBottom:fromBottom});
  }
  // the row at the top of the thread: Load earlier messages / Loading… / start of the chat
  function olderRowHtml(failed){
    if(loadingOlder) return '<div class="daysep" data-older role="status"><span class="bpui-loading"><i class="bpui-spin2" aria-hidden="true"></i>Loading earlier messages…</span></div>';
    if(thread.hasMore) return `<div class="daysep" data-older>${failed?"Couldn’t load earlier messages · ":""}<button type="button" class="linkbtn" data-older-btn style="background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline">${failed?"Retry":"Load earlier messages"}</button></div>`;
    return "";
  }
  function paintOlderRow(failed){ const host=$("#msgs"); const row=host.querySelector("[data-older]");
    const html=olderRowHtml(failed);
    if(row){ if(html) row.outerHTML=html; else row.remove(); } else if(html) host.insertAdjacentHTML("afterbegin",html);
    const b=host.querySelector("[data-older-btn]"); if(b) b.addEventListener("click",loadOlder); }
  $("#msgs").addEventListener("scroll",()=>{ const h=$("#msgs"); if(h.scrollTop<120&&thread.hasMore&&!loadingOlder&&!msgQuery) loadOlder(); },{passive:true});

  function renderMessages(o){
    o=o||{};
    const host=$("#msgs"); const c=convs.find(x=>x.id===activeId); const isGroup=c&&c.kind!=="dm";
    const msgs=thread.messages.concat(pending.filter(p=>p.conversation_id===activeId));
    if(!msgs.length){ host.innerHTML='<div class="welcome"><div class="big">👋</div><b>No messages yet</b><p>Say hello — this is the start of your conversation.</p></div>'; return; }
    let html=olderRowHtml(),lastDay="",lastSender=null;
    msgs.forEach(m=>{
      const day=fmtDay(m.created_at); if(day!==lastDay){ html+=`<div class="daysep">${esc(day)}</div>`; lastDay=day; lastSender=null; }
      const mine=m.sender_id===ME.id; const grpStart=(m.sender_id!==lastSender); lastSender=m.sender_id;
      if(isEventCard(m)&&!m.deleted){ html+=`<div class="m sys" tabindex="0" data-mid="${esc(m.id)}"><div class="evcard">${eventCardHtml(m.meta)}<span class="meta-in">${fmtTime(m.created_at)}</span></div></div>`; lastSender=null; return; }
      if(m.deleted){ html+=`<div class="m ${mine?'me':'them'} ${grpStart?'grpstart':''}"><div class="bub" style="opacity:.65;font-style:italic"><span class="txt">🚫 This message was deleted</span><span class="meta-in">${fmtTime(m.created_at)}</span></div></div>`; return; }
      const by=reactsFor(m.id); const rx=Object.keys(by).map(e=>`<span class="rx ${by[e].indexOf(ME.id)>=0?'on':''}" data-react="${esc(m.id)}" data-emoji="${esc(e)}">${esc(e)} ${by[e].length}</span>`).join("");
      let inner="";
      if(isGroup&&!mine&&grpStart) inner+=`<div class="who" style="color:${colorFor(m.sender_id)}">${personAv(m.sender_id,"width:20px;height:20px;font-size:9px;display:inline-flex;vertical-align:-5px;margin-right:6px")}${esc(personName(m.sender_id))}</div>`;
      if(m.reply_to){ const rm=msgs.find(x=>x.id===m.reply_to); if(rm){ const rsnip=rm.kind==="image"?"📷 Photo":rm.kind==="voice"?"🎤 Voice message":rm.kind==="card"?cardLabel(rm):(rm.body||""); inner+=`<div class="reply" data-goto="${esc(rm.id)}"><b>${esc(rm.sender_id===ME.id?"You":personName(rm.sender_id))}</b><span class="rt">${esc(rsnip)}</span></div>`; } }
      if(m.kind==="image"){ inner+=`<img class="photo" data-media="${esc(m.media_path||"")}" alt="Photo" loading="lazy">`; if(m.body) inner+=`<div class="cap txt">${esc(m.body)}</div>`; }
      else if(m.kind==="voice"){ inner+=`<audio controls preload="none" data-media="${esc(m.media_path||"")}"></audio>`; }
      else if(m.kind==="card"){ inner+=cardHtml(m.meta); if(m.body) inner+=`<div class="cap txt">${mentionHtml(m.body,m.meta&&m.meta.mentions)}</div>`; }
      else inner+=`<span class="txt">${mentionHtml(m.body,m.meta&&m.meta.mentions)}</span>`;
      const ticks=mine?ticksHtml(m,thread.members,!!m._pending):"";
      const edited=m.edited_at?'<span style="opacity:.7">(edited)</span> ':"";
      inner+=`<span class="meta-in">${edited}${fmtTime(m.created_at)} ${ticks}</span>`;
      html+=`<div class="m ${mine?'me':'them'} ${grpStart?'grpstart':''}" tabindex="0" data-mid="${esc(m.id)}">
        <div class="bub">${inner}<div class="mtools"><button class="caret" data-caret="${esc(m.id)}" aria-label="Message menu">⌄</button></div></div>
        ${rx?`<div class="reacts">${rx}</div>`:""}</div>`;
    });
    host.innerHTML=html; paintAv(host);
    host.querySelectorAll(".rx[data-react]").forEach(el=>el.addEventListener("click",()=>toggleReact(el.dataset.react,el.dataset.emoji,!el.classList.contains("on"))));
    host.querySelectorAll(".caret[data-caret]").forEach(el=>el.addEventListener("click",(e)=>{ e.stopPropagation(); msgMenu(el,el.dataset.caret); }));
    host.querySelectorAll(".reply[data-goto]").forEach(el=>el.addEventListener("click",()=>{ const t=host.querySelector('.m[data-mid="'+el.dataset.goto+'"]'); if(t){ t.scrollIntoView({block:"center"}); t.style.transition="background .3s"; t.style.background="var(--accent-soft)"; setTimeout(()=>t.style.background="",700); } }));
    host.querySelectorAll("img.photo").forEach(el=>el.addEventListener("click",()=>el.src&&lightbox(el.src)));
    host.querySelectorAll("[data-media]").forEach(async el=>{ const p=el.getAttribute("data-media"); if(!p) return; try{ el.src=await BPStore.chat.mediaUrl(p); }catch(e){} });
    { const b=host.querySelector("[data-older-btn]"); if(b) b.addEventListener("click",loadOlder); }
    if(msgQuery) applyMsgSearch(msgQuery);
    else if(o.keepFromBottom!=null) host.scrollTop=Math.max(0,host.scrollHeight-o.keepFromBottom);   // prepended history: keep the reader's place
    else host.scrollTop=host.scrollHeight;
  }
  function msgMenu(anchor,mid){ const r=anchor.getBoundingClientRect(); closeMenus();
    const msg=thread.messages.find(x=>x.id===mid); const mine=msg&&msg.sender_id===ME.id;
    const m=document.createElement("div"); m.className="rxpop";
    let html=RX_EMOJI.map(e=>`<button data-e="${esc(e)}">${e}</button>`).join("")+`<button data-reply="1" title="Reply" style="font-size:15px">↩</button>`;
    if(mine) html+=`<button data-fwd="1" title="Forward" style="font-size:15px">↪</button>`;
    if(mine&&msg&&msg.kind==="text") html+=`<button data-edit="1" title="Edit" style="font-size:15px">✏️</button>`;
    if(mine) html+=`<button data-del="1" title="Delete" style="font-size:15px">🗑</button>`;
    m.innerHTML=html; document.body.appendChild(m);
    const mEl=anchor.closest(".m"); if(mEl) mEl.classList.add("menu-open");
    let left=Math.min(r.left-80,window.innerWidth-m.offsetWidth-8); if(left<8)left=8; let top=r.top-m.offsetHeight-4; if(top<8)top=r.bottom+4;
    m.style.top=top+"px"; m.style.left=left+"px";
    m.querySelectorAll("button[data-e]").forEach(b=>b.addEventListener("click",()=>{ closeMenus(); toggleReact(mid,b.dataset.e,true); }));
    m.querySelector("[data-reply]").addEventListener("click",()=>{ closeMenus(); setReply(mid); });
    const fb=m.querySelector("[data-fwd]"); if(fb) fb.addEventListener("click",()=>{ closeMenus(); forwardMsg(mid); });
    const eb=m.querySelector("[data-edit]"); if(eb) eb.addEventListener("click",()=>{ closeMenus(); doEdit(mid); });
    const db=m.querySelector("[data-del]"); if(db) db.addEventListener("click",()=>{ closeMenus(); doDelete(mid); }); }
  async function doEdit(mid){ const m=thread.messages.find(x=>x.id===mid); if(!m||m.kind!=="text") return;
    let nv; try{ nv=await BPUI.prompt("Edit your message",{title:"Edit message",value:m.body||"",multiline:true,required:true,okLabel:"Save"}); }catch(e){ return; }
    if(nv==null) return; nv=String(nv).trim(); if(!nv||nv===m.body) return;
    try{ await BPStore.chat.editMessage(mid,nv); await loadThread(); await refresh(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"edit the message"}),{type:"err"}); } }
  async function doDelete(mid){ let ok=false; try{ ok=await BPUI.confirm("Delete this message? Everyone in the chat will see it was removed.",{title:"Delete message",okLabel:"Delete",danger:true}); }catch(e){ return; }
    if(!ok) return;
    try{ await BPStore.chat.deleteMessage(mid); await loadThread(); await refresh(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"delete the message"}),{type:"err"}); } }
  async function forwardMsg(mid){ const m=thread.messages.find(x=>x.id===mid); if(!m) return;
    const targets=convs.filter(c=>c.id!==activeId).map(c=>({id:c.id,icon:convAvatar(c).txt,title:convTitle(c),sub:c.kind==="dm"?"Direct message":c.kind==="broadcast"?"Everyone":"Group"}));
    pickerModal("Forward to…","↪",targets.map(t=>({icon:typeof t.icon==="string"&&Array.from(t.icon).length<=2?t.icon:"💬",title:t.title,sub:t.sub,meta:{__to:t.id}})),"No other chats to forward to.",async(meta)=>{
      const to=meta.__to; try{ await BPStore.chat.send(to,{kind:m.kind,body:m.body,media_path:m.media_path,media_mime:m.media_mime,media_duration:m.media_duration,meta:m.meta||null}); await refresh(); await openConv(to); BPUI.toast("Forwarded.",{type:"ok"}); }
      catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"forward the message"}),{type:"err"}); } }); }
  async function toggleReact(mid,emoji,on){ try{ await BPStore.chat.react(mid,emoji,on); await loadThread(); }catch(e){} }

  /* ---------- image editor: preview → crop / draw / caption → send ----------
     State = the photo (ieState.base: an off-screen canvas, cropped but never drawn on)
     + the pen strokes on top (ieState.strokes, canvas pixels). Every change (stroke,
     crop, clear marks) pushes the previous state on ieHist, so Undo / Redo are exact
     and "Clear marks" can always restore the untouched (cropped) photo. */
  let ieMode=null, ieDrawing=false, ieStart=null, ieState=null, ieHist=[], ieFut=[], ieCur=null;
  const IE_HIST_MAX=30, IE_PEN="#ff3b30";
  function ieCtx(){ return $("#ieCanvas").getContext("2d"); }
  function iePt(e){ const cv=$("#ieCanvas"), r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)}; }
  function ieSetMode(m){ ieMode=(ieMode===m?null:m); $("#ieDraw").classList.toggle("on",ieMode==="draw"); $("#ieCrop").classList.toggle("on",ieMode==="crop"); $("#ieCanvas").classList.toggle("draw",ieMode==="draw"); $("#ieCropBox").hidden=true; $("#ieApply").hidden=true; ieStart=null; }
  function ieSnap(){ return {base:ieState.base, strokes:ieState.strokes.slice()}; }
  function ieSync(){ $("#ieUndo").disabled=!ieHist.length; $("#ieRedo").disabled=!ieFut.length; $("#ieClear").disabled=!(ieState&&ieState.strokes.length); }
  function iePush(){ ieHist.push(ieSnap()); if(ieHist.length>IE_HIST_MAX) ieHist.shift(); ieFut=[]; }
  function ieStroke(g,st){ const p=st.pts; if(!p.length) return; g.strokeStyle=st.color; g.lineWidth=st.width; g.lineCap="round"; g.lineJoin="round"; g.beginPath(); g.moveTo(p[0].x,p[0].y);
    if(p.length===1) g.lineTo(p[0].x+0.01,p[0].y); else for(let i=1;i<p.length;i++) g.lineTo(p[i].x,p[i].y); g.stroke(); }
  function ieRender(){ if(!ieState) return; const cv=$("#ieCanvas"), b=ieState.base; cv.width=b.width; cv.height=b.height; const g=ieCtx(); g.drawImage(b,0,0); ieState.strokes.forEach(st=>ieStroke(g,st)); }
  function ieHideCrop(){ $("#ieCropBox").hidden=true; $("#ieApply").hidden=true; ieStart=null; }
  function ieUndo(){ if(ieDrawing||!ieState||!ieHist.length) return; ieFut.push(ieSnap()); ieState=ieHist.pop(); ieHideCrop(); ieRender(); ieSync(); }
  function ieRedo(){ if(ieDrawing||!ieState||!ieFut.length) return; ieHist.push(ieSnap()); ieState=ieFut.pop(); ieHideCrop(); ieRender(); ieSync(); }
  function ieClearMarks(){ if(ieDrawing||!ieState||!ieState.strokes.length) return; iePush(); ieState={base:ieState.base, strokes:[]}; ieRender(); ieSync(); }
  function ieEndStroke(){ if(!ieDrawing) return; ieDrawing=false; const st=ieCur; ieCur=null; if(!st||!ieState) return;
    if(st.pts.length===1) ieStroke(ieCtx(),st);   // a tap leaves a dot
    iePush(); ieState={base:ieState.base, strokes:ieState.strokes.concat([st])}; ieSync(); }
  function openImageEditor(file){ if(!file||!activeId) return; const cv=$("#ieCanvas"); const url=URL.createObjectURL(file); const img=new Image();
    ieState=null; ieHist=[]; ieFut=[]; ieCur=null; ieSync();
    img.onload=function(){ let w=img.naturalWidth,h=img.naturalHeight; const max=1600; if(Math.max(w,h)>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const base=document.createElement("canvas"); base.width=w; base.height=h; base.getContext("2d").drawImage(img,0,0,w,h);
      ieState={base, strokes:[]}; ieHist=[]; ieFut=[]; ieRender(); ieSync(); try{ URL.revokeObjectURL(url); }catch(e){} };
    img.onerror=function(){ try{ URL.revokeObjectURL(url); }catch(e){} BPUI.toast("Couldn’t open that image.",{type:"err"}); };
    img.src=url;
    $("#ieCaption").value=""; const c=convs.find(x=>x.id===activeId); $("#ieTo").textContent=c?("To: "+convTitle(c)):"";
    ieSetMode(null); $("#imgEdit").hidden=false; $("#imgEdit").setAttribute("aria-hidden","false"); }
  function ieClose(){ $("#imgEdit").hidden=true; $("#imgEdit").setAttribute("aria-hidden","true"); ieMode=null; ieStart=null; ieDrawing=false; ieCur=null; ieState=null; ieHist=[]; ieFut=[]; ieSync(); }
  (function(){ const cv=$("#ieCanvas"), stage=$("#ieStage"), box=$("#ieCropBox");
    $("#ieClose").addEventListener("click",ieClose);
    $("#ieDraw").addEventListener("click",()=>ieSetMode("draw"));
    $("#ieCrop").addEventListener("click",()=>ieSetMode("crop"));
    $("#ieUndo").addEventListener("click",ieUndo);
    $("#ieRedo").addEventListener("click",ieRedo);
    $("#ieClear").addEventListener("click",ieClearMarks);
    // Ctrl/Cmd+Z undo · Ctrl/Cmd+Shift+Z or Ctrl+Y redo (the caption box keeps its own text undo)
    document.addEventListener("keydown",e=>{ if($("#imgEdit").hidden||!(e.ctrlKey||e.metaKey)||e.altKey) return;
      const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
      const k=String(e.key||"").toLowerCase();
      if(k==="z"&&!e.shiftKey){ e.preventDefault(); ieUndo(); }
      else if((k==="z"&&e.shiftKey)||(k==="y"&&!e.shiftKey)){ e.preventDefault(); ieRedo(); } });
    cv.addEventListener("pointerdown",e=>{ if(ieMode==="draw"){ if(!ieState) return; ieDrawing=true; const p=iePt(e); ieCur={color:IE_PEN, width:Math.max(3,cv.width/180), pts:[p]}; const g=ieCtx(); g.strokeStyle=ieCur.color; g.lineWidth=ieCur.width; g.lineCap="round"; g.lineJoin="round"; g.beginPath(); g.moveTo(p.x,p.y); e.preventDefault(); }
      else if(ieMode==="crop"){ const sr=stage.getBoundingClientRect(); ieStart={x:e.clientX,y:e.clientY}; box.hidden=false; box.style.left=(e.clientX-sr.left)+"px"; box.style.top=(e.clientY-sr.top)+"px"; box.style.width="0px"; box.style.height="0px"; $("#ieApply").hidden=true; e.preventDefault(); } });
    cv.addEventListener("pointermove",e=>{ if(ieMode==="draw"&&ieDrawing&&ieCur){ const p=iePt(e); ieCur.pts.push(p); const g=ieCtx(); g.lineTo(p.x,p.y); g.stroke(); }
      else if(ieMode==="crop"&&ieStart){ const sr=stage.getBoundingClientRect(); const l=Math.min(ieStart.x,e.clientX)-sr.left, t=Math.min(ieStart.y,e.clientY)-sr.top, w=Math.abs(e.clientX-ieStart.x), h=Math.abs(e.clientY-ieStart.y); box.style.left=l+"px"; box.style.top=t+"px"; box.style.width=w+"px"; box.style.height=h+"px"; $("#ieApply").hidden=(w<12||h<12); } });
    window.addEventListener("pointerup",()=>{ ieEndStroke(); if(ieMode==="crop") ieStart=null; });
    window.addEventListener("pointercancel",()=>{ ieEndStroke(); if(ieMode==="crop") ieStart=null; });
    $("#ieApply").addEventListener("click",()=>{ const cr=cv.getBoundingClientRect(), br=box.getBoundingClientRect();
      if(!ieState||!(cr.width>0)||!(cr.height>0)||!(br.width>=12)||!(br.height>=12)){ ieSetMode(null); return; }   // degenerate → abort (guards NaN/0)
      const sx=cv.width/cr.width, sy=cv.height/cr.height;
      let x=(br.left-cr.left)*sx, y=(br.top-cr.top)*sy, w=br.width*sx, h=br.height*sy;
      x=Math.max(0,Math.min(x,cv.width)); y=Math.max(0,Math.min(y,cv.height)); w=Math.min(w,cv.width-x); h=Math.min(h,cv.height-y);
      if(!(w>=4)||!(h>=4)){ ieSetMode(null); return; }
      // crop the clean photo; shift the strokes with it (marks outside the crop simply fall off-canvas)
      const tmp=document.createElement("canvas"); tmp.width=Math.round(w); tmp.height=Math.round(h); tmp.getContext("2d").drawImage(ieState.base,x,y,w,h,0,0,tmp.width,tmp.height);
      const fx=tmp.width/w, fy=tmp.height/h;
      const strokes=ieState.strokes.map(st=>({color:st.color, width:st.width, pts:st.pts.map(p=>({x:(p.x-x)*fx, y:(p.y-y)*fy}))}));
      iePush(); ieState={base:tmp, strokes}; ieRender(); ieSync(); ieSetMode(null); });
    $("#ieCaption").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#ieSend").click(); } });
    $("#ieSend").addEventListener("click",()=>{ const cap=$("#ieCaption").value; cv.toBlob(async(blob)=>{ if(!blob){ BPUI.toast("Couldn’t prepare the image.",{type:"err"}); return; } const f=new File([blob],"photo.jpg",{type:"image/jpeg"}); ieClose(); await sendImage(f,cap); }, "image/jpeg", 0.9); });
  })();

  /* ---------- sending ---------- */
  async function sendText(){ const ta=$("#msgInput"); const body=ta.value.trim(); const att=staged; if((!body&&!att)||!activeId) return;
    ta.value=""; autoGrow(); const r=replyTo; replyTo=null; $("#replyBar").hidden=true;
    staged=null; $("#attachBar").hidden=true; mpClose(); syncSend();
    const kind=att?"card":"text";
    // @mentions still present in the text (the server keeps only members of this chat)
    const mentions=[...mentionSel].filter(([,n])=>body.indexOf("@"+n)>=0).map(([id])=>id); mentionSel.clear();
    const meta=mentions.length?Object.assign({},att||{},{mentions}):(att||null);
    const tmp={id:"tmp-"+Date.now(),conversation_id:activeId,sender_id:ME.id,kind,body,meta,reply_to:r?r.id:null,created_at:new Date().toISOString(),_pending:true};
    pending.push(tmp); renderMessages();
    try{ await BPStore.chat.send(activeId,{kind,body,meta,reply_to:r?r.id:null}); pending=pending.filter(p=>p!==tmp); await loadThread(); await refresh(); localReadSync(); }
    catch(e){ pending=pending.filter(p=>p!==tmp); renderMessages(); BPUI.toast(BPUI.friendlyError(e,{action:"send the message"}),{type:"err"}); } }

  async function sendVoice(blob,dur){ if(!blob||!activeId) return;

  async function startRec(){ if(!navigator.mediaDevices||!window.MediaRecorder){ BPUI.toast("Voice notes aren’t supported here.",{type:"info"}); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ BPUI.toast("Microphone permission is needed.",{type:"err"}); return; }
    recChunks=[]; try{ rec=new MediaRecorder(stream); }catch(e){ rec=new MediaRecorder(stream,{mimeType:"audio/webm"}); }
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); }; rec._stream=stream; recStart=Date.now();
    $("#cbar").hidden=true; $("#recUI").hidden=false; tickRec(); recTimer=setInterval(tickRec,500); rec.start(); }
  function tickRec(){ const s=Math.floor((Date.now()-recStart)/1000); $("#recTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  function stopRec(send){ if(!rec) return; const dur=Math.max(1,Math.round((Date.now()-recStart)/1000)); clearInterval(recTimer);
    rec.onstop=async()=>{ try{ rec._stream.getTracks().forEach(t=>t.stop()); }catch(e){} if(send){ await sendVoice(new Blob(recChunks,{type:rec.mimeType||"audio/webm"}),dur); } rec=null; recChunks=[]; };
    try{ rec.stop(); }catch(e){} $("#recUI").hidden=true; $("#cbar").hidden=false; syncSend(); }

  /* ---------- @mention picker: type @ → the people in this chat ---------- */
  const mentionSel=new Map();   /* draft: user id → name inserted as "@Name" */
  const mp={open:false,start:-1,items:[],idx:0};
  function mentionCandidates(){ const c=convs.find(x=>x.id===activeId); if(!c) return [];
    const ids=c.kind==="broadcast"?Object.keys(roster):(thread.members||[]).map(m=>m.user_id);
    return [...new Set(ids)].filter(id=>id&&id!==ME.id&&roster[id]).map(id=>({id,name:personName(id)})).sort((a,b)=>a.name.localeCompare(b.name)); }
  function mpClose(){ mp.open=false; mp.items=[]; const el=$("#mentionPop"); if(el){ el.hidden=true; el.innerHTML=""; } }
  function mpRender(){ const el=$("#mentionPop");
    el.innerHTML=mp.items.map((p,i)=>`<button type="button" role="option" aria-selected="${i===mp.idx}" class="${i===mp.idx?'on':''}" data-i="${i}"><span class="av" style="background:${colorFor(p.id)}"${photoAttr(p.id)}>${esc(initials(p.name))}</span>${esc(p.name)}</button>`).join(""); paintAv(el);
    el.hidden=false; mp.open=true;
    el.querySelectorAll("button[data-i]").forEach(b=>b.addEventListener("mousedown",e=>{ e.preventDefault(); mpPick(+b.dataset.i); })); }
  function mpUpdate(){ const ta=$("#msgInput"); if(!activeId||!ta) return mpClose(); const pos=ta.selectionStart; const before=ta.value.slice(0,pos);
    const m=/(^|\s)@([^\s@]{0,30})$/.exec(before); if(!m) return mpClose();
    const q=m[2].toLowerCase(); const items=mentionCandidates().filter(p=>p.name.toLowerCase().indexOf(q)>=0).slice(0,8);
    if(!items.length) return mpClose();
    mp.start=pos-m[2].length-1; mp.items=items; if(mp.idx>=items.length) mp.idx=0; mpRender(); }
  function mpPick(i){ const p=mp.items[i]; const ta=$("#msgInput"); if(!p||mp.start<0) return mpClose();
    const ins="@"+p.name+" "; const end=ta.selectionStart;
    ta.value=ta.value.slice(0,mp.start)+ins+ta.value.slice(end); const caret=mp.start+ins.length;
    ta.setSelectionRange(caret,caret); mentionSel.set(p.id,p.name); mpClose(); ta.focus(); autoGrow(); syncSend(); }
  function mpKey(e){ if(!mp.open) return false;
    if(e.key==="ArrowDown"){ e.preventDefault(); mp.idx=(mp.idx+1)%mp.items.length; mpRender(); return true; }
    if(e.key==="ArrowUp"){ e.preventDefault(); mp.idx=(mp.idx-1+mp.items.length)%mp.items.length; mpRender(); return true; }
    if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); mpPick(mp.idx); return true; }
    if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); mpClose(); return true; }
    return false; }

      {k:"pin",label:pins.has(c.id)?"📌  Unpin chat":"📌  Pin to top",on:()=>{ if(pins.has(c.id))pins.delete(c.id); else pins.add(c.id); savePins(); renderConvs(); }},
      {k:"fav",label:favs.has(c.id)?"★  Remove from favorites":"☆  Add to favorites",on:()=>{ if(favs.has(c.id))favs.delete(c.id); else favs.add(c.id); saveFavs(); renderConvs(); }},
      {k:"mute",label:mutes.has(c.id)?"🔔  Unmute":"🔕  Mute notifications",on:()=>{ if(mutes.has(c.id))mutes.delete(c.id); else mutes.add(c.id); saveMutes(); renderConvs(); }}
    ];
    if(c.kind==="group") items.push({k:"add",label:"➕  Add members",on:addMembersModal});
    if(c.kind==="group"&&c.quote_id){
      items.push({k:"evref",label:"🔄  Refresh event details",on:refreshEventDetails});
      items.push({k:"evws",label:"⧉  Open event workspace",on:()=>{ location.href="event.html?id="+encodeURIComponent(c.quote_id); }}); }
    openMenu($("#headMenuBtn"),items); });

  async function refreshEventDetails(){ const c=convs.find(x=>x.id===activeId); if(!c||!c.quote_id) return;
    try{ const id=await BPStore.chat.eventGroups.refresh(c.id);
      if(id){ await loadThread(); await refresh(); BPUI.toast("Event details updated.",{type:"ok"}); }
      else BPUI.toast("Event details are already up to date.",{type:"info"}); }
    catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"refresh the event details"}),{type:"err"}); } }

  /* ---------- modals ---------- */
  function closeModal(){ const m=$("#modalOv"); if(m) m.remove(); }
  function others(){ return (BPStore.chat.isLocal()?BPStore.chat.localRoster():Object.values(roster)).filter(p=>p.id!==ME.id); }
  function prowAvatar(p){ return `<div class="av" style="width:40px;height:40px;font-size:14px;background:${colorFor(p.id)}"${p.avatar_path?` data-avatar-path="${esc(p.avatar_path)}"`:""}>${esc(initials(pname(p)))}</div>`; }
  function newDmModal(){ const people=others(); const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>New chat</h3><div class="body">${people.map(p=>`<div class="prow" data-id="${esc(p.id)}">${prowAvatar(p)}<div class="nm">${esc(pname(p))}</div><span class="rl">${esc(roleLbl(p.role))}</span></div>`).join("")||'<div style="padding:16px;color:var(--ink-3)">No teammates in your organization yet.</div>'}</div><div class="foot"><button class="btn" data-close>Cancel</button></div></div>`;
    document.body.appendChild(ov); paintAv(ov); ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); });
    ov.querySelectorAll(".prow").forEach(r=>r.addEventListener("click",async()=>{ closeModal(); try{ const id=await BPStore.chat.startDm(r.dataset.id); await refresh(); await openConv(id); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"start the chat"}),{type:"err"}); } })); }
  function newGroupModal(){ const people=others(); const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>New group</h3><input class="gname" id="gName" placeholder="Group name" aria-label="Group name"><div class="body">${people.map(p=>`<label class="prow">${prowAvatar(p)}<div class="nm">${esc(pname(p))}</div><input type="checkbox" value="${esc(p.id)}"></label>`).join("")||'<div style="padding:16px;color:var(--ink-3)">No teammates to add yet.</div>'}</div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="gCreate">Create</button></div></div>`;
    document.body.appendChild(ov); paintAv(ov); ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); });
    $("#gCreate").addEventListener("click",async()=>{ const name=$("#gName").value.trim(); if(!name){ $("#gName").focus(); return; } const ids=[...ov.querySelectorAll("input[type=checkbox]:checked")].map(c=>c.value);
      closeModal(); try{ const id=await BPStore.chat.createGroup(name,ids); await refresh(); await openConv(id); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"create the group"}),{type:"err"}); } }); }
  function addMembersModal(){ const c=convs.find(x=>x.id===activeId); if(!c) return; const inIds=(thread.members||[]).map(m=>m.user_id);
    const people=others().filter(p=>inIds.indexOf(p.id)<0); const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>Add members</h3><div class="body">${people.map(p=>`<label class="prow">${prowAvatar(p)}<div class="nm">${esc(pname(p))}</div><input type="checkbox" value="${esc(p.id)}"></label>`).join("")||'<div style="padding:16px;color:var(--ink-3)">Everyone is already in this group.</div>'}</div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="aAdd">Add</button></div></div>`;
    document.body.appendChild(ov); paintAv(ov); ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); });
    $("#aAdd").addEventListener("click",async()=>{ const ids=[...ov.querySelectorAll("input[type=checkbox]:checked")].map(c=>c.value); closeModal(); if(!ids.length) return;
      try{ await BPStore.chat.addMembers(activeId,ids); await loadThread(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"add members"}),{type:"err"}); } }); }

  /* ---------- realtime ---------- */
  // Mark the open conversation read whenever it's on screen (like WhatsApp): on
  // open, on focus, and when a new message lands while I'm looking at the thread.
  function bumpBell(){ try{ if(window.__bpBellRefresh) window.__bpBellRefresh(); }catch(e){} }
  function markActiveRead(){ if(!activeId) return; try{ BPStore.chat.markRead(activeId); }catch(e){} const c=convs.find(x=>x.id===activeId); if(c&&c._unread){ c._unread=0; renderConvs(); } bumpBell(); }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") markActiveRead(); });
  window.addEventListener("focus",markActiveRead);
  let rtT=null; function onRealtime(){ clearTimeout(rtT); rtT=setTimeout(async()=>{ await refresh(); if(activeId){ await loadThread(); if(document.visibilityState!=="hidden") markActiveRead(); } },250); }
  /* local demo only: BroadcastChannel doesn't echo to the sending tab, so after I
     send, pull the simulated teammate read-receipt (grey ✓✓ → blue ✓✓) in myself. */
  function localReadSync(){ if(!BPStore.chat.isLocal()) return; setTimeout(async()=>{ await refresh(); if(activeId) await loadThread(); },1500); }

  BPUI.boot(async ()=>{
    await BPStore.init(); await renderAccount();
    try{ await BPStore.bell.mount(document.querySelector("#bell")); }catch(e){}
    try{ if(await BPStore.auth.canView("controls")) $("#ccLink").hidden=false; }catch(e){}
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next=chat.html"); return; }
    try{
      if(!BPStore.chat) throw new Error("chat module unavailable");
      ME=await BPStore.chat.me();
      const r=await BPStore.chat.roster().catch(()=>[]); roster={}; r.forEach(p=>roster[p.id]=p);
      await refresh();
      try{ sub=BPStore.chat.subscribe(onRealtime,()=>{}); }catch(e){}
      window.addEventListener("beforeunload",()=>{ try{ sub&&sub.unsubscribe&&sub.unsubscribe(); }catch(e){} });
      const want=new URLSearchParams(location.search).get("c");
      if(want && convs.find(c=>c.id===want)) openConv(want);
      else { const b=convs.find(c=>c.kind==="broadcast"); if(b && window.innerWidth>760) openConv(b.id); }
    }catch(e){ backendReady=false; try{ renderConvs(); }catch(_){}
      console.warn("Chat backend not ready:",e); }
  });
})();
</script>
</body>
</html>
