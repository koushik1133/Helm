<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Chat has a bottom composer; the floating toggle would sit on the mic/send
     button, so we opt out of it and put a theme toggle in the header instead. -->
<meta name="bp-theme-toggle" content="off">
<title>Team Chat — Helm Events</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d28d9'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;
    --safe:#18a558;--warn:#e8912d;--danger:#c0362c;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}

  /* ---------- site header (same chrome as the rest of Helm) ---------- */
  header.apphead{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line-2);z-index:30}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  .brand h1{font-size:16px;margin:0;font-weight:700}
  .brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:16px;margin-left:18px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .nav a:hover{color:var(--accent)} .nav a.on{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-weight:700;text-transform:capitalize}
  .account button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .themebtn:hover{background:var(--panel-2)}

  /* ---------- two-pane chat ---------- */
  .app{flex:1;display:grid;grid-template-columns:min(380px,34%) 1fr;min-height:0}
  @media(max-width:760px){.app{grid-template-columns:1fr}.app.show-thread .side{display:none}.app:not(.show-thread) .thread{display:none}.nav{display:none}}
  .side{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .sidehead{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:12px 10px 10px 16px}
  .sidehead h2{font-size:18px;font-weight:700;margin:0;flex:1}
  .circbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .circbtn:hover{background:var(--panel-2)}
  .plus{background:var(--accent);color:#fff;width:38px;height:38px;border-radius:50%;font-size:21px}
  .plus:hover{filter:brightness(1.06)}
  .searchwrap{padding:0 14px 8px}
  .searchbar{display:flex;align-items:center;gap:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 13px;height:40px}
  .searchbar svg{width:15px;height:15px;fill:var(--ink-3);flex:0 0 auto}
  .searchbar input{flex:1;border:0;background:transparent;color:var(--ink);font-size:14px;outline:none;font-family:inherit}
  .searchbar input::placeholder{color:var(--ink-3)}
  .chips{display:flex;gap:7px;padding:2px 14px 10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .chip .ct{margin-left:3px}
  .convlist{flex:1;overflow-y:auto;min-height:0;padding-bottom:8px}
  .conv{display:flex;align-items:center;gap:12px;padding:0 14px;height:70px;cursor:pointer;border-bottom:1px solid var(--line-2)}
  .conv:hover{background:var(--panel-2)}
  .conv.on{background:var(--accent-soft)}
  .av{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;background:var(--accent)}
  .conv .meta{flex:1;min-width:0}
  .conv .meta .r1{display:flex;align-items:baseline;gap:8px}
  .conv .meta .nm{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .conv .meta .tm{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
  .conv .meta .tm.hilite{color:var(--accent);font-weight:600}
  .conv .meta .r2{display:flex;align-items:center;gap:6px;margin-top:3px}
  .conv .meta .pv{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .unread{min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:0 0 auto}
  .emptylist{padding:28px 20px;color:var(--ink-3);font-size:14px;text-align:center}

  /* ---------- thread ---------- */
  .thread{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .thead{flex:0 0 auto;display:flex;align-items:center;gap:13px;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--line-2)}
  .thead .bk{display:none;border:0;background:none;font-size:23px;cursor:pointer;color:var(--ink-2)}
  @media(max-width:760px){.thead .bk{display:block}}
  .thead .ti{flex:1;min-width:0}
  .thead .ti b{font-size:15.5px;font-weight:600;display:block}
  .thead .ti span{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .msgs{flex:1;overflow-y:auto;padding:16px 8% 10px;display:flex;flex-direction:column;gap:2px}
  .welcome{margin:auto;text-align:center;color:var(--ink-3);max-width:420px}
  .welcome .big{font-size:50px;opacity:.5;margin-bottom:10px}
  .welcome b{color:var(--ink-2);font-size:18px;font-weight:600;display:block;margin-bottom:4px}
  .daysep{align-self:center;background:var(--panel);border:1px solid var(--line);color:var(--ink-3);font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 13px;margin:10px 0}
  .m{max-width:min(560px,72%);display:flex;flex-direction:column;position:relative;margin-bottom:2px}
  .m.me{align-self:flex-end;align-items:flex-end}.m.them{align-self:flex-start}
  .m.grpstart{margin-top:8px}
  .bub{position:relative;border-radius:13px;padding:7px 11px 7px;font-size:14px;line-height:1.38;box-shadow:0 1px 1px rgba(20,27,46,.05);word-wrap:break-word;overflow-wrap:anywhere;min-width:80px;border:1px solid var(--line)}
  .m.them .bub{background:var(--panel);border-top-left-radius:4px}
  .m.me .bub{background:var(--accent-soft);border-color:transparent;border-top-right-radius:4px}
  .bub .who{font-size:12.5px;font-weight:700;margin-bottom:2px}
  .bub .reply{border-left:3px solid var(--accent);background:rgba(109,40,217,.08);border-radius:6px;padding:4px 8px;margin-bottom:5px;cursor:pointer}
  .bub .reply b{color:var(--accent);display:block;font-size:12px;font-weight:700}
  .bub .reply .rt{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;display:block}
  .bub .txt{white-space:pre-wrap}
  .bub img.photo{max-width:320px;max-height:340px;border-radius:9px;display:block;cursor:pointer;background:var(--panel-2);margin-bottom:3px}
  .bub .cap{margin-top:3px}
  .bub audio{height:40px;max-width:260px;margin:2px 0}
  .meta-in{float:right;margin:5px 0 -3px 10px;font-size:10.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:3px;line-height:1}
  /* WhatsApp-style receipts: single ✓ = sent, grey ✓✓ = delivered, blue ✓✓ = read */
  .tick{font-size:13px;color:var(--ink-3);display:inline-block}
  .tick.dbl{letter-spacing:-3px;margin-right:2px}
  .tick.read{color:#34b7f1}
  .reacts{display:flex;gap:3px;margin:-7px 6px 3px;position:relative;z-index:3}
  .m.me .reacts{justify-content:flex-end}
  .reacts .rx{background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:1px 7px;cursor:pointer;display:inline-flex;gap:3px;align-items:center;box-shadow:var(--shadow)}
  .reacts .rx.on{background:var(--accent-soft);border-color:var(--accent)}
  .mtools{position:absolute;top:1px;display:flex;opacity:0;pointer-events:none;transition:opacity .12s}
  .m:hover .mtools,.m:focus-within .mtools{opacity:1;pointer-events:auto}
  .m.me .mtools{left:-32px}.m.them .mtools{right:-32px}
  .mtools .caret{border:0;background:transparent;color:var(--ink-3);font-size:17px;cursor:pointer;padding:2px 5px}
  .rxpop{position:absolute;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow);z-index:40}
  .rxpop button{border:0;background:none;font-size:19px;cursor:pointer;padding:2px 4px;border-radius:50%}
  .rxpop button:hover{background:var(--panel-2);transform:scale(1.12)}

  /* ---------- composer ---------- */
  .composer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line-2);padding:9px 16px}
  .replybar{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-left:3px solid var(--accent);border-radius:7px;padding:6px 10px;margin-bottom:8px}
  .replybar .rc{flex:1;min-width:0}
  .replybar b{color:var(--accent);font-size:12.5px;display:block}
  .replybar span{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .replybar .x{cursor:pointer;color:var(--ink-3);font-size:19px;border:0;background:none}
  /* staged attachment (quote / layout) above the composer */
  .attachbar{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-left:3px solid var(--accent);border-radius:7px;padding:8px 10px;margin-bottom:8px}
  .attachbar .ac{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .attachbar .ac .ic{font-size:20px;flex:0 0 auto}
  .attachbar .ac b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attachbar .ac span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attachbar .x{cursor:pointer;color:var(--ink-3);font-size:19px;border:0;background:none;flex:0 0 auto}
  /* attachment card inside a message bubble */
  .bub .card{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:4px;min-width:min(260px,70vw);max-width:300px;text-decoration:none;color:inherit}
  .bub .card:hover{border-color:var(--accent)}
  .bub .card .cic{font-size:22px;flex:0 0 auto;line-height:1.2}
  .bub .card .cmeta{min-width:0;flex:1}
  .bub .card .cmeta b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bub .card .cmeta .csub{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bub .card .copen{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--accent)}
  .emojibar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px}
  .emojibar button{border:0;background:transparent;font-size:21px;padding:3px 5px;cursor:pointer;border-radius:7px}
  .emojibar button:hover{background:var(--panel)}
  .cbar{display:flex;align-items:center;gap:9px}
  .cbar .ic{width:38px;height:38px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:19px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cbar .ic:hover{background:var(--panel-2)}
  .inputwrap{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 6px}
  .cbar textarea{flex:1;border:0;background:transparent;color:var(--ink);font-size:15px;resize:none;max-height:120px;padding:9px 6px;line-height:1.4;outline:none;font-family:inherit}
  .cbar textarea::placeholder{color:var(--ink-3)}
  .send{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;font-size:17px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .recording{display:flex;align-items:center;gap:13px;width:100%}
  .recording .dot{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .recording .t{font-variant-numeric:tabular-nums}
  .recording .lbl{color:var(--ink-3);font-size:13.5px}
  .recording .rbtn{border:0;background:transparent;cursor:pointer;font-size:21px;padding:4px}
  .recording .trash{color:var(--danger)} .recording .go{color:var(--accent)}

  /* ---------- menus / modals ---------- */
  .menu{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 0;min-width:200px;z-index:50}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-size:14px;padding:10px 20px;cursor:pointer}
  .menu button:hover{background:var(--panel-2)}
  .menu .sep{height:1px;background:var(--line);margin:4px 0}
  .menu select{width:calc(100% - 24px);margin:6px 12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px;font-family:inherit}
  .ov{position:fixed;inset:0;background:rgba(20,15,35,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
  .modal h3{margin:0;padding:18px 20px 14px;font-size:17px;font-weight:700;border-bottom:1px solid var(--line-2)}
  .modal .body{padding:10px 12px;overflow-y:auto}
  .modal .foot{padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line-2)}
  .modal input.gname{width:calc(100% - 20px);margin:10px;background:var(--panel-2);border:1px solid var(--line);border-bottom:2px solid var(--accent);color:var(--ink);padding:9px 10px;font-size:15px;outline:none;font-family:inherit;border-radius:8px}
  .btn{border:1px solid var(--line);border-radius:9px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--ink)}
  .btn.primary{border:0;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
  .prow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;cursor:pointer}
  .prow:hover{background:var(--panel-2)}
  .prow .nm{flex:1;font-size:15px;font-weight:500}
  .prow .rl{font-size:12px;color:var(--ink-3);text-transform:capitalize}
  .prow input{width:18px;height:18px;accent-color:var(--accent)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:80;cursor:zoom-out}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:8px}
</style>
</head>
<body>
<a class="skip-link" href="#msgs">Skip to messages</a>
<header class="apphead">
  <div class="mark"></div>
  <div class="brand"><h1>Helm Events</h1><small>Team Chat</small></div>
  <nav class="nav">
    <a href="dashboard.html">🏠 Home</a>
    <a href="chat.html" class="on">Chat</a>
    <a href="quotes.html">Quotes</a>
    <a href="leads.html">Leads</a>
    <a href="crm.html">CRM</a>
    <a href="control.html" id="ccLink" hidden>Control Center</a>
  </nav>
  <span class="spacer"></span>
  <button class="themebtn" id="themeBtn" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme">☾</button>
  <span id="bell"></span>
  <span id="account" class="account" hidden></span>
</header>

<main class="app" id="app">
  <aside class="side">
    <div class="sidehead">
      <h2>Chats</h2>
      <button class="circbtn" id="menuBtn" title="Menu" aria-label="Chat menu" data-menu-anchor="1">⋮</button>
      <button class="circbtn plus" id="plusBtn" title="New chat" aria-label="New chat" data-menu-anchor="1">+</button>
    </div>
    <div class="searchwrap">
      <div class="searchbar">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="convSearch" type="search" placeholder="Search people &amp; chats" autocomplete="off" aria-label="Search chats">
      </div>
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="unread">Unread <span class="ct" id="unreadCt" hidden></span></button>
      <button class="chip" data-f="favorites">Favorites</button>
      <button class="chip" data-f="groups">Groups</button>
    </div>
    <div class="convlist" id="convList"></div>
  </aside>

  <section class="thread" id="thread">
    <div class="thead" id="thead" hidden>
      <button class="bk" id="backBtn" aria-label="Back">‹</button>
      <div class="av" id="tAv"></div>
      <div class="ti"><b id="tName">—</b><span id="tSub"></span></div>
      <button class="circbtn" id="headMenuBtn" title="Menu" aria-label="Conversation menu" data-menu-anchor="1">⋮</button>
    </div>
    <div class="msgs" id="msgs">
      <div class="welcome" id="welcome"><div class="big">💬</div><b>Helm Team Chat</b><p>Message your team — text, photos and voice notes, in real time. Pick a chat or start a new one with ＋.</p></div>
    </div>
    <div class="composer" id="composer" hidden>
      <div class="replybar" id="replyBar" hidden><div class="rc"><b id="replyWho"></b><span id="replyTxt"></span></div><button class="x" id="replyX" aria-label="Cancel reply">×</button></div>
      <div class="attachbar" id="attachBar" hidden><div class="ac" id="attachInfo"></div><button class="x" id="attachX" aria-label="Remove attachment">×</button></div>
      <div class="emojibar" id="emojiBar" hidden></div>
      <div class="cbar" id="cbar">
        <button class="ic" id="attachBtn" type="button" title="Attach" aria-label="Attach" data-menu-anchor="1">📎</button>
        <div class="inputwrap">
          <button class="ic" id="emojiBtn" type="button" title="Emoji" aria-label="Emoji" style="width:32px;height:32px;font-size:18px">😊</button>
          <textarea id="msgInput" rows="1" placeholder="Type a message" aria-label="Message"></textarea>
        </div>
        <button class="ic" id="camBtn" type="button" title="Take a photo" aria-label="Camera" style="font-size:18px">📷</button>
        <button class="send" id="micBtn" type="button" title="Record voice note" aria-label="Record voice note">🎤</button>
        <button class="send" id="sendBtn" type="button" title="Send" aria-label="Send" hidden>➤</button>
      </div>
      <div class="recording" id="recUI" hidden>
        <button class="rbtn trash" id="recCancel" title="Cancel" aria-label="Cancel recording">🗑</button>
        <span class="dot"></span><span class="t" id="recTime">0:00</span>
        <span class="lbl">Recording…</span>
        <span style="margin-left:auto"></span>
        <button class="rbtn go" id="recStop" title="Send" aria-label="Send voice note">➤</button>
      </div>
    </div>
  </section>
</main>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>

<link rel="stylesheet" href="theme.css?v=73">
<script src="telemetry.js?v=2"></script>
<script src="config.js?v=91"></script>
<script src="store-api.js?v=90"></script>
<script>
(function(){
  const $=(s,r)=>(r||document).querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const RX_EMOJI=["👍","❤️","😂","😮","😢","🙏"];
  const INS_EMOJI=["😀","😁","😂","🤣","😊","😍","😎","😉","🤔","😅","🙌","👏","👍","🙏","🎉","🔥","✅","❤️","💯","😢","😮","🚀","⭐","🌸","☕","🍾","👌","💪"];
  const NAME_COLORS=["#6d28d9","#4f46e5","#0ea5e9","#16a34a","#d97706","#dc2626","#db2777","#0891b2","#7c3aed","#0d9488"];
  let ME={id:null,name:"",email:""}, roster={}, convs=[], activeId=null, replyTo=null, staged=null, sub=null, thread={messages:[],reactions:[],members:[]}, convSearch="", filter="all", backendReady=true;
  let rec=null, recChunks=[], recStart=0, recTimer=null;
  let favs=new Set(); try{ favs=new Set(JSON.parse(localStorage.getItem("wa_fav")||"[]")); }catch(e){}
  const saveFavs=()=>{ try{ localStorage.setItem("wa_fav",JSON.stringify([...favs])); }catch(e){} };
  let pins=new Set(); try{ pins=new Set(JSON.parse(localStorage.getItem("wa_pin")||"[]")); }catch(e){}
  const savePins=()=>{ try{ localStorage.setItem("wa_pin",JSON.stringify([...pins])); }catch(e){} };
  let pending=[];  /* optimistic, in-flight messages (single ✓ "sending") */

  /* header theme toggle (floating one is disabled via meta on this page) */
  (function(){ const b=$("#themeBtn"); if(!b) return;
    const sync=()=>{ b.textContent=(document.documentElement.getAttribute("data-theme")==="dark")?"☀":"☾"; };
    sync();
    b.addEventListener("click",()=>{ const d=(document.documentElement.getAttribute("data-theme")==="dark")?"light":"dark";
      document.documentElement.setAttribute("data-theme",d); try{ localStorage.setItem("bp_theme",d); }catch(e){} sync(); });
  })();

  function colorFor(id){ let h=0; const s=String(id||""); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return NAME_COLORS[h%NAME_COLORS.length]; }
  function initials(name){ const p=String(name||"?").trim().split(/\s+/); return ((p[0]||"")[0]||"?").toUpperCase()+((p[1]||"")[0]||"").toUpperCase(); }
  function personName(id){ const p=roster[id]; return p?(p.full_name||p.email||"Member"):(id===ME.id?ME.name:"Member"); }
  function fmtTime(ts){ try{ return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
  function fmtListTime(ts){ try{ const d=new Date(ts),t=new Date(),y=new Date(t); y.setDate(t.getDate()-1);
    if(d.toDateString()===t.toDateString()) return fmtTime(ts); if(d.toDateString()===y.toDateString()) return "Yesterday";
    const diff=(t-d)/864e5; if(diff<7) return d.toLocaleDateString([], {weekday:"long"}); return d.toLocaleDateString([], {day:"numeric",month:"numeric",year:"2-digit"}); }catch(e){ return ""; } }
  function fmtDay(ts){ try{ const d=new Date(ts),t=new Date(),y=new Date(t); y.setDate(t.getDate()-1);
    if(d.toDateString()===t.toDateString()) return "Today"; if(d.toDateString()===y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"}); }catch(e){ return ""; } }

  function convOther(c){ if(c.kind!=="dm") return null;
    if(c.dm_key){ const ids=c.dm_key.split(":"); return ids[0]===ME.id?ids[1]:ids[0]; }
    const m=(c._members||[]).map(x=>x.user_id).find(x=>x!==ME.id); return m||null; }
  function convTitle(c){ if(c.kind==="broadcast") return c.title||"Everyone"; if(c.kind==="group") return c.title||"Group"; return personName(convOther(c)); }
  function convAvatar(c){ if(c.kind==="broadcast") return {bg:"var(--accent)",txt:"📢"}; if(c.kind==="group") return {bg:colorFor(c.id),txt:"👥"}; const o=convOther(c); return {bg:colorFor(o),txt:initials(personName(o))}; }
  function avHtml(a,id){ return `<div class="av"${id?' id="'+id+'"':''} style="background:${a.bg}">${a.txt}</div>`; }

  function closeMenus(){ document.querySelectorAll(".menu,.rxpop").forEach(m=>m.remove()); }
  document.addEventListener("click",(e)=>{ if(!e.target.closest(".menu")&&!e.target.closest(".rxpop")&&!e.target.closest("[data-menu-anchor]")&&!e.target.closest(".caret")) closeMenus(); });
  function openMenu(anchor, items){ closeMenus(); const r=anchor.getBoundingClientRect(); const m=document.createElement("div"); m.className="menu";
    m.innerHTML=items.map(it=>it.sep?'<div class="sep"></div>':`<button data-k="${esc(it.k)}">${esc(it.label)}</button>`).join("");
    document.body.appendChild(m); let top=r.bottom+4, left=Math.min(r.left, window.innerWidth-m.offsetWidth-8); if(left<8)left=8;
    if(top+m.offsetHeight>window.innerHeight-8) top=r.top-m.offsetHeight-4; m.style.top=top+"px"; m.style.left=left+"px";
    m.querySelectorAll("button[data-k]").forEach(b=>b.addEventListener("click",()=>{ const it=items.find(x=>x.k===b.dataset.k); closeMenus(); it&&it.on&&it.on(); }));
    return m; }

  /* ---------- account chip (same as other pages) ---------- */
  async function renderAccount(){
    const el=$("#account"); if(!BPStore.auth.enabled()){ el.hidden=true; return; } el.hidden=false;
    const u=BPStore.auth.user();
    if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{ await BPStore.auth.signOut(); location.href="dashboard.html"; });
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next=chat.html")); }
  }

  /* ---------- read receipts (single ✓ sent · grey ✓✓ delivered · blue ✓✓ read) ---------- */
  function readByOthers(m,members){ if(!m||m.sender_id!==ME.id) return null;
    const others=(members||[]).filter(x=>x.user_id!==ME.id);
    if(!others.length) return false;
    const readers=others.filter(x=>x.last_read_at && String(x.last_read_at)>=String(m.created_at));
    return readers.length===others.length; }
  function ticksHtml(m,members,pendingFlag){ if(pendingFlag) return '<span class="tick">✓</span>';
    const r=readByOthers(m,members); if(r===null) return "";
    return r?'<span class="tick dbl read">✓✓</span>':'<span class="tick dbl">✓✓</span>'; }

  /* ---------- attachment cards (quote / layout) ---------- */
  const inr=(n)=>{ const v=Number(n||0); try{ return "₹"+v.toLocaleString("en-IN"); }catch(e){ return "₹"+v; } };
  function cardLabel(m){ const mt=(m&&m.meta)||{}; if(mt.kind==="layout") return "📐 Layout"+(mt.name?": "+mt.name:""); return "📄 Quote"+(mt.code?": "+mt.code:(mt.title?": "+mt.title:"")); }
  function cardHtml(meta){ meta=meta||{};
    if(meta.kind==="quote"){ const sub=[meta.total?inr(meta.total):null, meta.status, meta.client, meta.event_date].filter(Boolean).join(" · ");
      return `<a class="card" href="quotes.html?focus=${encodeURIComponent(meta.code||meta.title||"")}"><span class="cic">📄</span><div class="cmeta"><b>${esc((meta.code?meta.code+" · ":"")+(meta.title||"Quote"))}</b><span class="csub">${esc(sub||"Quote")}</span><span class="copen">Open quote →</span></div></a>`; }
    if(meta.kind==="layout"){ const sub=(meta.object_count!=null?meta.object_count+" item"+(meta.object_count===1?"":"s"):"Floor layout");
      return `<a class="card" href="builder.html"><span class="cic">📐</span><div class="cmeta"><b>${esc(meta.name||"Layout")}</b><span class="csub">${esc(sub)}</span><span class="copen">Open in builder →</span></div></a>`; }
    return `<div class="card"><span class="cic">📎</span><div class="cmeta"><b>Attachment</b></div></div>`; }

  /* ---------- conversation list ---------- */
  function lastPreview(c){ const m=c._last; if(!m) return c.kind==="broadcast"?"Broadcast to your whole team":"No messages yet";
    const youTick=(m.sender_id===ME.id)?(ticksHtml(m,c._members,false)+" "):"";
    const who=(m.sender_id!==ME.id&&c.kind!=="dm")?(esc(personName(m.sender_id).split(" ")[0])+": "):"";
    const body=m.kind==="image"?"📷 Photo":m.kind==="voice"?"🎤 Voice message":m.kind==="card"?esc(cardLabel(m)):esc(m.body||"");
    return youTick+who+body; }
  function unreadCount(c){ if(!c._last) return 0; return (c._msgs||[]).filter(x=>x.sender_id!==ME.id && (!c._lastRead || x.created_at> c._lastRead)).length; }

  function renderConvs(){
    const q=convSearch.trim().toLowerCase();
    let list=convs.filter(c=>!q||convTitle(c).toLowerCase().includes(q));
    if(filter==="unread") list=list.filter(c=>c._unread>0);
    else if(filter==="groups") list=list.filter(c=>c.kind==="group"||c.kind==="broadcast");
    else if(filter==="favorites") list=list.filter(c=>favs.has(c.id));
    list.sort((a,b)=>{ const pa=pins.has(a.id)?1:0,pb=pins.has(b.id)?1:0; if(pa!==pb) return pb-pa;
      return String(b.last_message_at||"").localeCompare(String(a.last_message_at||"")); });
    const totalUnread=convs.reduce((s,c)=>s+(c._unread||0),0);
    const uc=$("#unreadCt"); if(totalUnread>0){ uc.hidden=false; uc.textContent=totalUnread; } else uc.hidden=true;
    const host=$("#convList");
    if(!list.length){ host.innerHTML=`<div class="emptylist">${!backendReady?"Chat isn’t set up on this workspace yet. An admin needs to finish chat setup — once that’s done, your team chats appear here.":q?"No chats found.":filter!=="all"?"Nothing here yet.":"No chats yet. Tap ＋ to start one."}</div>`; return; }
    host.innerHTML=list.map(c=>{ const a=convAvatar(c); const t=c._last?c._last.created_at:c.last_message_at;
      return `<div class="conv ${c.id===activeId?'on':''}" data-id="${esc(c.id)}" role="button" tabindex="0">
        ${avHtml(a)}
        <div class="meta"><div class="r1"><span class="nm">${esc(convTitle(c))}</span><span class="tm ${c._unread?'hilite':''}">${esc(fmtListTime(t))}</span></div>
          <div class="r2"><span class="pv">${lastPreview(c)}</span>${c._unread?`<span class="unread">${c._unread>99?'99+':c._unread}</span>`:`<span class="marks" style="display:inline-flex;gap:3px;align-items:center;color:var(--ink-3);font-size:12px">${pins.has(c.id)?'📌':''}${favs.has(c.id)?'★':''}</span>`}</div></div>
      </div>`; }).join("");
    host.querySelectorAll(".conv").forEach(el=>{ const go=()=>openConv(el.dataset.id);
      el.addEventListener("click",go); el.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }); });
  }

  async function refresh(){
    try{ convs=await BPStore.chat.conversations(); backendReady=true; }catch(e){ convs=[]; backendReady=false; }
    const mem=await BPStore.chat.myMemberships().catch(()=>({}));
    convs.forEach(c=>{ const m=mem[c.id]; c._lastRead=m&&m.last_read_at; });
    await Promise.all(convs.map(async c=>{ try{ const t=await BPStore.chat.thread(c.id,80); c._members=t.members; c._msgs=t.messages; c._last=t.messages[t.messages.length-1]||null; c._unread=unreadCount(c); }
      catch(e){ c._members=[]; c._last=null; c._unread=0; } }));
    renderConvs();
  }

  /* ---------- thread ---------- */
  async function openConv(id){
    activeId=id; $("#app").classList.add("show-thread");
    const c=convs.find(x=>x.id===id); if(!c) return;
    $("#thead").hidden=false; $("#composer").hidden=false; const w=$("#welcome"); if(w) w.hidden=true;
    const a=convAvatar(c); const av=$("#tAv"); av.style.background=a.bg; av.textContent=a.txt;
    $("#tName").textContent=convTitle(c);
    renderConvs(); await loadThread(); try{ await BPStore.chat.markRead(id); }catch(e){}
    setTimeout(()=>{ const c2=convs.find(x=>x.id===id); if(c2){ c2._unread=0; renderConvs(); } },300);
  }
  async function loadThread(){ if(!activeId) return;
    try{ thread=await BPStore.chat.thread(activeId); }catch(e){ thread={messages:[],reactions:[],members:[]}; }
    const c=convs.find(x=>x.id===activeId);
    if(c){ if(c.kind==="group") $("#tSub").textContent=(thread.members||[]).map(m=>m.user_id===ME.id?"You":personName(m.user_id).split(" ")[0]).join(", ")||"group";
      else if(c.kind==="broadcast") $("#tSub").textContent="Everyone in your team";
      else { const o=convOther(c); $("#tSub").textContent=(roster[o]&&(roster[o].email||roster[o].role))||""; } }
    renderMessages();
  }
  function reactsFor(mid){ const by={}; (thread.reactions||[]).filter(r=>r.message_id===mid).forEach(r=>{ (by[r.emoji]=by[r.emoji]||[]).push(r.user_id); }); return by; }

  function renderMessages(){
    const host=$("#msgs"); const c=convs.find(x=>x.id===activeId); const isGroup=c&&c.kind!=="dm";
    const msgs=thread.messages.concat(pending.filter(p=>p.conversation_id===activeId));
    if(!msgs.length){ host.innerHTML='<div class="welcome"><div class="big">👋</div><b>No messages yet</b><p>Say hello — this is the start of your conversation.</p></div>'; return; }
    let html="",lastDay="",lastSender=null;
    msgs.forEach(m=>{
      const day=fmtDay(m.created_at); if(day!==lastDay){ html+=`<div class="daysep">${esc(day)}</div>`; lastDay=day; lastSender=null; }
      const mine=m.sender_id===ME.id; const grpStart=(m.sender_id!==lastSender); lastSender=m.sender_id;
      const by=reactsFor(m.id); const rx=Object.keys(by).map(e=>`<span class="rx ${by[e].indexOf(ME.id)>=0?'on':''}" data-react="${esc(m.id)}" data-emoji="${esc(e)}">${e} ${by[e].length}</span>`).join("");
      let inner="";
      if(isGroup&&!mine&&grpStart) inner+=`<div class="who" style="color:${colorFor(m.sender_id)}">${esc(personName(m.sender_id))}</div>`;
      if(m.reply_to){ const rm=msgs.find(x=>x.id===m.reply_to); if(rm){ const rsnip=rm.kind==="image"?"📷 Photo":rm.kind==="voice"?"🎤 Voice message":rm.kind==="card"?cardLabel(rm):(rm.body||""); inner+=`<div class="reply" data-goto="${esc(rm.id)}"><b>${esc(rm.sender_id===ME.id?"You":personName(rm.sender_id))}</b><span class="rt">${esc(rsnip)}</span></div>`; } }
      if(m.kind==="image"){ inner+=`<img class="photo" data-media="${esc(m.media_path||"")}" alt="Photo" loading="lazy">`; if(m.body) inner+=`<div class="cap txt">${esc(m.body)}</div>`; }
      else if(m.kind==="voice"){ inner+=`<audio controls preload="none" data-media="${esc(m.media_path||"")}"></audio>`; }
      else if(m.kind==="card"){ inner+=cardHtml(m.meta); if(m.body) inner+=`<div class="cap txt">${esc(m.body)}</div>`; }
      else inner+=`<span class="txt">${esc(m.body||"")}</span>`;
      const ticks=mine?ticksHtml(m,thread.members,!!m._pending):"";
      inner+=`<span class="meta-in">${fmtTime(m.created_at)} ${ticks}</span>`;
      html+=`<div class="m ${mine?'me':'them'} ${grpStart?'grpstart':''}" tabindex="0" data-mid="${esc(m.id)}">
        <div class="bub">${inner}<div class="mtools"><button class="caret" data-caret="${esc(m.id)}" aria-label="Message menu">⌄</button></div></div>
        ${rx?`<div class="reacts">${rx}</div>`:""}</div>`;
    });
    host.innerHTML=html;
    host.querySelectorAll(".rx[data-react]").forEach(el=>el.addEventListener("click",()=>toggleReact(el.dataset.react,el.dataset.emoji,!el.classList.contains("on"))));
    host.querySelectorAll(".caret[data-caret]").forEach(el=>el.addEventListener("click",(e)=>{ e.stopPropagation(); msgMenu(el,el.dataset.caret); }));
    host.querySelectorAll(".reply[data-goto]").forEach(el=>el.addEventListener("click",()=>{ const t=host.querySelector('.m[data-mid="'+el.dataset.goto+'"]'); if(t){ t.scrollIntoView({block:"center"}); t.style.transition="background .3s"; t.style.background="var(--accent-soft)"; setTimeout(()=>t.style.background="",700); } }));
    host.querySelectorAll("img.photo").forEach(el=>el.addEventListener("click",()=>el.src&&lightbox(el.src)));
    host.querySelectorAll("[data-media]").forEach(async el=>{ const p=el.getAttribute("data-media"); if(!p) return; try{ el.src=await BPStore.chat.mediaUrl(p); }catch(e){} });
    host.scrollTop=host.scrollHeight;
  }
  function msgMenu(anchor,mid){ const r=anchor.getBoundingClientRect(); closeMenus();
    const m=document.createElement("div"); m.className="rxpop"; m.innerHTML=RX_EMOJI.map(e=>`<button data-e="${esc(e)}">${e}</button>`).join("")+`<button data-reply="1" title="Reply" style="font-size:15px">↩</button>`;
    document.body.appendChild(m); let left=Math.min(r.left-80,window.innerWidth-m.offsetWidth-8); if(left<8)left=8; let top=r.top-m.offsetHeight-4; if(top<8)top=r.bottom+4;
    m.style.top=top+"px"; m.style.left=left+"px";
    m.querySelectorAll("button[data-e]").forEach(b=>b.addEventListener("click",()=>{ closeMenus(); toggleReact(mid,b.dataset.e,true); }));
    m.querySelector("[data-reply]").addEventListener("click",()=>{ closeMenus(); setReply(mid); }); }
  async function toggleReact(mid,emoji,on){ try{ await BPStore.chat.react(mid,emoji,on); await loadThread(); }catch(e){} }
  function setReply(mid){ const m=thread.messages.find(x=>x.id===mid); if(!m) return; replyTo=m;
    $("#replyBar").hidden=false; $("#replyWho").textContent=m.sender_id===ME.id?"You":personName(m.sender_id);
    $("#replyTxt").textContent=m.kind==="image"?"📷 Photo":m.kind==="voice"?"🎤 Voice message":m.kind==="card"?cardLabel(m):(m.body||""); $("#msgInput").focus(); }
  $("#replyX").addEventListener("click",()=>{ replyTo=null; $("#replyBar").hidden=true; });
  function lightbox(src){ const o=document.createElement("div"); o.className="lightbox"; o.innerHTML=`<img src="${esc(src)}" alt="Photo">`; o.addEventListener("click",()=>o.remove()); document.body.appendChild(o); }

  /* ---------- sending ---------- */
  async function sendText(){ const ta=$("#msgInput"); const body=ta.value.trim(); const att=staged; if((!body&&!att)||!activeId) return;
    ta.value=""; autoGrow(); const r=replyTo; replyTo=null; $("#replyBar").hidden=true;
    staged=null; $("#attachBar").hidden=true; syncSend();
    const kind=att?"card":"text";
    const tmp={id:"tmp-"+Date.now(),conversation_id:activeId,sender_id:ME.id,kind,body,meta:att||null,reply_to:r?r.id:null,created_at:new Date().toISOString(),_pending:true};
    pending.push(tmp); renderMessages();
    try{ await BPStore.chat.send(activeId,{kind,body,meta:att||null,reply_to:r?r.id:null}); pending=pending.filter(p=>p!==tmp); await loadThread(); await refresh(); localReadSync(); }
    catch(e){ pending=pending.filter(p=>p!==tmp); renderMessages(); BPUI.toast(BPUI.friendlyError(e,{action:"send the message"}),{type:"err"}); } }
  async function sendImage(file){ if(!file||!activeId) return;
    try{ const up=await BPStore.chat.uploadMedia(activeId,file,{}); const r=replyTo; replyTo=null; $("#replyBar").hidden=true;
      await BPStore.chat.send(activeId,{kind:"image",media_path:up.path,media_mime:up.mime,reply_to:r?r.id:null}); await loadThread(); await refresh(); localReadSync(); }
    catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"send the photo"}),{type:"err"}); } }
  async function sendVoice(blob,dur){ if(!blob||!activeId) return;
    try{ const ext=(blob.type||"").indexOf("ogg")>=0?"ogg":(blob.type||"").indexOf("mp4")>=0?"m4a":"webm";
      const file=new File([blob],"voice."+ext,{type:blob.type||"audio/webm"});
      const up=await BPStore.chat.uploadMedia(activeId,file,{voice:true});
      await BPStore.chat.send(activeId,{kind:"voice",media_path:up.path,media_mime:up.mime,media_duration:dur}); await loadThread(); await refresh(); localReadSync(); }
    catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"send the voice note"}),{type:"err"}); } }

  async function startRec(){ if(!navigator.mediaDevices||!window.MediaRecorder){ BPUI.toast("Voice notes aren’t supported here.",{type:"info"}); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ BPUI.toast("Microphone permission is needed.",{type:"err"}); return; }
    recChunks=[]; try{ rec=new MediaRecorder(stream); }catch(e){ rec=new MediaRecorder(stream,{mimeType:"audio/webm"}); }
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); }; rec._stream=stream; recStart=Date.now();
    $("#cbar").hidden=true; $("#recUI").hidden=false; tickRec(); recTimer=setInterval(tickRec,500); rec.start(); }
  function tickRec(){ const s=Math.floor((Date.now()-recStart)/1000); $("#recTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  function stopRec(send){ if(!rec) return; const dur=Math.max(1,Math.round((Date.now()-recStart)/1000)); clearInterval(recTimer);
    rec.onstop=async()=>{ try{ rec._stream.getTracks().forEach(t=>t.stop()); }catch(e){} if(send){ await sendVoice(new Blob(recChunks,{type:rec.mimeType||"audio/webm"}),dur); } rec=null; recChunks=[]; };
    try{ rec.stop(); }catch(e){} $("#recUI").hidden=true; $("#cbar").hidden=false; syncSend(); }

  function autoGrow(){ const ta=$("#msgInput"); ta.style.height="auto"; ta.style.height=Math.min(120,ta.scrollHeight)+"px"; }
  function syncSend(){ const has=$("#msgInput").value.trim().length>0 || !!staged; $("#sendBtn").hidden=!has; $("#micBtn").hidden=has; }
  $("#msgInput").addEventListener("input",()=>{ autoGrow(); syncSend(); });
  $("#msgInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendText(); } });
  $("#sendBtn").addEventListener("click",sendText);
  $("#micBtn").addEventListener("click",startRec);
  $("#recStop").addEventListener("click",()=>stopRec(true));
  $("#recCancel").addEventListener("click",()=>stopRec(false));
  $("#attachBtn").addEventListener("click",()=>openMenu($("#attachBtn"),[
    {k:"photo",label:"📷  Photos",on:()=>$("#fileImg").click()},
    {k:"cam",label:"📸  Camera",on:()=>$("#fileCam").click()},
    {sep:true},
    {k:"quote",label:"📄  Attach quote",on:quotePicker},
    {k:"layout",label:"📐  Attach layout",on:layoutPicker},
  ]));
  $("#attachX").addEventListener("click",()=>{ staged=null; $("#attachBar").hidden=true; syncSend(); });

  /* ---------- attach quote / layout ---------- */
  function stageAttachment(meta,icon,title,sub){ staged=meta; $("#attachBar").hidden=false;
    $("#attachInfo").innerHTML=`<span class="ic">${icon}</span><div style="min-width:0"><b>${esc(title)}</b><span>${esc(sub||(meta.kind==="quote"?"Quote":"Layout"))}</span></div>`;
    $("#msgInput").focus(); syncSend(); }
  async function quotePicker(){ let list=[]; try{ list=await BPStore.quotes.list(); }catch(e){ list=[]; }
    pickerModal("Attach a quote","📄",(list||[]).map(q=>({ icon:"📄",
      title:(q.code?q.code+" · ":"")+(q.title||"Untitled"),
      sub:[q.total?inr(q.total):null,(q.lifecycleStage||q.status),q.client&&q.client.name].filter(Boolean).join(" · "),
      meta:{kind:"quote",ref_id:q.id,code:q.code||"",title:q.title||"Untitled",total:q.total||0,status:q.lifecycleStage||q.status||"",client:(q.client&&q.client.name)||"",event_date:q.eventDate||""} })),
      "No quotes yet. Create one in Quotes, then attach it here."); }
  async function layoutPicker(){ let list=[]; try{ list=await BPStore.list(); }catch(e){ list=[]; }
    pickerModal("Attach a layout","📐",(list||[]).map(l=>({ icon:"📐",
      title:l.name||"Untitled layout",
      sub:(l.objectCount!=null?l.objectCount+" item"+(l.objectCount===1?"":"s"):"Floor layout"),
      meta:{kind:"layout",ref_id:l.id,name:l.name||"Untitled layout",object_count:(l.objectCount!=null?l.objectCount:null)} })),
      "No layouts yet. Build one in the layout builder, then attach it here."); }
  function pickerModal(title,icon,rows,emptyText){ const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><input class="gname" id="pkSearch" placeholder="Search…" aria-label="Search" autocomplete="off"><div class="body" id="pkBody"></div><div class="foot"><button class="btn" data-close>Cancel</button></div></div>`;
    document.body.appendChild(ov); const body=$("#pkBody",ov);
    const draw=(q)=>{ const ql=(q||"").toLowerCase(); const f=rows.filter(r=>!ql||((r.title+" "+(r.sub||"")).toLowerCase().includes(ql)));
      body.innerHTML=f.length?f.map(r=>`<div class="prow" data-i="${rows.indexOf(r)}"><div class="av" style="width:40px;height:40px;font-size:18px;background:var(--accent-soft);color:var(--accent)">${r.icon}</div><div class="nm" style="font-weight:500"><b style="display:block;font-size:14.5px">${esc(r.title)}</b><span style="font-size:12px;color:var(--ink-3)">${esc(r.sub||"")}</span></div></div>`).join(""):`<div style="padding:18px;color:var(--ink-3)">${esc(emptyText)}</div>`;
      body.querySelectorAll(".prow[data-i]").forEach(el=>el.addEventListener("click",()=>{ const r=rows[+el.dataset.i]; closeModal(); stageAttachment(r.meta,r.icon,r.title,r.sub); })); };
    draw(""); $("#pkSearch",ov).addEventListener("input",e=>draw(e.target.value));
    ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); }); }
  $("#camBtn").addEventListener("click",()=>$("#fileCam").click());
  $("#fileImg").addEventListener("change",e=>{ const f=e.target.files[0]; e.target.value=""; sendImage(f); });
  $("#fileCam").addEventListener("change",e=>{ const f=e.target.files[0]; e.target.value=""; sendImage(f); });
  $("#backBtn").addEventListener("click",()=>$("#app").classList.remove("show-thread"));
  $("#convSearch").addEventListener("input",e=>{ convSearch=e.target.value; renderConvs(); });
  $("#chips").querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{ filter=ch.dataset.f; $("#chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===ch)); renderConvs(); }));
  (function(){ const bar=$("#emojiBar"); bar.innerHTML=INS_EMOJI.map(e=>`<button type="button">${e}</button>`).join("");
    bar.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ const ta=$("#msgInput"); ta.value+=b.textContent; ta.focus(); autoGrow(); syncSend(); }));
    $("#emojiBtn").addEventListener("click",()=>{ bar.hidden=!bar.hidden; }); })();

  /* ---------- header buttons ---------- */
  $("#plusBtn").addEventListener("click",()=>openMenu($("#plusBtn"),[
    {k:"dm",label:"💬  New chat",on:newDmModal},
    {k:"grp",label:"👥  New group",on:newGroupModal},
  ]));
  $("#menuBtn").addEventListener("click",()=>openMenu($("#menuBtn"),[
    {k:"dm",label:"💬  New chat",on:newDmModal},
    {k:"grp",label:"👥  New group",on:newGroupModal},
  ]));
  $("#headMenuBtn").addEventListener("click",()=>{ const c=convs.find(x=>x.id===activeId); if(!c) return;
    const items=[
      {k:"pin",label:pins.has(c.id)?"📌  Unpin chat":"📌  Pin to top",on:()=>{ if(pins.has(c.id))pins.delete(c.id); else pins.add(c.id); savePins(); renderConvs(); }},
      {k:"fav",label:favs.has(c.id)?"★  Remove from favorites":"☆  Add to favorites",on:()=>{ if(favs.has(c.id))favs.delete(c.id); else favs.add(c.id); saveFavs(); renderConvs(); }}
    ];
    if(c.kind==="group") items.push({k:"add",label:"➕  Add members",on:addMembersModal});
    openMenu($("#headMenuBtn"),items); });

  /* ---------- modals ---------- */
  function closeModal(){ const m=$("#modalOv"); if(m) m.remove(); }
  function others(){ return (BPStore.chat.isLocal()?BPStore.chat.localRoster():Object.values(roster)).filter(p=>p.id!==ME.id); }
  function prowAvatar(p){ return `<div class="av" style="width:40px;height:40px;font-size:14px;background:${colorFor(p.id)}">${esc(initials(p.full_name||p.email))}</div>`; }
  function newDmModal(){ const people=others(); const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>New chat</h3><div class="body">${people.map(p=>`<div class="prow" data-id="${esc(p.id)}">${prowAvatar(p)}<div class="nm">${esc(p.full_name||p.email)}</div><span class="rl">${esc(p.role||"")}</span></div>`).join("")||'<div style="padding:16px;color:var(--ink-3)">No teammates in your organization yet.</div>'}</div><div class="foot"><button class="btn" data-close>Cancel</button></div></div>`;
    document.body.appendChild(ov); ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); });
    ov.querySelectorAll(".prow").forEach(r=>r.addEventListener("click",async()=>{ closeModal(); try{ const id=await BPStore.chat.startDm(r.dataset.id); await refresh(); await openConv(id); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"start the chat"}),{type:"err"}); } })); }
  function newGroupModal(){ const people=others(); const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>New group</h3><input class="gname" id="gName" placeholder="Group name" aria-label="Group name"><div class="body">${people.map(p=>`<label class="prow">${prowAvatar(p)}<div class="nm">${esc(p.full_name||p.email)}</div><input type="checkbox" value="${esc(p.id)}"></label>`).join("")||'<div style="padding:16px;color:var(--ink-3)">No teammates to add yet.</div>'}</div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="gCreate">Create</button></div></div>`;
    document.body.appendChild(ov); ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); });
    $("#gCreate").addEventListener("click",async()=>{ const name=$("#gName").value.trim(); if(!name){ $("#gName").focus(); return; } const ids=[...ov.querySelectorAll("input[type=checkbox]:checked")].map(c=>c.value);
      closeModal(); try{ const id=await BPStore.chat.createGroup(name,ids); await refresh(); await openConv(id); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"create the group"}),{type:"err"}); } }); }
  function addMembersModal(){ const c=convs.find(x=>x.id===activeId); if(!c) return; const inIds=(thread.members||[]).map(m=>m.user_id);
    const people=others().filter(p=>inIds.indexOf(p.id)<0); const ov=document.createElement("div"); ov.className="ov"; ov.id="modalOv";
    ov.innerHTML=`<div class="modal"><h3>Add members</h3><div class="body">${people.map(p=>`<label class="prow">${prowAvatar(p)}<div class="nm">${esc(p.full_name||p.email)}</div><input type="checkbox" value="${esc(p.id)}"></label>`).join("")||'<div style="padding:16px;color:var(--ink-3)">Everyone is already in this group.</div>'}</div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="aAdd">Add</button></div></div>`;
    document.body.appendChild(ov); ov.addEventListener("click",e=>{ if(e.target===ov||e.target.hasAttribute("data-close")) closeModal(); });
    $("#aAdd").addEventListener("click",async()=>{ const ids=[...ov.querySelectorAll("input[type=checkbox]:checked")].map(c=>c.value); closeModal(); if(!ids.length) return;
      try{ await BPStore.chat.addMembers(activeId,ids); await loadThread(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action:"add members"}),{type:"err"}); } }); }

  /* ---------- realtime ---------- */
  // Mark the open conversation read whenever it's on screen (like WhatsApp): on
  // open, on focus, and when a new message lands while I'm looking at the thread.
  function markActiveRead(){ if(!activeId) return; try{ BPStore.chat.markRead(activeId); }catch(e){} const c=convs.find(x=>x.id===activeId); if(c&&c._unread){ c._unread=0; renderConvs(); } }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") markActiveRead(); });
  window.addEventListener("focus",markActiveRead);
  let rtT=null; function onRealtime(){ clearTimeout(rtT); rtT=setTimeout(async()=>{ await refresh(); if(activeId){ await loadThread(); if(document.visibilityState!=="hidden") markActiveRead(); } },250); }
  /* local demo only: BroadcastChannel doesn't echo to the sending tab, so after I
     send, pull the simulated teammate read-receipt (grey ✓✓ → blue ✓✓) in myself. */
  function localReadSync(){ if(!BPStore.chat.isLocal()) return; setTimeout(async()=>{ await refresh(); if(activeId) await loadThread(); },1500); }

  BPUI.boot(async ()=>{
    await BPStore.init(); await renderAccount();
    try{ await BPStore.bell.mount(document.querySelector("#bell")); }catch(e){}
    try{ if(await BPStore.auth.canView("controls")) $("#ccLink").hidden=false; }catch(e){}
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next=chat.html"); return; }
    try{
      if(!BPStore.chat) throw new Error("chat module unavailable");
      ME=await BPStore.chat.me();
      const r=await BPStore.chat.roster().catch(()=>[]); roster={}; r.forEach(p=>roster[p.id]=p);
      await refresh();
      try{ sub=BPStore.chat.subscribe(onRealtime,()=>{}); }catch(e){}
      window.addEventListener("beforeunload",()=>{ try{ sub&&sub.unsubscribe&&sub.unsubscribe(); }catch(e){} });
      const b=convs.find(c=>c.kind==="broadcast"); if(b && window.innerWidth>760) openConv(b.id);
    }catch(e){ backendReady=false; try{ renderConvs(); }catch(_){}
      console.warn("Chat backend not ready:",e); }
  });
})();
</script>
</body>
</html>
