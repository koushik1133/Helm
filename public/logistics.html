<style>
  :root{--bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;--safe:#18a558;--warn:#e8912d;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 60px}
  header{display:flex;align-items:center;gap:11px;padding:18px 0}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  header h1{font-size:16px;margin:0;font-weight:700} header small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:14px;margin-left:18px;font-size:13px;font-weight:600;color:var(--ink-2)} .nav a:hover{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .account button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .crumb{font-size:12px;color:var(--ink-3);margin:2px 0 14px} .crumb a{color:var(--accent)}

  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:8px 14px;border-radius:8px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}
  .tabs button .b{font-family:var(--mono);font-size:12px;opacity:.75;margin-left:5px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 4px} .card .sub{font-size:12px;color:var(--ink-3);margin:0 0 12px}
  .addrow{display:grid;gap:8px;align-items:end}
  .addrow.chk{grid-template-columns:1.8fr 1fr .8fr auto} .addrow.guest{grid-template-columns:2fr .8fr auto} .addrow.pay{grid-template-columns:1.6fr .9fr .9fr auto}
  @media(max-width:640px){.addrow{grid-template-columns:1fr 1fr!important}}
  @media(max-width:480px){.addrow{grid-template-columns:1fr!important} .wrap{padding:0 16px 48px} header{flex-wrap:wrap} .nav{margin-left:0;flex-wrap:wrap}}
  .fld{display:flex;flex-direction:column;gap:4px} .fld label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .fld input,.fld select{height:36px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:0 10px;font-family:inherit;font-size:13px;color:var(--ink)}
  .btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff} .btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.4}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
  th.num,td.num{text-align:right} tbody td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  .num{font-family:var(--mono)}
  .ssel{min-height:32px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;font-family:inherit;font-size:12px;padding:0 6px;color:var(--ink)}
  .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:20px}
  .st.open{background:#fff7e6;color:#946200} .st.done{background:#e7f6ee;color:#0f7a43} .st.na{background:#f1f3f7;color:var(--ink-3)}
  .st.due{background:#fff7e6;color:#946200} .st.invoiced{background:#eef2ff;color:#4457c8} .st.paid{background:#e7f6ee;color:#0f7a43} .st.waived{background:#f1f3f7;color:var(--ink-3)}
  .rm{border:1px solid var(--line);background:var(--panel);border-radius:7px;min-height:32px;min-width:32px;padding:0 9px;font-size:12px;cursor:pointer;color:var(--ink-3)} .rm:hover{color:#e5484d;border-color:#f5c6c6}
  .empty{text-align:center;color:var(--ink-3);padding:22px;font-size:13px}
  .totbar{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)}
  .totbar b{font-family:var(--mono);color:var(--ink)}
  footer{padding:24px 0 40px;color:var(--ink-3);font-size:12px;text-align:center}
  .err{background:#fdecec;color:#b42318;border-radius:8px;padding:8px 12px;font-size:12px}
  .lmodal{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .lmodal[hidden]{display:none!important}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(380px,96vw);padding:24px}
  .sheet h3{margin:0 0 12px}.foot{display:flex;gap:10px;justify-content:flex-end}
  th{position:relative} .table-scroll{position:relative}
  .crumb a,.sub a,a#floorLink{text-decoration:underline}
  html[data-theme="dark"] .tabs button.on{background:#7c3aed;color:#fff}
</style>

<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // shared staff+vendor people picker (populated once at init)
  let PEOPLE_OPTS=[];
  function peopleSelectHTML(elId, selected){
    const grp=(label,kind)=>{ const arr=PEOPLE_OPTS.filter(p=>p.kind===kind); return arr.length?`<optgroup label="${label}">`+arr.map(p=>`<option value="${esc(p.name)}" ${p.name===selected?"selected":""}>${esc(p.name)}${p.role?" · "+esc(p.role):""}</option>`).join("")+`</optgroup>`:""; };
    const custom=(selected&&!PEOPLE_OPTS.some(p=>p.name===selected))?`<option value="${esc(selected)}" selected>${esc(selected)}</option>`:"";
    return `<select id="${elId}" aria-label="Assign person" style="min-width:0"><option value="">Select person…</option>${custom}${grp("Staff","staff")}${grp("Vendors","vendor")}</select>`;
  }
  const inr=(n)=>"₹"+Number(n||0).toLocaleString("en-IN");
  const id=new URLSearchParams(location.search).get("quote")||new URLSearchParams(location.search).get("id");
  const CHK_ST={open:"Open",done:"Done",na:"N/A"}, PAY_ST={due:"Due",invoiced:"Invoiced",paid:"Paid",waived:"Waived"};
  let canEdit=false, canDelete=false, tab="compliance", ev=null;

  async function renderAccount(){ const el=$("#account"); if(!BPStore.auth.enabled()){el.hidden=true;return;} el.hidden=false;
    const u=BPStore.auth.user(); if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{await BPStore.auth.signOut();location.href="dashboard.html";});
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next="+encodeURIComponent(HelmUrl.here()))); } }

  const CHK_HELP={ logistics:"Transport, deliveries, movements — who does what, by when.",
    compliance:"Permits & compliance — licences, insurance, safety sign-offs.",
    comms:"Who tells whom what, and when — client, crew, vendors, guests." };

  function act(btn,fn,action){ return BPUI.guard(btn,async()=>{ try{ await fn(); }catch(e){ BPUI.toast(BPUI.friendlyError(e,{action}),{type:"err"}); } }); }
  const SPACER='<span aria-hidden="true" style="font-size:12px">&nbsp;</span>';
  async function renderPane(){
    try{ await renderPaneInner(); }
    catch(e){ BPUI.loadError($("#pane"),e,renderPane,{what:tab==="payments"?"the payment schedule":tab==="guests"?"guest groups":"this checklist"}); }
  }
  async function renderPaneInner(){
    if(tab==="payments") return renderPayments();
    if(tab==="guests") return renderGuests();
    // generic checklist (logistics / compliance / comms)
    const items = await BPStore.checklist.list(id, tab);
    const done = items.filter(i=>i.status==="done").length;
    $("#pane").innerHTML = `<h2>${tab[0].toUpperCase()+tab.slice(1)}</h2><p class="sub">${CHK_HELP[tab]}</p>
      ${canEdit?`<div class="addrow chk">
        <div class="fld"><label for="a_title">Item</label><input id="a_title" placeholder="what needs doing"></div>
        <div class="fld"><label for="a_owner">Owner</label>${peopleSelectHTML("a_owner","")}</div>
        <div class="fld"><label for="a_due">Due</label><input id="a_due" type="date" data-date-window="recent"></div>
        <div class="fld">${SPACER}<button type="button" class="btn primary" id="a_add">＋ Add</button></div></div>`:""}
      ${canEdit?'<div id="tplBar" style="margin:6px 0 12px"></div>':""}
      <div class="table-scroll"><table><thead><tr><th scope="col">Item</th><th scope="col">Owner</th><th scope="col">Due</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody>${items.length?items.map(rowChk).join(""):'<tr><td colspan="5" class="empty">Nothing here yet.</td></tr>'}</tbody></table></div>
      <div class="totbar"><span>${items.length} item${items.length===1?"":"s"} · <b>${done}</b> done</span></div>`;
    if(canEdit){ $("#a_add").addEventListener("click",()=>addChk(tab)); $("#a_title").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addChk(tab); } }); renderTplBar(tab); }
    wireRows("item");
  }
  async function renderTplBar(section){
    const bar=$("#tplBar"); if(!bar) return;
    let tpls=[]; try{ tpls=await BPStore.templates.list(section); }catch{ tpls=[]; }
    if(!tpls.length){ bar.innerHTML=""; return; }
    bar.innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-2)">
      <label for="tplPick">Apply a template:</label>
      <select id="tplPick" class="ssel" style="height:32px;max-width:100%">${tpls.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} (${(Array.isArray(t.items)?t.items.length:0)})</option>`).join("")}</select>
      <button type="button" class="btn" id="tplApply" style="height:32px">Apply</button></div>`;
    $("#tplApply").addEventListener("click",()=>{ const tid=$("#tplPick").value; if(!tid) return;
      act($("#tplApply"),async()=>{ const n=await BPStore.templates.applyTo(id,tid); await renderPane(); if(!n) BPUI.toast("That template has no items.",{type:"info"}); },"apply the template"); });
  }
  function rowChk(i){ const opts=["open","done","na"].map(s=>`<option value="${s}" ${s===i.status?"selected":""}>${CHK_ST[s]}</option>`).join("");
    return `<tr><td><b>${esc(i.title)}</b>${i.detail?`<div style="font-size:12px;color:var(--ink-3)">${esc(i.detail)}</div>`:""}</td>
      <td class="muted">${esc(i.owner||"")}</td><td class="muted">${esc(i.due_date||"")}</td>
      <td>${canEdit?`<select class="ssel" data-st="${esc(i.id)}" aria-label="Status for ${esc(i.title)}">${opts}</select>`:`<span class="st ${esc(i.status)}">${esc(CHK_ST[i.status]||i.status)}</span>`}</td>
      <td>${canDelete?`<button type="button" class="rm" data-del="${esc(i.id)}" data-name="${esc(i.title)}" aria-label="Remove ${esc(i.title)}">✕</button>`:""}</td></tr>`; }
  function wireRows(noun){
    document.querySelectorAll("#pane [data-st]").forEach(s=>s.addEventListener("change",()=>act(s,async()=>{ await BPStore.checklist.update(s.dataset.st,{status:s.value}); await renderPane(); },"update the status")));
    document.querySelectorAll("#pane [data-del]").forEach(b=>b.addEventListener("click",async()=>{
      if(!(await BPUI.confirm(`Remove the ${noun} “${b.dataset.name||""}”?`,{title:`Remove ${noun}?`,danger:true}))) return;
      await act(b,async()=>{ await BPStore.checklist.remove(b.dataset.del); await renderPane(); },"remove the "+noun); }));
  }
  function addChk(section){ const t=$("#a_title").value.trim(); if(!t){ $("#a_title").focus(); return; }
    return act($("#a_add"),async()=>{ await BPStore.checklist.add(id,{ section, title:t, owner:$("#a_owner").value.trim()||null, due_date:$("#a_due").value||null }); await renderPane(); },"add the item"); }

  async function renderGuests(){
    const items = await BPStore.checklist.list(id,"guests");
    const total = items.reduce((a,g)=>a+Number(g.qty||0),0);
    $("#pane").innerHTML = `<h2>Guests</h2><p class="sub">Track expected headcount by group (family, company, VIPs…). Totals help you match seating.</p>
      ${canEdit?`<div class="addrow guest">
        <div class="fld"><label for="g_name">Group</label><input id="g_name" placeholder="e.g. Bride's family"></div>
        <div class="fld"><label for="g_qty">Headcount</label><input id="g_qty" type="number" min="0" value="0"></div>
        <div class="fld">${SPACER}<button type="button" class="btn primary" id="g_add">＋ Add</button></div></div>`:""}
      <div class="table-scroll"><table><thead><tr><th scope="col">Group</th><th scope="col" class="num">Headcount</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody>${items.length?items.map(rowGuest).join(""):'<tr><td colspan="4" class="empty">No guest groups yet.</td></tr>'}</tbody></table></div>
      <div class="totbar"><span>Total expected guests: <b>${total}</b></span><span>${items.length} group${items.length===1?"":"s"}</span></div>`;
    if(canEdit) $("#g_add").addEventListener("click",addGuest);
    wireRows("group");
  }
  function rowGuest(g){ const opts=["open","done","na"].map(s=>`<option value="${s}" ${s===g.status?"selected":""}>${({open:"Pending",done:"Confirmed",na:"Declined"})[s]}</option>`).join("");
    return `<tr><td><b>${esc(g.title)}</b></td><td class="num">${esc(g.qty!=null?g.qty:0)}</td>
      <td>${canEdit?`<select class="ssel" data-st="${esc(g.id)}" aria-label="Status for ${esc(g.title)}">${opts}</select>`:esc(g.status)}</td>
      <td>${canDelete?`<button type="button" class="rm" data-del="${esc(g.id)}" data-name="${esc(g.title)}" aria-label="Remove group ${esc(g.title)}">✕</button>`:""}</td></tr>`; }
  function addGuest(){ const t=$("#g_name").value.trim(); if(!t){ $("#g_name").focus(); return; }
    const V=BPStore.validate;
    const gr=V.count($("#g_qty").value,{field:"Headcount"}); if(!gr.ok){ BPUI.toast(gr.error,{type:"err"}); return; }
    return act($("#g_add"),async()=>{ await BPStore.checklist.add(id,{ section:"guests", title:t, qty:gr.value }); await renderPane(); },"add the group"); }

  async function renderPayments(){
    const ms = await BPStore.milestones.list(id);
    const total=ms.reduce((a,m)=>a+Number(m.amount||0),0);
    const paid=ms.filter(m=>m.status==="paid").reduce((a,m)=>a+Number(m.amount||0),0);
    const due=ms.filter(m=>m.status!=="paid"&&m.status!=="waived").reduce((a,m)=>a+Number(m.amount||0),0);
    const phone=(ev.client&&(ev.client.phone))||"";
    $("#pane").innerHTML = `<h2>Payment schedule</h2><p class="sub">Milestones the client pays across the event. Reminders go through the notification outbox.</p>
      ${canEdit?`<div class="addrow pay">
        <div class="fld"><label for="m_label">Milestone</label><input id="m_label" placeholder="e.g. 50% advance"></div>
        <div class="fld"><label for="m_due">Due date</label><input id="m_due" type="date" data-date-window="recent"></div>
        <div class="fld"><label for="m_amt">Amount ₹</label><input id="m_amt" type="number" min="0" value="0"></div>
        <div class="fld">${SPACER}<button type="button" class="btn primary" id="m_add">＋ Add</button></div></div>`:""}
      <div class="table-scroll"><table><thead><tr><th scope="col">Milestone</th><th scope="col">Due</th><th scope="col" class="num">Amount</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody>${ms.length?ms.map(rowPay).join(""):'<tr><td colspan="5" class="empty">No milestones yet.</td></tr>'}</tbody></table></div>
      <div class="totbar"><span>Scheduled: <b>${inr(total)}</b></span><span style="color:#0f7a43">Paid: <b>${inr(paid)}</b></span><span style="color:#8f5f00">Outstanding: <b>${inr(due)}</b></span></div>`;
    if(canEdit) $("#m_add").addEventListener("click",addMile);
    document.querySelectorAll("#pane [data-mst]").forEach(s=>s.addEventListener("change",async()=>{
      const m=ms.find(x=>x.id===s.dataset.mst);
      if((s.value==="paid"||s.value==="waived") && !(await BPUI.confirm(`Mark “${m?m.label:"this milestone"}” (${inr(m&&m.amount)}) as ${PAY_ST[s.value].toLowerCase()}?${s.value==="paid"?" A cash receipt for this amount is recorded and can't be undone here.":""}`,{title:"Change payment status?",okLabel:"Mark "+PAY_ST[s.value].toLowerCase()}))){ s.value=m?m.status:s.value; return; }
      await act(s,async()=>{ await BPStore.milestones.setStatus(s.dataset.mst,s.value); await renderPane(); },"update the milestone"); }));
    document.querySelectorAll("#pane [data-mdel]").forEach(b=>b.addEventListener("click",async()=>{
      const m=ms.find(x=>x.id===b.dataset.mdel);
      if(!(await BPUI.confirm(`Remove the payment milestone “${m?m.label:""}” (${inr(m&&m.amount)})?`,{title:"Remove milestone?",danger:true}))) return;
      await act(b,async()=>{ await BPStore.milestones.remove(b.dataset.mdel); await renderPane(); },"remove the milestone"); }));
    document.querySelectorAll("#pane [data-remind]").forEach(b=>b.addEventListener("click",()=>{
      const m=ms.find(x=>x.id===b.dataset.remind);
      act(b,async()=>{
        // 0078: the server sends it (e-mail / WhatsApp per Control Center), deduped + logged on the event
        const r=await BPStore.comms.remindNow(m.id);
        if(r){ BPUI.toast(r.queued?"Reminder queued — it goes out on the next send run.":"A reminder for this milestone was just queued.",{type:r.queued?"ok":"info"}); return; }
        if(!phone){ BPUI.toast("No client phone on this event.",{type:"err"}); return; }
        await BPStore.milestones.sendReminder(id, phone, {label:m.label, amount:m.amount, due:m.due_date}); BPUI.toast("Reminder queued.",{type:"ok"}); },"send the reminder"); }));
  }
  function rowPay(m){ const opts=["due","invoiced","paid","waived"].map(s=>`<option value="${s}" ${s===m.status?"selected":""}>${PAY_ST[s]}</option>`).join("");
    return `<tr><td><b>${esc(m.label)}</b></td><td class="muted">${esc(m.due_date||"")}</td><td class="num">${inr(m.amount)}</td>
      <td>${canEdit&&m.status!=="paid"?`<select class="ssel" data-mst="${esc(m.id)}" aria-label="Status for ${esc(m.label)}">${opts}</select>`:`<span class="st ${esc(m.status)}">${esc(PAY_ST[m.status]||m.status)}</span>`}</td>
      <td>${canEdit&&m.status!=="paid"?`<button type="button" class="rm" data-remind="${esc(m.id)}" aria-label="Send reminder now for ${esc(m.label)}">Send reminder now</button> `:""}${canDelete&&m.status!=="paid"?`<button type="button" class="rm" data-mdel="${esc(m.id)}" aria-label="Remove milestone ${esc(m.label)}">✕</button>`:""}</td></tr>`; }
  function addMile(){ const l=$("#m_label").value.trim(); if(!l){ $("#m_label").focus(); return; }
    const V=BPStore.validate;
    const ar=V.money($("#m_amt").value,{field:"Amount"}); if(!ar.ok){ BPUI.toast(ar.error,{type:"err"}); return; }
    if(!(ar.value>0)){ BPUI.toast("Amount must be greater than 0 to add a milestone.",{type:"err"}); return; }
    return act($("#m_add"),async()=>{ await BPStore.milestones.add(id,{ label:l, due_date:$("#m_due").value||null, amount:ar.value }); await renderPane(); },"add the milestone"); }

  function openLogin(){ $("#loginModal").hidden=false; setTimeout(()=>$("#li_email").focus(),50); }
  $("#li_go").addEventListener("click",()=>{
    const em=$("#li_email").value.trim(), pw=$("#li_pass").value;
    if(!em||!pw){ $("#li_err").textContent="Enter your email and password."; $("#li_err").hidden=false; return; }
    $("#li_err").hidden=true;
    BPUI.guard($("#li_go"),async()=>{ try{ await BPStore.auth.signIn(em,pw); location.reload(); }
      catch(e){ $("#li_err").textContent=(e&&e.message)||"Sign in failed"; $("#li_err").hidden=false; } },{busyLabel:"Signing in…"});
  });
  $("#tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-t]"); if(!b) return;
    tab=b.dataset.t; $("#tabs").querySelectorAll("button").forEach(x=>{ x.classList.toggle("on",x===b); x.setAttribute("aria-pressed",String(x===b)); }); renderPane(); });

  BPUI.boot(async ()=>{
    await BPStore.init(); await renderAccount();
    $("#backLink").href = id?("event.html?id="+encodeURIComponent(id)):"quotes.html";
    if(!id){ $("#notfound").hidden=false; return; }
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next="+encodeURIComponent(HelmUrl.here())); return; }
    if(!(await BPStore.auth.requireView("ops"))) return;
    canEdit=await BPStore.auth.canEditArea("logistics"); canDelete=await BPStore.auth.can("delete");
    try{ PEOPLE_OPTS=await BPStore.people.options(); }catch{ PEOPLE_OPTS=[]; }
    // Payments are finance-only — hide that tab (and fall back off it) for roles without finance access
    if(!(await BPStore.auth.canView("finance"))){ const pb=document.querySelector('#tabs button[data-t="payments"]'); if(pb) pb.hidden=true; if(tab==="payments"){ tab="guests"; $("#tabs").querySelectorAll("button").forEach(x=>{ const on=x.dataset.t===tab; x.classList.toggle("on",on); x.setAttribute("aria-pressed",String(on)); }); } }
    try{ ev=await BPStore.quotes.get(id); }catch(e){ if(BPUI.isNotFound(e)){ $("#notfound").hidden=false; return; } throw e; }
    if(!ev){ $("#notfound").hidden=false; return; }
    $("#evName").textContent=(ev.code||"")+(ev.title&&ev.title!==ev.code?(" · "+ev.title):"");
    $("#app").hidden=false;
    await renderPane();
  });
</script>
</body>
</html>
