<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Workspace — Helm Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--bg:#f6f4f1;--panel:#fff;--panel-2:#faf8f5;--ink:#1b1930;--ink-2:#4b475f;--ink-3:#6b6577;
    --line:#e8e3db;--line-2:#f1ede7;--accent:#6d28d9;--accent-2:#4f46e5;--accent-soft:#efe9ff;--safe:#18a558;--warn:#e8912d;
    --shadow:0 1px 2px rgba(20,27,46,.06),0 10px 30px rgba(20,27,46,.10);
    --font:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px 60px}
  header{display:flex;align-items:center;gap:11px;padding:18px 0}
  .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:7px;border:2px solid rgba(255,255,255,.9);border-radius:3px}
  header h1{font-size:16px;margin:0;font-weight:700} header small{display:block;font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .nav{display:flex;gap:14px;margin-left:18px;font-size:13px;font-weight:600;color:var(--ink-2)} .nav a:hover{color:var(--accent)}
  .spacer{margin-left:auto}
  .account{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .account .role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .account button{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .ev{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .ev .code{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--accent)}
  .ev .ttl{font-size:18px;font-weight:600} .ev .meta{color:var(--ink-3);font-size:13px;margin-top:2px}
  .ev .tot{margin-left:auto;text-align:right} .ev .tot .amt{font-family:var(--mono);font-weight:700;font-size:20px}
  .stat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px;vertical-align:middle}
  .stat.q{background:#eef2ff;color:#4457c8} .stat.ok{background:#e7f6ee;color:#0f7a43} .stat.no{background:#fdecec;color:#b42318} .stat.st{background:#fff7e6;color:#946200}
  /* lifecycle stepper */
  .steps{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:6px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .step{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-3);cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .step .n{width:16px;height:16px;border-radius:50%;background:var(--line);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
  .step.done{background:#e7f6ee;border-color:#b6e3ca;color:#0f7a43} .step.done .n{background:#18a558}
  .step.active{background:var(--accent);border-color:transparent;color:#fff} .step.active .n{background:rgba(255,255,255,.4)}
  .step[disabled]{cursor:default;opacity:.9}
  .nextbar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .nextbar .hint{font-size:13px;color:var(--ink-2)} .nextbar .hint b{color:var(--ink)}
  .btn{height:36px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff} .btn:hover{border-color:var(--accent)}
  /* module cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .mod{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .mod .h{display:flex;align-items:center;gap:10px} .mod .h .ic{font-size:22px;flex:0 0 auto} .mod .h b{font-size:15px}
  .mod .sum{color:var(--ink-2);font-size:13px;flex:1} .mod .sum .big{font-family:var(--mono);font-weight:700;color:var(--ink)}
  .mod .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .mod.reco{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* more-tools toggle */
  .moretog{display:flex;justify-content:center;margin:4px 0 16px}
  .moretog button{height:34px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .moretog button:hover{border-color:var(--accent);color:var(--accent)}
  .morehead{grid-column:1/-1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:6px 0 -4px}
  .muted{color:var(--ink-3);font-size:12px}
  .lmodal{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
  .lmodal[hidden]{display:none!important}
  .lsheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(380px,94vw);padding:26px;text-align:center}
  .lsheet h3{font-size:18px;margin:8px 0 12px} .lsheet label{display:block;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
  .lsheet input{width:100%;height:38px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:0 12px;margin-bottom:12px;font-family:inherit}
  .lerr{background:#fdecec;color:#b42318;border:1px solid #f5c6c6;border-radius:8px;padding:8px 11px;font-size:12px;margin-bottom:12px}
</style>
<link rel="stylesheet" href="theme.css?v=72">
</head>
<body>
<div class="wrap">
  <header>
    <a href="dashboard.html" class="mark" title="Home"></a>
    <div><h1>Event Workspace</h1><small>Helm Events</small></div>
    <nav class="nav"><a href="dashboard.html">Home</a><a href="leads.html">Leads</a><a href="calendar.html">Calendar</a><a href="quotes.html">Quotes</a><a href="control.html">Control Center</a></nav>
    <span class="spacer"></span>
    <span id="bell"></span>
    <span id="account" class="account" hidden></span>
  </header>

  <div id="gate" class="card" hidden><p class="muted">Sign in to open this event.</p></div>
  <div id="notfound" class="card" hidden><p class="muted">Event not found. Go to <a href="quotes.html" style="color:var(--accent)">Quotes</a>.</p></div>

  <div id="app" hidden>
    <div class="card">
      <div class="ev">
        <div>
          <span class="code" id="code"></span> <span id="statusBadge"></span> <span id="apprBadge"></span>
          <div class="ttl" id="title"></div>
          <div class="meta" id="meta"></div>
          <div class="meta" id="dateRow" style="margin-top:6px"></div>
        </div>
        <div class="tot"><div class="muted">Total</div><div class="amt" id="total">—</div></div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="nextbar">
        <div class="hint" id="nextHint"></div>
        <span class="spacer"></span>
        <a class="btn" id="inviteBtn" hidden>✨ Invitation site</a>
        <button class="btn primary" id="advBtn" hidden>Advance to next stage →</button>
      </div>
    </div>

    <div id="conflictBanner"></div>
    <div class="grid" id="mods"></div>
  </div>
</div>

<div class="lmodal" id="loginModal" hidden>
  <form class="lsheet" id="loginForm">
    <div class="mark" style="margin:0 auto 10px"></div>
    <h3>Sign in</h3>
    <label>Email</label><input type="email" id="li_email" required>
    <label>Password</label><input type="password" id="li_pw" required>
    <div class="lerr" id="li_err" hidden></div>
    <button class="btn primary" id="li_submit" type="submit" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>

<script src="config.js?v=90"></script>
<script src="store-api.js?v=86"></script>
<script src="tour.js?v=4"></script>
<script>
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>(s||"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const inr=(n)=>"₹"+Number(n||0).toLocaleString("en-IN");
  const id=new URLSearchParams(location.search).get("id");

  // the lifecycle — a calm, guided path. Each stage carries the "next action" hint.
  const STAGES=[
    {k:"lead",label:"Lead",hint:"Capture the enquiry and qualify it.",mods:["discovery","quote"]},
    {k:"discovery",label:"Discovery",hint:"Meet the client and capture requirements before quoting.",mods:["discovery","quote"]},
    {k:"proposal",label:"Proposal",hint:"Share the concept and design direction.",mods:["proposal","layout","plandetails","quote"]},
    {k:"quote",label:"Quote",hint:"Lock the menu first, design the floor, then price the event.",mods:["plandetails","layout","quote"]},
    {k:"confirmed",label:"Confirmed",hint:"Lock the details and get the client's approval.",mods:["approval","plandetails"]},
    {k:"planning",label:"Planning",hint:"Assign tasks, plan resources and build the run-sheet.",mods:["resourceplan","runsheet","budget"]},
    {k:"resources",label:"Resources",hint:"Map needs, cover in-house, flag the gaps.",mods:["resourceplan","inventory","tasks"]},
    {k:"ready",label:"Ready",hint:"Pass the readiness gate, then brief the team.",mods:["readycheck","runsheet","logistics"]},
    {k:"event_day",label:"Event Day",hint:"Run the day and handle issues live.",mods:["command","issues"]},
    {k:"settlement",label:"Settlement",hint:"Tear down, then invoice, settle vendors and collect.",mods:["teardown","settle","budget"]},
    {k:"closed",label:"Closed",hint:"Feedback, P&L and archive.",mods:["closure"]},
  ];
  const stageIndex=(k)=>Math.max(0,STAGES.findIndex(s=>s.k===k));

  let ev=null, canEdit=false, canFin=false, canPipe=false, tasksSummary=null, staffSummary=null, vendorSummary=null, discSummary=null, propSummary=null, invSummary=null, resSummary=null, runSummary=null, budgetSummary=null, planSummary=null, logiSummary=null, readySummary=null, daySummary=null, issuesSummary=null, teardownSummary=null, settleSummary=null, closureSummary=null, mediaSummary=null, conflictSummary=null;
  const evTotal=()=> (ev && (ev.total!=null?ev.total:(ev.pricing&&ev.pricing.total))) || 0;
  const budgetRange=()=>{ const d=discSummary&&discSummary.disc; if(!d) return ""; const a=d.budget_min, b=d.budget_max;
    if(a!=null&&b!=null) return inr(a)+"–"+inr(b); if(a!=null) return "from "+inr(a); if(b!=null) return "up to "+inr(b); return ""; };

  function openLogin(){ $("#loginModal").hidden=false; setTimeout(()=>$("#li_email").focus(),50); }
  function closeLogin(){ $("#loginModal").hidden=true; $("#li_err").hidden=true; }
  async function renderAccount(){ const el=$("#account"); if(!BPStore.auth.enabled()){el.hidden=true;return;} el.hidden=false;
    const u=BPStore.auth.user(); if(u){ const role=await BPStore.auth.role();
      el.innerHTML=`<span class="role">${esc(role||"")}</span><span>${esc(u.email)}</span><button id="logoutBtn">Log out</button>`;
      $("#logoutBtn").addEventListener("click",async()=>{await BPStore.auth.signOut();location.href="dashboard.html";});
    } else { el.innerHTML=`<button id="loginBtn">Sign in</button>`; $("#loginBtn").addEventListener("click",()=>location.replace("login.html?next="+encodeURIComponent(location.pathname.split('/').pop()+location.search))); } }

  async function load(){
    await BPStore.init(); await renderAccount(); try{await BPStore.bell.mount(document.querySelector("#bell"));}catch{}
    if(!id){ $("#notfound").hidden=false; return; }
    if(BPStore.auth.enabled() && BPStore.auth.required() && !BPStore.auth.user()){ location.replace("login.html?next="+encodeURIComponent(location.pathname.split('/').pop()+location.search)); return; }
    if(!(await BPStore.auth.requireView("workspace"))) return;   // crew/client don't see the workspace
    canEdit = await BPStore.auth.can("edit");
    canFin  = await BPStore.auth.canView("finance");             // gates the Total + money cards
    canPipe = await BPStore.auth.canView("pipeline");            // gates the discovery/proposal cards
    try{ ev=await BPStore.quotes.get(id); }catch(e){ $("#notfound").hidden=false; return; }
    $("#app").hidden=false; render();   // paint the workspace shell instantly; summaries fill in below
    // All module summaries fire CONCURRENTLY (one burst of requests instead of ~22 serial
    // round-trips) so the workspace opens fast. Each guards itself and never blocks the others.
    const S = (fn) => fn().catch(() => {});
    await Promise.all([
      S(async()=>{ const t=await BPStore.ops.listTasks(id); tasksSummary={total:t.length, done:t.filter(x=>x.status==='completed').length}; }),
      S(async()=>{ const s=await BPStore.staff.forEvent(id); staffSummary={ people:s.length, tasks:s.reduce((a,x)=>a+(x.tasks||0),0) }; }),
      S(async()=>{ const b=await BPStore.bookings.list(id); vendorSummary={ total:b.length, confirmed:b.filter(x=>x.status && x.status!=='enquiry' && x.status!=='cancelled').length }; }),
      S(async()=>{ const [d,rq]=await Promise.all([BPStore.discovery.get(id), BPStore.discovery.listReqs(id)]);
        discSummary={ disc:d, total:rq.length, must:rq.filter(r=>r.priority==='mandatory').length }; }),
      S(async()=>{ propSummary=await BPStore.proposal.get(id); }),
      S(async()=>{ const rs=await BPStore.inventory.reservations(id); const active=rs.filter(r=>r.status==='reserved'||r.status==='allocated');
        invSummary={ total:rs.length, active:active.length }; }),
      S(async()=>{ const ck=await BPStore.resources.check(id);
        resSummary={ total:ck.length, gaps:ck.filter(c=>!c.covered).length, outsourced:ck.filter(c=>c.outsourced).length }; }),
      S(async()=>{ const rs=await BPStore.runsheet.list(id); const wt=rs.filter(x=>x.start_time);
        runSummary={ total:rs.length, first: wt.length?wt[0].start_time.slice(0,5):null }; }),
      S(async()=>{ budgetSummary=await BPStore.budget.summary(id); }),
      S(async()=>{ planSummary=await BPStore.plan.get(id); }),
      S(async()=>{ const [g,ms]=await Promise.all([BPStore.checklist.list(id,"guests"), BPStore.milestones.list(id)]);
        const guests=g.reduce((a,x)=>a+Number(x.qty||0),0);
        const outstanding=ms.filter(m=>m.status!=="paid"&&m.status!=="waived").reduce((a,m)=>a+Number(m.amount||0),0);
        logiSummary={ guests, outstanding }; }),
      S(async()=>{ readySummary=await BPStore.readiness.check(id); }),
      S(async()=>{ const [arr,chk]=await Promise.all([BPStore.dayops.list(id,"arrival"), BPStore.dayops.list(id,"check")]);
        daySummary={ here:arr.filter(a=>a.status==='arrived'||a.status==='left').length, arr:arr.length,
          checksDone:chk.filter(c=>c.status==='done').length, checks:chk.length }; }),
      S(async()=>{ const iss=await BPStore.issues.list(id); issuesSummary={ open:iss.filter(i=>i.status!=='resolved').length, total:iss.length }; }),
      S(async()=>{ const [rs,td]=await Promise.all([BPStore.inventory.reservations(id), BPStore.checklist.list(id,"teardown")]);
        teardownSummary={ retDone:rs.filter(r=>r.status==='returned').length, retTotal:rs.length, tdDone:td.filter(t=>t.status==='done').length, tdTotal:td.length }; }),
      S(async()=>{ settleSummary=await BPStore.settlement.summary(id); }),
      S(async()=>{ const [pl,c]=await Promise.all([BPStore.closure.pl(id), BPStore.closure.get(id)]);
        closureSummary={ profit:pl.profit, pct:pl.marginPct, closed:!!(c&&c.closed_at) }; }),
      S(async()=>{ const md=await BPStore.media.list(id); mediaSummary={ photos:md.filter(m=>m.kind==='photo').length, videos:md.filter(m=>m.kind==='video').length, gallery:md.filter(m=>m.in_gallery).length, total:md.length }; }),
      S(async()=>{ conflictSummary=await BPStore.calendar.conflictsForEvent(id); }),
    ]);
    render();   // re-paint with the loaded summaries
  }

  const statBadge=(s)=> s==="confirmed"?'<span class="stat ok">Confirmed</span>':s==="cancelled"?'<span class="stat no">Cancelled</span>':'<span class="stat q">Quote</span>';
  const apprBadge=(a)=> a==="paid"?'<span class="stat ok">Paid</span>':a==="approved"?'<span class="stat ok">Approved</span>':a==="sent"?'<span class="stat st">Sent for approval</span>':"";

  function render(){
    $("#code").textContent=ev.code;
    $("#statusBadge").innerHTML=statBadge(ev.status);
    $("#apprBadge").innerHTML=apprBadge(ev.approvalStatus);
    $("#title").textContent=ev.title||ev.code;
    const cl=ev.client||{};
    $("#meta").textContent=[ev.eventType, cl.name?("for "+cl.name):"", cl.eventDate||""].filter(Boolean).join(" · ")||"No client details yet";
    $("#total").textContent = canFin ? (evTotal()? inr(evTotal()):"—") : "—";
    const totWrap=$("#total").closest(".tot"); if(totWrap) totWrap.hidden=!canFin;
    renderDateRow();

    const cur=stageIndex(ev.lifecycleStage);
    $("#steps").innerHTML=STAGES.map((s,i)=>{
      const cls=i<cur?"done":i===cur?"active":"";
      return `<button class="step ${cls}" data-k="${s.k}" ${canEdit?"":"disabled"}><span class="n">${i<cur?"✓":i+1}</span>${s.label}</button>`;
    }).join("");
    if(canEdit) $("#steps").querySelectorAll(".step").forEach(b=>b.addEventListener("click",()=>setStage(b.dataset.k)));
    $("#nextHint").innerHTML=`<b>Now:</b> ${esc(STAGES[cur].hint)}`;
    const adv=$("#advBtn");
    if(canEdit && cur<STAGES.length-1){ adv.hidden=false; adv.textContent="Advance to "+STAGES[cur+1].label+" →"; adv.onclick=()=>setStage(STAGES[cur+1].k); }
    else adv.hidden=true;
    // Digital invitation website — unlocks once the event is confirmed (or beyond).
    const inv=$("#inviteBtn");
    if(canEdit && cur>=stageIndex("confirmed")){ inv.hidden=false; inv.href="invite-studio.html?quote="+encodeURIComponent(id); }
    else inv.hidden=true;

    renderMods(STAGES[cur].mods);
    renderConflicts();
  }
  function renderConflicts(){
    const el=$("#conflictBanner"); if(!el) return;
    const cs=conflictSummary||[];
    if(!cs.length){ el.innerHTML=""; return; }
    const ico={inventory:"📦",vendor:"🤝",staff:"👷",venue:"📍"};
    el.innerHTML=`<div class="card" style="border-color:#f5c6c6;background:#fdf2f2">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <b style="color:#b42318">⚠️ ${cs.length} scheduling conflict${cs.length===1?"":"s"} on this event's date</b>
        <a class="btn" href="calendar.html" style="margin-left:auto;height:30px">Open calendar →</a></div>
      ${cs.map(c=>`<div style="font-size:13px;color:var(--ink-2);padding:4px 0">${ico[c.type]||"⚠️"} <b>${esc(c.label||"")}</b> — ${esc(c.detail||"")}</div>`).join("")}</div>`;
  }

  function renderMods(recommended){
    const cl=ev.client||{};
    // menu-before-quote: pricing depends on the veg/non-veg plate mix, so warn until the menu is locked
    // (only in the pre-confirmation stages — once confirmed/planning onward it's moot)
    const preConfirm = ["lead","discovery","proposal","quote"].includes(ev.lifecycleStage||"quote");
    const menuLocked = !!(planSummary && planSummary.menu_locked);
    const menuGate = (preConfirm && !menuLocked && ev.status!=='confirmed')
      ? `<div class="stat q" style="display:block;background:#fff7e6;color:#946200;margin:0 0 6px;padding:5px 8px;border-radius:7px">⚠️ Lock the menu first — pricing depends on the veg/non-veg mix.</div>` : "";
    const discSum = discSummary && (discSummary.total || (discSummary.disc))
      ? `${discSummary.total} requirement${discSummary.total===1?"":"s"}${discSummary.must?` · <b>${discSummary.must} must-have${discSummary.must===1?"":"s"}</b>`:""}${budgetRange()?` · budget ${budgetRange()}`:""}`
      : "Meet the client and capture requirements &amp; budget.";
    const fromDisc = (discSummary && (budgetRange()||discSummary.must))
      ? `<div class="muted" style="margin-top:4px">From discovery: ${budgetRange()?budgetRange():""}${(budgetRange()&&discSummary.must)?" · ":""}${discSummary.must?discSummary.must+" must-have"+(discSummary.must===1?"":"s"):""}</div>` : "";
    const cards=[
      { key:"discovery", ic:"🔎", title:"Discovery & requirements", sum:discSum,
        acts:[{t: canEdit?"Open discovery":"View discovery", href:"discovery.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"plandetails", ic:"🏛", title:"Venue & menu",
        sum: planSummary && (planSummary.venue_name||planSummary.package||planSummary.menu) ? `${planSummary.venue_name?esc(planSummary.venue_name):"Venue set"}${planSummary.package?` · ${esc(planSummary.package)}`:""} ${planSummary.menu_locked?'<span class="stat ok">Menu locked</span>':'<span class="stat q">Draft</span>'}` : "Set the venue, access and lock the menu/package — decided before pricing.",
        acts:[{t: canEdit?"Open details":"View details", href:"plan.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"proposal", ic:"🎨", title:"Proposal & mood-board",
        sum: propSummary ? `${propSummary.published?'<span class="stat ok">Published</span>':'<span class="stat q">Draft</span>'} · ${(propSummary.scope&&propSummary.scope.length)||0} scope item${(propSummary.scope&&propSummary.scope.length)===1?"":"s"}${(propSummary.images&&propSummary.images.length)?` · ${propSummary.images.length} image${propSummary.images.length===1?"":"s"}`:""}` : "Compose a shareable concept &amp; mood-board.",
        acts:[{t: canEdit?"Open proposal":"View proposal", href:"proposal.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"layout", ic:"📐", title:"Floor layout", sum:`Design the 2D/3D plan for this event.`,
        acts:[{t:"Open builder", href:"builder.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"quote", ic:"🧾", title:"Quote & pricing", sum:`${menuGate}Version v${ev.currentVersion} · ${canFin?(evTotal()?inr(evTotal()):"not priced yet"):"—"} · <span class="stat ${ev.status==='confirmed'?'ok':'q'}">${ev.status}</span>${fromDisc}`,
        acts:[{t:"Open this quote", href:"quotes.html?focus="+encodeURIComponent(ev.code||id), primary:true}] },
      { key:"approval", ic:"✅", title:"Client approval", sum: ev.approvalStatus==='none'?"Not sent yet — confirm the quote, then send the approval link.":`Status: <b>${esc(ev.approvalStatus)}</b>`,
        acts:[{t:"Manage in Quotes", href:"quotes.html?focus="+encodeURIComponent(ev.code||id)}] },
      { key:"tasks", ic:"🛠️", title:"Tasks & staff", sum: tasksSummary?`${tasksSummary.done}/${tasksSummary.total} tasks done`:"Assign predefined tasks to your staff.",
        acts:[{t:"Open operations", href:"ops.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"staff", ic:"👷", title:"Staff on this event",
        sum: staffSummary && staffSummary.people ? `${staffSummary.people} staff assigned · ${staffSummary.tasks} task${staffSummary.tasks===1?"":"s"}` : "No staff assigned yet — assign staff in Operations.",
        acts:[{t:"View event staff", href:"staff.html?quote="+encodeURIComponent(id), primary:true},{t:"Assign", href:"ops.html?quote="+encodeURIComponent(id)}] },
      { key:"vendors", ic:"🤝", title:"Vendors & partners",
        sum: vendorSummary && vendorSummary.total ? `${vendorSummary.total} booked · ${vendorSummary.confirmed} confirmed` : "No vendors booked — book partners for the gaps.",
        acts:[{t:"View event vendors", href:"vendors.html?quote="+encodeURIComponent(id), primary:true},{t:"Book partners", href:"resources.html?quote="+encodeURIComponent(id)}] },
      { key:"runsheet", ic:"🗓️", title:"Run-sheet",
        sum: runSummary && runSummary.total ? `${runSummary.total} item${runSummary.total===1?"":"s"}${runSummary.first?` · starts ${runSummary.first}`:""}` : "Build the minute-by-minute event-day schedule.",
        acts:[{t: canEdit?"Open run-sheet":"View run-sheet", href:"runsheet.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"command", ic:"🎛️", title:"Event-day command",
        sum: daySummary && (daySummary.arr||daySummary.checks) ? `${daySummary.here}/${daySummary.arr} arrived · ${daySummary.checksDone}/${daySummary.checks} checks done` : "Run the live day — arrivals, attendance &amp; checks.",
        acts:[{t: canEdit?"Open command":"View day", href:"command.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"issues", ic:"🎫", title:"Issues & incidents",
        sum: issuesSummary && issuesSummary.total ? `${issuesSummary.open?`<b style="color:#b42318">${issuesSummary.open} open</b>`:'<span class="stat ok">all clear</span>'} · ${issuesSummary.total} logged` : "Log &amp; resolve live issues and incidents.",
        acts:[{t: canEdit?"Open issues":"View issues", href:"issues.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"readycheck", ic:"🚦", title:"Readiness gate",
        sum: readySummary ? (readySummary.ready ? '<span class="stat ok">Event Ready ✓</span>' : `<b>${readySummary.criticalPassed}/${readySummary.criticalTotal}</b> checks passed — ${readySummary.criticalTotal-readySummary.criticalPassed} to go`) : "Check the event is ready across everything.",
        acts:[{t:"Open readiness", href:"ready.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"logistics", ic:"🚚", title:"Logistics & payments",
        sum: logiSummary && (logiSummary.guests||logiSummary.outstanding) ? `${logiSummary.guests?`${logiSummary.guests} guests`:""}${logiSummary.guests&&logiSummary.outstanding?" · ":""}${logiSummary.outstanding?`<b style="color:#946200">${inr(logiSummary.outstanding)} outstanding</b>`:""}` : "Guests, permits, comms &amp; the payment schedule.",
        acts:[{t: canEdit?"Open logistics":"View logistics", href:"logistics.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"closure", ic:"📊", title:"Closure & P&L",
        sum: closureSummary ? `${closureSummary.closed?'<span class="stat ok">Closed</span> · ':''}Profit <b style="color:${closureSummary.profit>=0?'#0f7a43':'#b42318'}">${inr(closureSummary.profit)}</b>${closureSummary.pct!=null?` (${closureSummary.pct}%)`:""}` : "Feedback, P&amp;L, ratings &amp; archive.",
        acts:[{t:"Open closure", href:"closure.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"media", ic:"📸", title:"Media & gallery",
        sum: mediaSummary && mediaSummary.total ? `${mediaSummary.photos} photo${mediaSummary.photos===1?"":"s"} · ${mediaSummary.videos} video${mediaSummary.videos===1?"":"s"} · ${mediaSummary.gallery} in gallery` : "Collect photos &amp; videos and pick the client gallery.",
        acts:[{t: canEdit?"Open media":"View media", href:"media.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"settle", ic:"💳", title:"Settlement & billing",
        sum: settleSummary ? `${settleSummary.balance>0?`<b style="color:#b42318">${inr(settleSummary.balance)} due</b>`:'<span class="stat ok">client settled</span>'}${settleSummary.vendorOutstanding?` · ${inr(settleSummary.vendorOutstanding)} to vendors`:""}` : "Final invoice, vendor settlement &amp; expenses.",
        acts:[{t: canEdit?"Open settlement":"View settlement", href:"settlement.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"teardown", ic:"📦", title:"Teardown & returns",
        sum: teardownSummary && (teardownSummary.retTotal||teardownSummary.tdTotal) ? `${teardownSummary.retDone}/${teardownSummary.retTotal} stock returned · ${teardownSummary.tdDone}/${teardownSummary.tdTotal} teardown done` : "Return stock, exit vendors, hand over the venue.",
        acts:[{t: canEdit?"Open teardown":"View teardown", href:"teardown.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"budget", ic:"💰", title:"Budget & margin",
        sum: budgetSummary && (budgetSummary.estCost || budgetSummary.revenue) ? `${inr(budgetSummary.revenue)} rev · ${inr(budgetSummary.estCost)} cost · <b style="color:${budgetSummary.estMargin>=0?'#0f7a43':'#b42318'}">${inr(budgetSummary.estMargin)} margin${budgetSummary.estMarginPct!=null?` (${budgetSummary.estMarginPct}%)`:""}</b>${budgetSummary.pendingChanges?` · ${budgetSummary.pendingChanges} change${budgetSummary.pendingChanges===1?"":"s"} pending`:""}` : "Track costs vs the quote and see your margin.",
        acts:[{t: canEdit?"Open budget":"View budget", href:"budget.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"resourceplan", ic:"🧩", title:"Resource plan",
        sum: resSummary && resSummary.total ? `${resSummary.total} need${resSummary.total===1?"":"s"} · ${resSummary.gaps?`<b style="color:#b42318">${resSummary.gaps} gap${resSummary.gaps===1?"":"s"}</b>`:(resSummary.outsourced?`<span class="stat ok">all covered</span> · ${resSummary.outsourced} outsourced`:'<span class="stat ok">all in-house</span>')}` : "Map needs and flag what to outsource.",
        acts:[{t: canEdit?"Open resource plan":"View plan", href:"resources.html?quote="+encodeURIComponent(id), primary:true}] },
      { key:"inventory", ic:"📦", title:"Inventory & resources",
        sum: invSummary && invSummary.total ? `${invSummary.active} item${invSummary.active===1?"":"s"} reserved / allocated${invSummary.total>invSummary.active?` · ${invSummary.total-invSummary.active} closed`:""}` : "Reserve in-house stock for this event.",
        acts:[{t: canEdit?"Reserve stock":"View inventory", href:"inventory.html?quote="+encodeURIComponent(id), primary:true}] },
    ];
    const hide=new Set([...(canFin?[]:["budget","settle","closure"]), ...(canPipe?[]:["discovery","proposal"])]);
    const visible=cards.filter(c=>!hide.has(c.key));
    const cardHtml=(c)=>{
      const reco=recommended.includes(c.key)?"reco":"";
      return `<div class="mod ${reco}"><div class="h"><span class="ic">${c.ic}</span><b>${c.title}</b>${reco?'<span class="stat q" style="margin-left:auto">Next</span>':""}</div>
        <div class="sum">${c.sum}</div>
        <div class="act">${c.acts.map(a=>`<a class="btn ${a.primary?'primary':''}" href="${a.href}">${a.t}</a>`).join("")}</div></div>`;
    };
    // Stage-focused view: show the modules recommended for the current stage first, and tuck the
    // rest under a collapsible "More tools" section. Falls back to showing everything when the
    // stage has no visible recommended module.
    const focused=visible.filter(c=>recommended.includes(c.key));
    const rest=visible.filter(c=>!recommended.includes(c.key));
    let showAll=false; try{ showAll=localStorage.getItem("helm_ev_showall")==="1"; }catch{}
    if(!focused.length){
      // no specific recommendation for this stage — show all, no toggle
      $("#mods").innerHTML=visible.map(cardHtml).join("");
      setMoreToggle(null);
      return;
    }
    let html=focused.map(cardHtml).join("");
    if(showAll && rest.length) html+=`<div class="morehead">More tools</div>`+rest.map(cardHtml).join("");
    $("#mods").innerHTML=html;
    setMoreToggle(rest.length?{showAll, count:rest.length}:null);
  }
  // Manage the "Show all tools / Show less" toggle that sits just under the module grid.
  function setMoreToggle(state){
    const grid=$("#mods"); let bar=$("#moreToggle");
    if(!state){ if(bar) bar.remove(); return; }
    if(!bar){ bar=document.createElement("div"); bar.id="moreToggle"; bar.className="moretog";
      grid.parentNode.insertBefore(bar, grid.nextSibling); }
    bar.innerHTML=`<button type="button">${state.showAll?"Show less ▴":`Show all tools (${state.count} more) ▾`}</button>`;
    bar.querySelector("button").onclick=()=>{
      const next=!state.showAll; try{ localStorage.setItem("helm_ev_showall", next?"1":"0"); }catch{}
      renderMods(STAGES[stageIndex(ev.lifecycleStage)].mods);
    };
  }

  function renderDateRow(){
    const el=$("#dateRow"); const d=ev.eventDate||"", tm=ev.eventTime||"";
    const inp="height:28px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;font-family:inherit;font-size:12px;padding:0 6px;color:var(--ink)";
    // event date & time are decided first — warn while either is missing in the early stages
    const early = ["lead","discovery","proposal","quote"].includes(ev.lifecycleStage||"quote");
    const missing = early && (!d || !tm);
    const warn = missing ? `<span class="stat q" style="background:#fff7e6;color:#946200;margin-left:8px">⚠️ Set the event date &amp; time first</span>` : "";
    if(canEdit){ el.innerHTML=`📅 Event date: <input type="date" id="evDate" value="${esc(d)}" style="${inp}">
        <span style="margin-left:8px">🕒 Time:</span> <input type="time" id="evTime" value="${esc(tm)}" style="${inp}">${warn}`;
      $("#evDate").addEventListener("change",async()=>{ try{ const nd=$("#evDate").value||null;
          const client=Object.assign({}, ev.client||{}, { eventDate: nd });   // keep client.eventDate in sync (invoice/meta read it)
          await BPStore.quotes.updateMeta(id,{eventDate:nd, client}); ev.eventDate=nd; ev.client=client; renderDateRow(); }catch(e){ alert("Couldn't save date: "+((e&&e.message)||"error")); } });
      $("#evTime").addEventListener("change",async()=>{ try{ await BPStore.quotes.updateMeta(id,{eventTime:$("#evTime").value||null}); ev.eventTime=$("#evTime").value||null; renderDateRow(); }catch(e){ alert("Couldn't save time: "+((e&&e.message)||"error")); } });
    } else { el.innerHTML = (d||tm) ? ("📅 "+esc(d)+(tm?(" · 🕒 "+esc(tm)):"")) : ""; }
  }
  async function setStage(k){
    try{ await BPStore.quotes.setStage(id, k); ev.lifecycleStage=k; render(); }
    catch(e){ alert("Couldn't update stage: "+((e&&e.message)||"error")); }
  }

  $("#loginForm").addEventListener("submit",async e=>{ e.preventDefault();
    const btn=$("#li_submit"); btn.disabled=true; btn.textContent="Signing in…"; $("#li_err").hidden=true;
    try{ await BPStore.auth.signIn($("#li_email").value.trim(),$("#li_pw").value); closeLogin(); $("#gate").hidden=true; await load(); }
    catch(err){ $("#li_err").textContent=(err&&err.message)||"Sign-in failed"; $("#li_err").hidden=false; }
    finally{ btn.disabled=false; btn.textContent="Sign in"; } });
  $("#loginModal").addEventListener("click",e=>{ if(e.target.id==="loginModal"&&BPStore.auth.user()) closeLogin(); });
  load();
</script>
</body>
</html>
