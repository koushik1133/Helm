<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Helm mark (single source of truth). Two tilted pills. Theme-aware when used via <svg><use href="/brand/mark.svg#helm-mark">:
       pill 1 = currentColor, pill 2 has no stroke and inherits `stroke` from the host <svg> (page CSS sets .helm-mark stroke to the accent colour). See docs/LOGO-SWAP.md. -->
  <symbol id="helm-mark" viewBox="0 0 48 48">
    <g>
      <path d="M14.77 22.04L18.19 31.44" stroke-width="13" stroke-linecap="round" stroke="currentColor"/>
      <path d="M29.81 16.56L33.23 25.96" stroke-width="13" stroke-linecap="round"/>
    </g>
  </symbol>
  <use href="#helm-mark" color="#101511" stroke="#0d8a5c"/>
</svg>
