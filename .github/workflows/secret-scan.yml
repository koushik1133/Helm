name: Secret scan (gate)
# Runs on EVERY push and pull request. gitleaks scans the pushed / PR commit
# range with the repo's .gitleaks.toml (which now also catches human passwords:
# `password: <word>`, plaintext values in .sql seeds, shared/default-password
# tables and email+password pairings — not just key-shaped secrets) and FAILS
# the build on any hit. The `gate` job depends on it, so this is a required-style
# check: nothing merges past a detected credential. The weekly full-history scan
# lives in secret-scan-history.yml; this one guards the incoming change.
on:
  push:
    branches: [main, 'harden/**', 'chore/**', 'feat/**', 'fix/**', 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history so the PR/push diff range resolves
      - name: Secret scan (gitleaks) — fail on any committed credential
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  gate:
    name: Secret-scan gate
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no credential slipped through
        run: echo "secret-scan passed — no plaintext credentials in this change."
