name: Lighthouse CI (non-blocking)
# Runs Lighthouse against the local static front-end (node server.js on :4173)
# for index/login/dashboard. Uses npx @lhci/cli so NO dependency is committed.
# The whole job is non-blocking (continue-on-error) — perf budgets inform, they
# never fail a build or block a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true    # advisory only — never blocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse CI (starts server.js, budgets from lighthouserc.json)
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json
        env:
          PORT: '4173'
