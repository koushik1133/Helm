name: Lighthouse CI
# Runs Lighthouse against the local static front-end (node server.js on :4173)
# for / (landing), /login and /builder. Uses npx @lhci/cli so NO dependency is
# committed. BLOCKING: the key budgets in lighthouserc.json (performance,
# accessibility, FCP, LCP, TBT, CLS) are "error" assertions, set ~15% below the
# scores measured on 2026-09-30. best-practices / SEO / TTI stay advisory (warn).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse CI (starts server.js, budgets from lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json
        env:
          PORT: '4173'
