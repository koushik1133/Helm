name: CI
on:
  push:
    branches: [main, 'harden/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so the secret scan can inspect all commits
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Secret scan (gitleaks) — fail on any committed credential
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: JWT roles — no service_role / non-anon JWT in any tracked file
        run: node scripts/check-jwt-roles.mjs
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - name: Run zero-dependency checks
        run: node scripts/ci-check.mjs
      - name: Deployment containment (static-only) assertions
        run: node scripts/check-deploy-static.mjs
      - name: Migration-canon consistency guard (repo-only, no DB)
        run: node scripts/check-migration-canon.mjs
      - name: OTP-safety guard (no hardcoded PIN, repo-only)
        run: node scripts/check-otp-safety.mjs
      - name: Deferred integrations stay disabled (Razorpay/WhatsApp)
        run: node scripts/check-deferred-integrations.mjs
      - name: Environment-separation guard (no silent prod from localhost)
        run: node scripts/check-env-safety.mjs
      - name: CSP inline-script hashes current (no 'unsafe-inline')
        run: node scripts/gen-csp.mjs --check
      - name: Regression tests (source characterization, no DB)
        run: npm test
      - name: Local dev preserved (server.js /api/health 200)
        run: node scripts/check-local-api.mjs
      # Optional: verify a live preview/prod URL blocks /api (set DEPLOY_CHECK_URL in repo/CI vars)
      - name: Deployed /api containment (only if DEPLOY_CHECK_URL set)
        if: env.DEPLOY_CHECK_URL != ''
        run: node scripts/check-deploy-static.mjs
        env:
          DEPLOY_CHECK_URL: ${{ vars.DEPLOY_CHECK_URL }}
