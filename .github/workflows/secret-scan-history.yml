name: Secret scan (full history, weekly)
# audit run-3 ci/secret-scanning/gitleaks-and-jwt-check-gaps: ci.yml scans only the
# push / PR commit range. This job scans the WHOLE history every week (and on demand)
# with the repo's .gitleaks.toml + .gitleaksignore, so a credential that slipped in
# through a force-push, an old branch merge or a rule added later is still found.
# Gitleaks is a pinned release verified by SHA-256 (no floating download). No secrets.
on:
  schedule:
    - cron: '17 3 * * 1'        # Mondays 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Full-history scan (redacted output)
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: JWT / Supabase key roles (tracked files)
        run: node scripts/check-jwt-roles.mjs
