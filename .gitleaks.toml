# Gitleaks config for Helm.
# Extends the default ruleset and allowlists ONLY the exact Supabase anon keys
# that are committed on purpose (public/config.js: production; public/config.staging.js: staging). They are
# public-by-design, RLS-protected JWTs with role=anon — NOT secrets.
#
# There is deliberately NO path allowlist: any other credential added to
# public/config.js (or anywhere) is still reported. If a key is rotated, add the
# new anon JWT here as another exact literal (verify role=anon first with
# `node scripts/check-jwt-roles.mjs`, which also fails CI on any non-anon /
# service_role JWT in a tracked file). The full git history was scanned when this
# list was written (2026-09): these two are the only JWTs ever committed.
title = "Helm gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Exact committed Supabase anon keys (public-by-design, RLS-protected)."
regexTarget = "secret"
regexes = [
  # nqltzgiwznphugcfhmbm (role=anon)
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xbHR6Z2l3em5waHVnY2ZobWJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTg5NDYsImV4cCI6MjEwNDk3NDk0Nn0\.UWainTYBaCr8dNaugqWkCuLVh2H0TkiG6ZIFH6ZPKIQ$''',
  # xizehqgeyjcfpzrdymly (role=anon)
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpemVocWdleWpjZnB6cmR5bWx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTAyNTMsImV4cCI6MjEwNTc2NjI1M30\.KvL6N\-N7iIY7GzsxglWJRmP3JVZuXrHDeqQX1GWaZFo$''',
  # audit run-3 ci/secret-scanning: the dummy booklet-token UUID fixture in
  # test/client-booklet-ui.test.mjs (generic-api-key false positive that made
  # `gitleaks dir` and full-history scans exit 1). Exact literal only.
  '''^0b8c2f1e-1111-4222-8333-944445555666$''',
]

# audit run 2 (NV-11): a password written next to "password" in docs / HTML
[[rules]]
id = "helm-published-password"
description = "Password published in documentation"
regex = '''(?i)password[^<\n]{0,40}<code>[^<\s]{4,64}</code>'''
keywords = ["password"]

# audit run-3 ci/secret-scanning/gitleaks-and-jwt-check-gaps --------------------
# New-format Supabase keys. The default ruleset only sees env-style assignments.
[[rules]]
id = "helm-supabase-secret-key"
description = "Supabase secret API key (sb_secret_...) - server-only, never commit"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "helm-supabase-personal-access-token"
description = "Supabase personal access token (sbp_...) - Management API, never commit"
regex = '''\bsbp_(?:v0_)?[A-Fa-f0-9]{40}\b'''
keywords = ["sbp_"]

# The <code> rule above missed the same password written in markdown/plain text
# (inline code after "share", "staging", "password", ...). This catches a
# credential-shaped value (letters AND digits, 8-64 chars) in backticks, bold or
# quotes within 40 characters after password / credential / share / default /
# staging / login / sign-in wording, in docs-type files. Verified 2026-10-17: 0
# hits at HEAD, and it flags the two markdown commits the run-3 audit listed.
[[rules]]
id = "helm-doc-password-plain"
description = "Password written in documentation or plain text"
regex = '''(?i)\b(?:pass(?:word|wd|phrase)s?|credentials?|shares?|shared|default|staging|log ?in|sign[- ]?in)\b[^`*"]{0,40}(?:`|\*\*|")([A-Za-z0-9!#$%&+?^_~-]{8,64})(?:`|\*\*|")'''
secretGroup = 1
keywords = ["pass", "credential", "share", "default", "staging", "login", "log in", "sign"]
path = '''(?i)\.(?:md|markdown|txt|html?|csv)$'''
[[rules.allowlists]]
description = "Not credential-shaped: no digit, no letter, hex ids, snake/kebab identifiers, ENV_NAMES, placeholders"
regexTarget = "secret"
regexes = [
  '''^[^0-9]+$''',
  '''^[^A-Za-z]+$''',
  '''^[0-9a-fA-F]{7,64}$''',
  '''^[a-z0-9]+(?:[_-][a-z0-9]+)+$''',
  '''^[A-Z0-9]+(?:_[A-Z0-9]+)+$''',
  '''(?i)example|placeholder|changeme|your|xxxx|redacted''',
]

# ===========================================================================
# chore/secret-scan-hardening (2026-10-29): close the HUMAN-PASSWORD gap.
# The credential that slipped into git history was a short, human-chosen
# shared password (not a key-shaped secret), committed in a .sql seed, an HTML
# tester guide, and markdown login tables. The rules above only fire on md/html/
# txt/csv with the value wrapped in <code>/backtick/bold/quotes AND >= 8 chars,
# so a 4-char word like a shared test password, a bare `password: <word>`, or a
# plaintext value in a .sql seed all passed. The five rules below catch those
# shapes while keeping false positives low (env-var NAMES, hashed /
# gen_random_bytes / crypt values, emails, filenames, identifiers and
# placeholders are allowlisted). Pre-existing, already-known occurrences at HEAD
# (the historical shared "helm" password — fix is OWNER ROTATION per
# docs/OWNER-ACTIONS-SECURITY.md, not hiding — and local/test-only auth-fixture
# passwords in tests/db + supabase SQL) are fingerprinted in .gitleaksignore so
# the weekly full-history job stays green and only a NEW leak turns it red.
# All five were verified against reconstructed copies of the historical leak.
# ---------------------------------------------------------------------------

# A value assigned to a password-like key:  password: <value>   pwd = "<value>"
[[rules]]
id = "helm-password-assignment"
description = "Plaintext value assigned to a password-like key (password:/=, passwd, pwd)"
regex = '''(?i)\b(?:passwords?|passwd|passphrase|pwd)\b\s*[:=]\s*["'\x60]?([A-Za-z0-9][A-Za-z0-9!#$%&+?^_~.@/-]{2,63})["'\x60]?\s*(?:$|[\r\n);,<])'''
secretGroup = 1
keywords = ["password", "passwd", "passphrase", "pwd"]
path = '''(?i)\.(?:md|markdown|txt|html?|csv|tsv|sql|jsonc?|ya?ml|env|ini|conf|cfg|properties|sh)$'''
[[rules.allowlists]]
regexTarget = "secret"
description = "Not a real credential: env-var NAMES, identifiers, hashes, emails, filenames, placeholders"
regexes = [
  '''^[A-Z0-9]+(?:_[A-Z0-9]+)*$''',
  '''^[a-z0-9]+(?:[_-][a-z0-9]+)+$''',
  '''^[0-9a-fA-F]{7,64}$''',
  '''^[0-9]+$''',
  '''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$''',
  '''(?i)\.(?:sql|md|markdown|js|mjs|cjs|ts|tsx|html?|json|jsonc|ya?ml|env|txt|sh|csv|tsv|png|svg)$''',
  '''(?i)gen_random|gen_salt|crypt|digest|encode|sha\d|md5|pbkdf|argon|bcrypt|scrypt|\$2[aby]\$|\$argon''',
  '''(?i)^(?:null|nil|none|undefined|string|text|varchar|not|changeme|example|placeholder|redacted|xxx+|todo|tbd|p_password|new_password|old_password|current_password|always|never|required|optional|empty|blank|here|above|below|value|field|input|hash|hashed|reset|forced|strong|stronger|strength|weak|same|unknown|minimum|maximum|length|postgres|authenticator)$''',
  '''[${}%]''',
  '''^\.''',
]

# A password keyword immediately before a quoted literal:  password "<value>"   -- password: '<value>'
[[rules]]
id = "helm-password-quoted-adjacent"
description = "Password keyword immediately followed by a quoted credential literal (SQL comments, docs)"
regex = '''(?i)\b(?:passwords?|passwd|passphrase|pwd)\b[\s:=]{1,4}["'\x60]([A-Za-z0-9][A-Za-z0-9!#$%&+?^_~.@/-]{2,63})["'\x60]'''
secretGroup = 1
keywords = ["password", "passwd", "passphrase", "pwd"]
path = '''(?i)\.(?:md|markdown|txt|html?|csv|tsv|sql|jsonc?|ya?ml|env|ini|conf|cfg|properties|sh)$'''
[[rules.allowlists]]
regexTarget = "secret"
description = "Not a real credential"
regexes = [
  '''^[A-Z0-9]+(?:_[A-Z0-9]+)*$''',
  '''^[a-z0-9]+(?:[_-][a-z0-9]+)+$''',
  '''^[0-9a-fA-F]{7,64}$''',
  '''^[0-9]+$''',
  '''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$''',
  '''(?i)\.(?:sql|md|markdown|js|mjs|cjs|ts|tsx|html?|json|jsonc|ya?ml|env|txt|sh|csv|tsv|png|svg)$''',
  '''(?i)gen_random|gen_salt|crypt|digest|encode|sha\d|md5|pbkdf|argon|bcrypt|scrypt|\$2[aby]\$|\$argon''',
  '''(?i)^(?:null|nil|none|undefined|string|text|varchar|not|changeme|example|placeholder|redacted|xxx+|todo|tbd|p_password|new_password|old_password|current_password|postgres|authenticator)$''',
  '''[${}%]''',
]

# A SQL seed-user call pairing an email with a plaintext password and a role:
#   create_helm_user('a@studio.example', '<password>', 'admin')
[[rules]]
id = "helm-seed-account-credential"
description = "SQL *_user(...) seed pairing an email with a plaintext password and a role"
regex = '''(?i)[a-z_]*user\s*\(\s*'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'\s*,\s*'([A-Za-z0-9][A-Za-z0-9!#$%&+?^_~./-]{2,63})'\s*,\s*'(?:admin|planner|sales|operations|crew|client|manager|coordinator|quality|supervisor|worker|owner|staff|hq|superadmin)''''
secretGroup = 1
keywords = ["user("]
path = '''(?i)\.sql$'''
[[rules.allowlists]]
regexTarget = "secret"
description = "Generated / hashed values are not plaintext credentials"
regexes = [
  '''(?i)gen_random|gen_salt|crypt|digest|encode|decode|concat|format|substr|md5''',
  '''[${}%(]''',
]

# A tester login account paired with a credential (the dedicated synthetic domain):
#   | admin.a@synthetic.helm | <password> |    admin.a@synthetic.helm,<password>
[[rules]]
id = "helm-test-login-table"
description = "Tester login account (@synthetic.helm) paired with a credential value"
regex = '''(?i)[A-Za-z0-9._%+-]+@synthetic\.helm["'\x60]?\s*[,|:=\t]+\s*["'\x60]?([A-Za-z0-9][A-Za-z0-9!#$%&+?^_~./-]{2,63})["'\x60]?'''
secretGroup = 1
keywords = ["synthetic.helm"]
[[rules.allowlists]]
regexTarget = "secret"
description = "Role words / generated values are not the shared password"
regexes = [
  '''^[0-9a-fA-F]{7,64}$''',
  '''(?i)gen_random|gen_salt|crypt|encode''',
  '''(?i)^(?:admin|planner|sales|operations|crew|client|manager|coordinator|quality|supervisor|worker|role|owner|staff|user|member|guest|email|name|true|false|text|string|null|view|edit|full|a|b|c)$''',
  '''[${}%]''',
]

# A shared/default/common/temporary password published next to its value:
#   The default password is `<value>`.   All testers share one login: **<value>**
[[rules]]
id = "helm-shared-default-password"
description = "Shared/default/common/temporary password published with its value (short values too)"
regex = '''(?i)\b(?:shared|default|common|temporary|temp|demo|universal|same)\b[^\r\n`*"']{0,30}\b(?:passwords?|passwd|login|credentials?|passcode|pin)\b[^\r\n`*"']{0,24}["'\x60*]{1,2}([A-Za-z0-9][A-Za-z0-9!#$%&+?^_~./-]{2,63})["'\x60*]{1,2}'''
secretGroup = 1
keywords = ["password", "passwd", "login", "credential", "passcode", "pin"]
path = '''(?i)\.(?:md|markdown|txt|html?|csv|tsv|sql|jsonc?|ya?ml|env|ini|conf|cfg)$'''
[[rules.allowlists]]
regexTarget = "secret"
description = "Paths, emails, filenames, identifiers and generic words are not the password"
regexes = [
  '''^[A-Z0-9]+(?:_[A-Z0-9]+)*$''',
  '''^[a-z0-9]+(?:[_-][a-z0-9]+)+$''',
  '''^[0-9a-fA-F]{7,64}$''',
  '''^[0-9]+$''',
  '''/''',
  '''^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$''',
  '''(?i)\.(?:sql|md|markdown|js|mjs|ts|html?|json|ya?ml|env|txt|sh|csv)$''',
  '''(?i)gen_random|gen_salt|crypt|encode''',
  '''(?i)^(?:changeme|example|placeholder|redacted|your|xxx+|todo|tbd|value|above|below|field|null|none|string|text|the|each|all|every|reset|forced|minimum|maximum|length|prefer|do)$''',
  '''[${}%]''',
]
